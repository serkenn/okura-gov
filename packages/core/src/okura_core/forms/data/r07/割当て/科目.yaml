# 決算書・収支内訳書の科目の割当て（design-output UO19。2026-11-12）：必要経費の内訳のキー → 様式の科目。
#
# - 内訳のキーは、判定コアの概念「所得税.<所得>の必要経費の内訳.<キー>」（rules/income_kinds/breakdown.py）のキー。
#   記録の費目（中間表現の business_expense.attributes.expense_category の語彙：packages/ir/README.md §6.2）と、記録の費目でない内訳
#   （給与の支払・消費税等・資産の損失）からなる。どのキーも、表ごとにちょうど1つの科目に割り当てる（tests/test_forms_rows_kamoku.py が確かめる）。
# - 科目は様式に印字された科目の名前（表ごとに、帳票の対応表の欄の 対応 {科目: 名前} と同じ名前）。
#   一般用＝収支内訳書（一般用）・青色申告決算書（一般用）、不動産所得用（収支内訳書）・不動産所得用（決算書）。
# - 割当ての根拠：所得税法施行規則第47条の3（内訳書の必要経費の区分：売上原価・雇人費・外注工賃・減価償却費・貸倒金・地代家賃・利子割引料・その他の経費）と
#   様式の科目の印字、収支内訳書の書き方 p.2「必要経費の各科目の具体例」（租税公課に税金と同業者団体などの会費・組合費・税込経理の消費税等の納付税額、
#   通信費に電話料・切手代、消耗品費に事務用品・ガソリン・少額の備品）、不動産所得用の書き方 p.2（借入金利子・租税公課・損害保険料・修繕費・雑費）。
# - 様式に印字された科目のどれにも当たらないキーは、様式の規則どおり「その他の経費」の区画の雑費（不動産所得用の決算書は「その他の経費」の行）に入れる。
#   科目名の印字のない空欄の行（一般用 ヲ〜タ・25〜30、不動産所得用 ニ・⑫〜⑯）は使わない（利用者が科目名を書いて使う行で、既定の割当てを置かない）。
# - 割当ての変更（利用者が空欄の行に別の科目を立てるなど）は、選択.様式への割当て（C-18）の窓口があるが、この版の対応表は既定の割当てだけを使う（README §4）。
#   （2026-11-12：選択.様式への割当て を読むようにした。ある費目の額を別の費目のこの表の科目へ移す。空欄の行への割当ては受け付けない：README §4.1）
