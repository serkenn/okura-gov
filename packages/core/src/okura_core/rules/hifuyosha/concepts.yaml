    パラメータ: [健保.被扶養者の収入の基準額, 健保.被扶養者の年齢の区分]
    注: >-
      2026-11-11（共有の担当）：国民年金の第3号被保険者の生計維持（国年令第4条：健保の被扶養者の認定の取扱いを勘案）が使う窓口。
      被扶養者の割当て（グループ）によらず、その人を健康保険の被保険者の配偶者とみなした区分の額（健保.収入の基準額 と同じ関数・同じパラメータ）

