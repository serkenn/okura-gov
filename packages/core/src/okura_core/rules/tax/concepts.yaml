    値の型: 真偽
    依存する概念: [所得税.課税総所得金額に対する税額, 所得税.課税退職所得金額に対する税額, 所得税.上場株式等に係る課税配当所得等の金額に対する税額, 所得税.上場株式等に係る課税譲渡所得等の金額に対する税額, 所得税.配当控除の額, 所得税.年末調整で控除された住宅借入金等特別控除の額, 所得税.還付される税額, 所得税.給与等の収入金額, 所得税.公的年金等の収入金額, 所得税.合計所得金額, 所得税.給与所得の金額, 所得税.所得金額調整控除, 所得税.退職所得の金額, 所得税.青色申告特別控除額, 所得税.公的年金等に係る雑所得の金額, 所得税.給与等の支払者の数, 所得税.給与等の全部が源泉徴収の対象か, 所得税.給与等の全部が年末調整の対象か, 所得税.従たる給与等の金額, 所得税.従たる給与等の金額が分かるか, 所得税.公的年金等の全部が源泉徴収の対象か, 所得税.給与等が第121条第1項の適用除外か, 所得税.退職手当等の全部が源泉徴収の対象か, 所得税.退職手当等の源泉徴収税額, 所得税.社会保険料控除の額, 所得税.小規模企業共済等掛金控除の額, 所得税.生命保険料控除の額, 所得税.地震保険料控除の額, 所得税.障害者控除の額, 所得税.寡婦控除の額, 所得税.ひとり親控除の額, 所得税.勤労学生控除の額, 所得税.配偶者控除の額, 所得税.配偶者特別控除の額, 所得税.扶養控除の額, 所得税.特定親族特別控除の額]
