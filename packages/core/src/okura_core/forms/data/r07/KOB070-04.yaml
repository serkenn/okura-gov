# 給与所得者の特定支出に関する明細書 4面（e-Tax 様式ID KOB070。帳票フィールド仕様書 KOB070 7.0 の項番 77〜86：支出の明細 39行。2026-11-12 の3回目に足した）。
# 3面（KOB070-03）の続き。行の数は入力の事実なので、使うかは利用アプリが決める。
