# 概念辞書：規則モジュール kyuyo（給与所得）が担当する概念。項目の書き方は concepts/__init__.py の docstring。
# 出典は docs のファイル#節（公開資料の情報・実測）。仮説の文書は「注」で触れるだけにする。
制度: 所得税
担当: kyuyo
既定: {エンティティ: 人物, 期間: 年, 判定の時点: 年分, 値の型: 円}
概念:
  - id: 所得税.給与等の収入金額
    名称: その年中の給与等の収入金額
    定義:
      条文: 所得税法第28条第4項・租税特別措置法第29条の4第2項（「その年中の給与等の収入金額」）
      根拠の種類: 法律
      出典:
        - docs/public-sources/20261109_impl-prep_kyuyo-sources.md#1.1
        - docs/public-sources/20261109_impl-prep_kyuyo-sources.md#2.1
    判定の時点:
      問い: 年分
      説明: >-
        その年中に収入すべき給与等の合計（支払者が複数でも合計）。給与は支給日（due_on）の年分に数える（所得税基本通達36−9）。
        死亡の日より後に支給日が来る給与は入れない（同9−17、D22 S10）。総支給額から非課税の通勤手当を除く（所法9①五・所令20の2）
      出典:
        - docs/public-sources/20261111_impl-research_kyuyo-jiki-laws-and-nta.md#2.1
        - docs/public-sources/20261111_impl-research_kyuyo-jiki-laws-and-nta.md#2.2
        - docs/public-sources/20261111_impl-research_tsukin-laws-and-nta.md#5
    層: 事実
    変数: [所得税_給与等の収入金額]
    パラメータ: [所得税.通勤手当の非課税限度額]
    実装済み: true
    段階: 事業専従者のみなし給与
    出力: {申告の欄: true, 申告の範囲: true}
    注: >-
      入力変数。事業専従者控除額のうち専従者の給与の収入金額とみなす額（所法57④：income_kinds の 所得税.事業専従者としてみなされる給与の収入金額）を
      段階評価の段（事業専従者のみなし給与。StageSpec(run=None)）で読んで足す。同じ段で、判断.退職の性質 で退職手当等に当たらず給与とした支払
      （income_kinds の 所得税.退職手当等に当たらないとした給与等の収入金額。IK-25、2026-11-12）も足す。
      未払のまま回収できなくなった給与（所法64①）では、この値は変えない（所得税.給与所得の金額 で当てる：KY-08）。
      inputs.py が中間表現の salary_payment（給与の支払）・withholding_slip（給与の源泉徴収票。D23 K4 で明細より優先）・
      commuting_status（通勤の状況）から組み立てる（根拠は basis.py の RULES と inputs.py の根拠）。
      判断（未入力は候補）：判断.通勤の合理的な運賃・判断.通勤手当の限度の当て方（単調な両端評価）、判断.給与の支給期が死亡前か。
      ほかのモジュールも使う（所得金額調整控除の第1項の基準・確定申告を要しない場合の2,000万円など）

  - id: 所得税.給与所得控除額
    名称: 給与所得控除額（所得税法第28条第2項に規定するもの）
    定義: {条文: 所得税法第28条第2項・第3項（租税特別措置法第27条第1項が「所得税法第二十八条第二項に規定する給与所得控除額」を、第29条の4第1項が「同条第三項に規定する給与所得控除額」を引く）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_kyuyo-sources.md#2.1, docs/public-sources/20261109_impl-prep_kyuyo-sources.md#2.4, docs/public-sources/20261109_impl-prep_jigyo-laws-and-nta.md#2.1]}
    層: 所得の種類ごとの所得
    値の型: 円
    依存する概念: [所得税.給与等の収入金額, 所得税.給与所得控除額の端数の候補]
    実装済み: true
    変数: [所得税_給与所得控除額]
    パラメータ: [所得税.給与所得.措法第29条の4第1項, 所得税.給与所得控除額]
    注: >-
      家内労働者等の必要経費の特例（措法27、income_kinds）が、給与所得を有する人について65万円（令和8年分以後は69万円）からこの額を控除した残額を使う。
      第28条第3項の式（令和8年・9年で収入金額220万円以下は措法第29条の4第1項）で求める。別表第五（第28条第4項）・措法第29条の4第2項は
      「給与所得の金額」を定めるので、ここでは使わない（kyuyo-sources §1.1・§2.1・§2.4）。1円未満の端数は定めがなく候補で評価する（D21 R5）

  - id: 所得税.給与所得控除額の端数の候補
    名称: 給与所得控除額の1円未満の端数の候補（根拠のない端数。evaluate が候補ごとに入れる）
    定義: {条文: 所得税法第28条第3項（端数の定めがない）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_kyuyo-sources.md#1.1]}
    層: 事実
    値の型: 区分
    変数: [所得税_給与所得控除額の端数の候補]
    実装済み: true
    注: RoundingSlotSpec（__init__.py）。法令の概念ではなく、根拠のない端数の候補（floor・ceil・half_up）を式に渡すための入力

  - id: 所得税.給与所得の金額
    名称: 給与所得の金額（所得金額調整控除の前）
    定義:
      条文: 所得税法第28条（第2項〜第4項・別表第五）、租税特別措置法第29条の4第2項（令和8年分・令和9年分）
      根拠の種類: 法律
      出典:
        - docs/public-sources/20261109_impl-prep_kyuyo-sources.md#1
        - docs/public-sources/20261109_impl-prep_kyuyo-sources.md#2
        - docs/public-sources/20261109_R1-laws_income-tax.md#4
    判定の時点:
      問い: 年分
      説明: その年分の給与等の収入金額に、その年分に適用される版の規定（別表第五の版・措置法の特例）を当てる
      出典:
        - docs/public-sources/20261109_impl-prep_kyuyo-sources.md#1.4
        - docs/public-sources/20261109_impl-prep_kyuyo-sources.md#2.2
    層: 所得の種類ごとの所得
    依存する概念: [所得税.給与等の収入金額, 所得税.回収不能額等に係る給与所得の金額の差額, 所得税.給与の回収不能額等の上限, 所得税.特定支出の額の合計額, 所得税.特定支出控除の適用を受けるか, 所得税.特定支出控除の後の給与所得の端数の候補]
    変数: [所得税_給与所得]
    パラメータ: [所得税.給与所得, 所得税.給与所得控除額]
    実装済み: true
    出力: {申告の欄: true, 申告の範囲: true}
    集める先: [所得税.合計所得金額, 所得税.総所得金額]
    注: >-
      規則は calc.py の純粋関数（OpenFisca の式と根拠の組み立ての両方が使う）。
      所得金額調整控除（租税特別措置法第41条の3の11）はこの値から控除する別の概念（income_totals）。この値は「給与所得控除後の給与等の金額」
      （同条第4項第5号）としても使う（docs/public-sources/20261109_round2_gaps-sources.md §3.1・§3.3）。
      2026-11-12（KY-08）：未払のまま回収できなくなった給与があれば、所令180②一（段が書く上限）と二（差額）のいずれか低い金額を引く
      （所法64①「各種所得の金額の計算上、なかつたものとみなす」：docs/public-sources/20261112_impl-research4_shotoku-laws-and-nta.md §1・§1.1。uncollectible.py）
      2026-11-12（KY-11）：特定支出控除（所法57の2①、令和8・9年分は措法29の4③ の読替え）の適用を受け、特定支出の額の合計額が給与所得控除額の2分の1を
      超える人は、第28条第2項の残額（措法29の4② の額）からその超える部分を控除した額（別表第五は使わない。1円未満は候補、負なら0：tokutei.py、
      docs/public-sources/20261112_impl-research8_tokutei-shishutsu-laws.md §1・§4、仮説 impl-research8 H1〜H4）

  - id: 所得税.回収することができないこととなった給与等の金額
    名称: その年分の給与等の収入金額のうち回収することができないこととなった金額（所得税法第64条第1項の回収不能額等）
    定義: {条文: 所得税法第64条第1項・所得税法施行令第180条第2項, 根拠の種類: 法律, 出典: [docs/public-sources/20261112_impl-research4_shotoku-laws-and-nta.md#1, docs/public-sources/20261112_impl-research4_shotoku-laws-and-nta.md#1.1]}
    層: 事実
    変数: [所得税_回収することができないこととなった給与等の金額]
    実装済み: true
    注: >-
      （足した 2026-11-12。KY-08）入力変数。その年分（支給日の年）の未払の salary_payment の amounts.uncollectible_amount の合計（inputs.py）。
      未払でない支払への記載・総支給額を超える額は c-入力で対象外。回収不能かの判定（所基通64−1 → 51−11〜51−16）は記録の側（語彙の約束）

  - id: 所得税.回収不能額等に係る給与所得の金額の差額
    名称: 給与所得の金額から、回収不能額等に相当する収入金額がなかったものとした場合の給与所得の金額を控除した残額（所令180②二）
    定義: {条文: 所得税法施行令第180条第2項第2号, 根拠の種類: 政令, 出典: [docs/public-sources/20261112_impl-research4_shotoku-laws-and-nta.md#1.1]}
    層: 所得の種類ごとの所得
    依存する概念: [所得税.給与等の収入金額, 所得税.回収することができないこととなった給与等の金額, 所得税.特定支出の額の合計額, 所得税.特定支出控除の適用を受けるか, 所得税.特定支出控除の後の給与所得の端数の候補]
    変数: [所得税_回収不能額等に係る給与所得の金額の差額]
    パラメータ: [所得税.給与所得, 所得税.給与所得控除額]
    実装済み: true
    注: （足した 2026-11-12。KY-08）回収不能額等のない人は0。給与所得の金額と同じ純粋関数（calc.kyuyo_shotoku）の差

  - id: 所得税.所得税法第64条第1項を当てる前の給与所得の金額
    名称: 所得税法第64条第1項（回収不能額等）を当てる前の給与所得の金額
    定義: {条文: 所得税法第28条、所得税法施行令第180条第2項第1号（直前において確定している総所得金額の基礎）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_kyuyo-sources.md#1, docs/public-sources/20261112_impl-research4_shotoku-laws-and-nta.md#1.1]}
    層: 所得の種類ごとの所得
    依存する概念: [所得税.給与等の収入金額, 所得税.特定支出の額の合計額, 所得税.特定支出控除の適用を受けるか, 所得税.特定支出控除の後の給与所得の端数の候補]
    変数: [所得税_所得税法第64条第1項を当てる前の給与所得の金額]
    パラメータ: [所得税.給与所得, 所得税.給与所得控除額]
    実装済み: true
    注: >-
      （足した 2026-11-12。KY-08）所令180②一の上限（income_totals の 所得税.回収不能額等の前の総所得金額と退職所得金額の合計額）の基礎。
      給与所得の金額（段の出力の上限に依存する）を引かずに上限を計算するための値（段階評価の循環を断つ）

  - id: 所得税.給与の回収不能額等の上限
    名称: 回収不能額等が生じた時の直前において確定している総所得金額・退職所得金額の合計額（所令180②一。段が写す入力）
    定義: {条文: 所得税法施行令第180条第2項第1号、所得税基本通達64−2の2・64−3, 根拠の種類: 政令, 出典: [docs/public-sources/20261112_impl-research4_shotoku-laws-and-nta.md#1.1, docs/public-sources/20261112_impl-research4_shotoku-laws-and-nta.md#1.3]}
    層: 事実
    変数: [所得税_給与の回収不能額等の上限]
    実装済み: true
    段階: 未払の給与の回収不能
    注: >-
      （足した 2026-11-12。KY-08）段階評価の段 未払の給与の回収不能（uncollectible.py）が income_totals の 所得税_回収不能額等の前の総所得金額と退職所得金額の合計額
      を写す入力。回収不能額等のない人は0。所得金額調整控除の第1項の「有するか」でなかったものとみなす額が変わる人は対象外（c-限界：README KY-10）

  # ---- 特定支出控除（所得税法第57条の2。README KY-11、2026-11-12） ----
  - id: 所得税.給与所得控除後の給与等の金額
    名称: 給与所得控除後の給与等の金額（特定支出控除・所法64① の前）
    定義:
      条文: 租税特別措置法第41条の3の11第4項第5号（給与等の収入金額から所得税法第28条第3項の給与所得控除額を控除した残額。同条第4項の適用がある場合は別表第五の額）、租税特別措置法施行令第19条の4の2（令和8年分以後、措法29の4② の額）
      根拠の種類: 法律
      出典:
        - docs/public-sources/20261112_impl-research8_tokutei-shishutsu-laws.md#5
        - docs/public-sources/20261109_round2_gaps-sources.md#3.1
        - docs/public-sources/20261109_round2_gaps-sources.md#3.3
    層: 所得の種類ごとの所得
    依存する概念: [所得税.給与等の収入金額]
    変数: [所得税_給与所得控除後の給与等の金額]
    パラメータ: [所得税.給与所得, 所得税.給与所得控除額]
    実装済み: true
    注: >-
      所得金額調整控除の第2項（income_totals）が「給与所得控除後の給与等の金額」として使う。特定支出控除の後の給与所得の金額ではない
      （措法41の3の11④五の定義は収入金額と給与所得控除額だけで決まる。措通41の3の11−3：特定支出控除を受けた者にも第2項が当たる。仮説 impl-research8 H6）

  - id: 所得税.特定支出の額の合計額
    名称: その年中の特定支出の額の合計額（所得税法第57条の2第1項）
    定義:
      条文: 所得税法第57条の2第1項・第2項、所得税法施行令第167条の3、所得税法施行規則第36条の5第3項・第4項
      根拠の種類: 法律
      出典:
        - docs/public-sources/20261112_impl-research8_tokutei-shishutsu-laws.md#1
        - docs/public-sources/20261112_impl-research8_tokutei-shishutsu-laws.md#2
        - docs/public-sources/20261112_impl-research8_tokutei-shishutsu-laws.md#3
    層: 事実
    変数: [所得税_特定支出の額の合計額]
    パラメータ: [所得税.特定支出]
    実装済み: true
    出力: {申告の欄: true, 申告の範囲: true}
    注: >-
      入力変数。inputs.py が specific_expense（その年分〔attributed_year、無ければ支出の日の年〕・その人の支出）から tokutei.collect で組み立てる。
      明細書の⑪（申告書第二表の「特例適用条文等」に書く額）。入力の不足（キャリアコンサルタントの証明の教育訓練の別・通勤の定期乗車券等の価額・転任の日）は c-入力で対象外
      （README KY-12）。証明のない支出・範囲の外の支出は数えない（記録の ID は根拠に残る）

  - id: 所得税.特定支出控除の適用を受けるか
    名称: その年分の申告書等で特定支出控除の適用を受けるか（申告書等の記載と明細書・証明書の添付）
    定義: {条文: 所得税法第57条の2第3項, 根拠の種類: 法律, 出典: [docs/public-sources/20261112_impl-research8_tokutei-shishutsu-laws.md#1, docs/public-sources/20261112_impl-research8_tokutei-shishutsu-laws.md#7.3]}
    層: 事実
    値の型: 真偽
    変数: [所得税_特定支出控除の適用を受けるか]
    実装済み: true
    注: >-
      入力変数。選択.特定支出控除（DecisionSlot は lazy：特定支出の額の合計額が正の人だけが読む）。未入力なら受ける・受けないの両方で評価する
      （D21 R6・選択の未入力は全候補。仮説 impl-research8 H4）

  - id: 所得税.特定支出の額の合計額が給与所得控除額の2分の1を超えるか
    名称: その年中の特定支出の額の合計額が給与所得控除額の2分の1に相当する金額を超えるか（適用を受けるかの選択によらない）
    定義:
      条文: 所得税法第57条の2第1項、地方税法第313条第11項・第32条第11項（同法第二十八条第二項に規定する給与所得控除額の二分の一に相当する金額を超える場合）
      根拠の種類: 法律
      出典:
        - docs/public-sources/20261112_impl-research8_tokutei-shishutsu-laws.md#1
        - docs/public-sources/20261112_impl-research8_tokutei-shishutsu-laws.md#6
    層: 所得の種類ごとの所得
    値の型: 真偽
    依存する概念: [所得税.給与等の収入金額, 所得税.特定支出の額の合計額]
    変数: [所得税_特定支出の額の合計額が給与所得控除額の2分の1を超えるか]
    パラメータ: [所得税.給与所得, 所得税.給与所得控除額]
    実装済み: true
    出力: {申告の欄: true, 申告の範囲: true}
    注: >-
      （足した 2026-11-12 の2回目。KY-11）様式の欄（第一表 ㋔ の区分 G13）の条件と、juminzei の段 住民税の特定支出控除の申告（地法313⑪）が使う。
      給与所得控除額は第28条第3項の式（令和8・9年は措法29の4①）。2分の1 は有理数のまま比べる（tokutei.tokutei_raw）

  - id: 所得税.特定支出控除を当てた場合の給与所得の金額
    名称: 特定支出控除（所法57の2①）を当てた場合の給与所得の金額（選択によらない。所法64① の前）
    定義:
