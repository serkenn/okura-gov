description: >-
  国民年金（国民年金法・同施行令・改定率政令・経過措置政令）の値。年度の値の日付のキーは「所得の年分の1月1日」（年度 F の値は所得の年分 F−1 の
  situation で引く：令和7年度分＝2024-01-01、令和8年度分＝2025-01-01、令和9年度分＝2026-01-01。juminzei と同じ約束）。
  第3号被保険者の収入の基準（130万円・180万円・2分の1）はここに持たない（2026-11-11：健保の約束の概念 健保.配偶者の収入の基準額・
  健保.同一の世帯の収入の割合 を引く。国年令第4条）。適用年度・施行日はメタデータ。
