description: >-
  租税特別措置法第29条の4第1項（給与所得控除の最低控除額の特例）。令和8年又は令和9年において、その年中の給与等の収入金額が
  二百二十万円以下のとき、給与所得控除額は同項第一号にかかわらず七十四万円（収入金額が七十四万円に満たない場合には収入金額）。
  原文：docs/public-sources/20261109_impl-prep_kyuyo-sources.md#2.1（措法 R8、asof 2026-12-01）。
適用:
  description: この年分に第1項を適用するか（条文「令和八年又は令和九年において」）
  metadata: &sochi1
    law: 租税特別措置法第29条の4第1項
    source_kind: 法律
    reference:
      - docs/public-sources/20261109_impl-prep_kyuyo-sources.md#2.1
      - docs/public-sources/20261109_impl-prep_kyuyo-sources.md#2.2
    law_revision: 332AC0000000026_20261201_508AC0000000012
  values:
    2025-01-01:
      value: false
      metadata:
        適用: 令和7年分にはこの規定がない（令和8年法律第12号で新設）
    2026-01-01:
      value: true
      metadata:
        施行日: 2026-12-01
        適用: 令和8年分・令和9年分（条文の「令和八年又は令和九年において」）
    2028-01-01:
      value: false
      metadata:
        適用: 令和10年分以後は条文の「令和八年又は令和九年において」の外
上限:
  description: 収入金額の上限（二百二十万円以下）
  metadata: *sochi1
  values:
    2026-01-01: {value: 2200000, metadata: {施行日: 2026-12-01, 比較: 以下}}
額:
  description: 給与所得控除額（七十四万円。収入金額が七十四万円に満たない場合には収入金額）
  metadata: *sochi1
  values:
    2026-01-01: {value: 740000, metadata: {施行日: 2026-12-01}}
