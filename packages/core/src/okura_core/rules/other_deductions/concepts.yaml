# 概念辞書：規則モジュール other_deductions（その他の所得控除と医療費の前処理）が担当する概念。
# 変数名・単位（値の型）・期間はここで決めたものを変えない（変えるときは引くモジュールの担当と合わせる）。
# 所得控除の額は「所得控除」の層に置き、所得控除の合計（tax）に集める。控除を受けるのは支払った人（医療費・社会保険料：R4 H3.3）。
# 医療費の前処理（支払ごとの生計の判定・補塡の限度）は situation の組み立て（このモジュールの build_inputs）で行い、
# 結果を支払者の入力変数（所得税.補塡後の医療費の額など）にする（R4 H3.3 案A・D5 改）。
制度: 所得税
担当: other_deductions
既定: {エンティティ: 人物, 期間: 年, 判定の時点: 年分, 値の型: 円, 実装済み: true, 層: 所得控除}
概念:
  # --- 事実（前処理の結果を入れる入力変数） ---
  - id: 所得税.補塡後の医療費の額
    名称: その年中に支払った、控除の対象となる医療費の額（保険金等で補塡される部分を除いた後。支払者ごと）
    定義: {条文: 所得税法第73条第1項（自己又は自己と生計を一にする配偶者その他の親族に係る医療費を支払った場合。保険金・損害賠償金等で補塡される部分を除く）、所得税法施行令第207条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_iryohi-law-text.md#1, docs/public-sources/20261109_impl-prep_iryohi-law-text.md#2.1]}
    層: 事実
    変数: [所得税_補塡後の医療費の額]
    出力: {申告の欄: false, 申告の範囲: false}
    注: >-
      補塡の限度（給付の目的の医療費を限度とし、他の医療費から差し引かない）は支払・給付の単位で当てる（R4 H3.3）。
      補塡の見込額は見積り.補塡の見込額（印 見積り：D21 R2）。医療費の範囲の判断（判断.医療費の範囲）は、目的・必要性で決まる種類について
      未入力なら両方で評価する。所令第207条各号に直接当たる種類は範囲に入るものとする（法令の読み。inputs の根拠）

  - id: 所得税.特定一般用医薬品等購入費の額
    名称: その年中に支払った特定一般用医薬品等購入費の額（補塡後）
    定義: {条文: 租税特別措置法第41条の17, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_iryohi-law-text.md#4.1]}
    層: 事実
    変数: [所得税_特定一般用医薬品等購入費の額]
    出力: {申告の欄: false, 申告の範囲: false}
    注: 対象の購入に補塡があれば補塡される部分を除く。ほかの医療費との割り振り（あん分・対象の購入から先に・ほかから先に）が分かれれば未確定（一次情報なし）

  - id: 所得税.セルフメディケーション税制の選択
    名称: 医療費控除の特例（セルフメディケーション税制）を選択したか
    定義: {条文: 租税特別措置法第41条の17第1項（「その者の選択により」）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_iryohi-law-text.md#4.1, docs/public-sources/20261109_impl-prep_iryohi-nta-mhlw.md#6.1]}
    層: 事実
    値の型: 真偽
    変数: [所得税_セルフメディケーション税制の選択]
    注: 選択.医療費控除かセルフメディケーション税制か から写す。本人の取組と対象の購入がある人について未入力なら両方で評価（D22 S20）

  - id: 所得税.医療費控除の足切りの端数
    名称: 総所得金額等の百分の五の1円未満の端数の候補（根拠なし：D22 S3）
    定義: {条文: 所得税法第73条第1項に端数の定めがない, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_iryohi-law-text.md#6]}
    層: 事実
    値の型: 区分
    変数: [所得税_医療費控除の足切りの端数]
    注: RoundingSlotSpec の候補の名前（floor・ceil・half_up）を evaluate が入れる

  - id: 所得税.支払った社会保険料の額
    名称: その年中に支払った（給与から差し引かれたものを含む）社会保険料の額
    定義: {条文: 所得税法第74条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#7.1]}
    層: 事実
    変数: [所得税_支払った社会保険料の額]
    出力: {申告の欄: false, 申告の範囲: false}
    注: >-
      給与から天引きされた額（amounts.social_insurance_withheld。給与の支払の日の年分、未払の給与からは数えない：法令の読み）・公的年金から特別徴収された額・
      給与の源泉徴収票の社会保険料等の金額（D23 K4）も入る。前納の対象期間は docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md §7.2。
      生計の判定の時点（支払日か12月31日か）で結論が分かれれば未確定（決める手段は一次情報：D22 S1）

  - id: 所得税.支払った小規模企業共済等掛金の額
    名称: その年中に支払った小規模企業共済等掛金の額
    定義: {条文: 所得税法第75条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_hoken-kifu-laws.md#5]}
    層: 事実
    変数: [所得税_支払った小規模企業共済等掛金の額]
    出力: {申告の欄: false, 申告の範囲: false}
    注: 加入者以外が支払った掛金は後の段（D21 R3。入力にあれば対象外）

  - id: 所得税.新生命保険料の額
    名称: その年中に支払った新生命保険料の金額の合計額（剰余金・割戻金を差し引いた残額）
    定義: {条文: 所得税法第76条第1項第1号・第5項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_hoken-kifu-laws.md#2.1, docs/public-sources/20261109_round2_hoken-kifu-laws.md#2.2]}
    層: 事実
    変数: [所得税_新生命保険料の額]

  - id: 所得税.旧生命保険料の額
    名称: その年中に支払った旧生命保険料の金額の合計額（剰余金・割戻金を差し引いた残額）
    定義: {条文: 所得税法第76条第1項第2号・第6項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_hoken-kifu-laws.md#2.1, docs/public-sources/20261109_round2_hoken-kifu-laws.md#2.2]}
    層: 事実
    変数: [所得税_旧生命保険料の額]

  - id: 所得税.介護医療保険料の額
    名称: その年中に支払った介護医療保険料の金額の合計額（剰余金・割戻金を差し引いた残額）
    定義: {条文: 所得税法第76条第2項・第7項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_hoken-kifu-laws.md#2.1, docs/public-sources/20261109_round2_hoken-kifu-laws.md#2.2]}
    層: 事実
    変数: [所得税_介護医療保険料の額]

  - id: 所得税.新個人年金保険料の額
    名称: その年中に支払った新個人年金保険料の金額の合計額（剰余金・割戻金を差し引いた残額）
    定義: {条文: 所得税法第76条第3項第1号・第8項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_hoken-kifu-laws.md#2.1, docs/public-sources/20261109_round2_hoken-kifu-laws.md#2.2]}
    層: 事実
    変数: [所得税_新個人年金保険料の額]

  - id: 所得税.旧個人年金保険料の額
    名称: その年中に支払った旧個人年金保険料の金額の合計額（剰余金・割戻金を差し引いた残額）
    定義: {条文: 所得税法第76条第3項第2号・第9項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_hoken-kifu-laws.md#2.1, docs/public-sources/20261109_round2_hoken-kifu-laws.md#2.2]}
    層: 事実
    変数: [所得税_旧個人年金保険料の額]

  - id: 所得税.生命保険料の新旧の選択
    名称: 一般・個人年金の生命保険料について新のみ・旧のみ・両方のどれで控除額を計算するか
    定義: {条文: 所得税法第76条第1項各号・第3項各号の書き分け（納税者の選択：質疑応答事例 05/74〜05/76）, 根拠の種類: 国税庁の説明, 出典: [docs/public-sources/20261109_round2_hoken-kifu-nta-soumu.md#1.4]}
    層: 事実
    値の型: 区分
    変数: [所得税_生命保険料の新旧の選択]
    注: 選択.保険料控除の区分 の life_insurance_regime。人ごとの1つの選択を一般と個人年金の両方に当てる（区分ごとの選択は中間表現にない）。未入力なら全候補で評価（D22 S20）

  - id: 所得税.地震保険料の額
    名称: その年中に支払った地震保険料の金額の合計額（剰余金・割戻金を差し引いた残額）
    定義: {条文: 所得税法第77条第1項・第2項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_hoken-kifu-laws.md#3]}
    層: 事実
    変数: [所得税_地震保険料の額]

  - id: 所得税.旧長期損害保険料の額
    名称: その年中に支払った旧長期損害保険料の金額の合計額
    定義: {条文: 平成18年法律第10号附則第10条第2項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_hoken-kifu-laws.md#3]}
    層: 事実
    変数: [所得税_旧長期損害保険料の額]
    注: 締結日・保険期間の始期・保険期間10年以上は記録で確かめる。満期返戻金の特約・平成19年以後の変更なしは語彙にない事実なので、数える値で入れて未確定（決める手段は事実）

  - id: 所得税.特定寄附金の額
    名称: その年中に支出した特定寄附金の額の合計額
    定義: {条文: 所得税法第78条第1項・第2項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_hoken-kifu-laws.md#4]}
    層: 事実
    変数: [所得税_特定寄附金の額]
    注: 国又は地方公共団体に対する寄附金（第2項第1号）と、所得控除を選んだ政党等・認定NPO法人等・公益社団法人等への寄附金（donations.py）。日本赤十字社（特定公益増進法人：TA1150）と共同募金会（所令217①五 の特定公益増進法人又は告示154号第4号・第4号の2 の指定寄附金：docs/public-sources/20261112_impl-research4_juminzei-kifu-laws-and-kokuji.md §2。2026-11-12）を数える。other は受領証等の記載（receipt_statement）で決め、記載の欄がなければ両方で評価して未確定

  - id: 所得税.寄附金控除の上限の端数
    名称: 総所得金額等の百分の四十の1円未満の端数の候補（根拠なし：D22 S3）
    定義: {条文: 所得税法第78条第1項に端数の定めがない, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_hoken-kifu-laws.md#4]}
    層: 事実
    値の型: 区分
    変数: [所得税_寄附金控除の上限の端数]
    注: RoundingSlotSpec の候補の名前（floor・ceil・half_up）を evaluate が入れる

  - id: 所得税.年齢23歳未満の扶養親族を有するか
    名称: 年齢23歳未満の扶養親族を有するか（租税特別措置法第41条の15の5。夫婦の両方が同じ子について有しうる）
    定義: {条文: 租税特別措置法第41条の15の5第1項・第2項（その年12月31日の現況）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_hoken-kifu-laws.md#2.3, docs/public-sources/20261109_round2_hoken-kifu-nta-soumu.md#1.6]}
    層: 事実
    値の型: 真偽
    段階: 生命保険料控除の特例の扶養親族
    変数: [所得税_年齢23歳未満の扶養親族を有するか]
    注: >-
      段階評価（StageSpec）で親族（kinship.py）・生計（判断.生計を一にする）・合計所得金額の要件（所得税_扶養親族の合計所得金額要件）から決める（life_special.py）。
      判定の日は 12月31日（死亡のときは死亡の時）。出国の時は扱わない。扶養親族の所属（グループ）は使わない（夫婦の両方が有しうる）

  - id: 所得税.雑損の損失の金額
    名称: その年の雑損控除の損失の金額の合計額（保険金等で補塡される部分を除く）
    定義: {条文: 所得税法第72条第1項・所得税法施行令第206条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_hoken-kifu-laws.md#6, docs/public-sources/20261109_round2_hoken-kifu-nta-soumu.md#5.1]}
    層: 事実
    段階: 雑損控除の資産の所属
    変数: [所得税_雑損の損失の金額]
    注: >-
      控除を受ける人（所有者本人、又は所令第205条第2項の居住者）に入れる。所属は段階評価の段 雑損控除の資産の所属（casualty.py。run=None：build_inputs が
      扶養の割当ての結果・総所得金額等を読む）。被災事業用資産は数えない。損失の直後の価額は語彙に足した欄（amounts.post_loss_value）

  - id: 所得税.雑損の災害関連支出の金額
    名称: 損失の金額に含まれる災害関連支出の金額（保険金等で補塡される部分を除く）
    定義: {条文: 所得税法第72条第1項第1号・第2号・所得税法施行令第206条第2項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_hoken-kifu-laws.md#6]}
    層: 事実
    段階: 雑損控除の資産の所属
    変数: [所得税_雑損の災害関連支出の金額]

  - id: 所得税.雑損控除の足切りの端数
    名称: 総所得金額等の10分の1の1円未満の端数の候補（根拠なし：D22 S3）
    定義: {条文: 所得税法第72条第1項に端数の定めがない, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_hoken-kifu-laws.md#6]}
    層: 事実
    値の型: 区分
    変数: [所得税_雑損控除の足切りの端数]
    注: RoundingSlotSpec の候補の名前（floor・ceil・half_up）を evaluate が入れる

  - id: 所得税.税額控除を受ける政党等寄附金の額
    名称: 税額控除を受けるとした政党等に対する寄附金の額の合計額
    定義: {条文: 租税特別措置法第41条の18第2項, 根拠の種類: 法律, 出典: [docs/public-sources/20261111_impl-research_seito-kifu-laws-and-nta.md#1]}
    層: 事実
    変数: [所得税_税額控除を受ける政党等寄附金の額]
    注: 選択.寄附金の控除の方式 が tax_credit の政党等への寄附（recipient_type political_party）

  - id: 所得税.税額控除を受ける認定NPO法人等寄附金の額
    名称: 税額控除を受けるとした特定非営利活動に関する寄附金の額の合計額
    定義: {条文: 租税特別措置法第41条の18の2第2項, 根拠の種類: 法律, 出典: [docs/public-sources/20261111_impl-research_seito-kifu-laws-and-nta.md#2]}
    層: 事実
    変数: [所得税_税額控除を受ける認定NPO法人等寄附金の額]

  - id: 所得税.税額控除を受ける公益社団法人等寄附金の額
    名称: 税額控除を受けるとした税額控除対象寄附金の額の合計額
    定義: {条文: 租税特別措置法第41条の18の3第1項, 根拠の種類: 法律, 出典: [docs/public-sources/20261111_impl-research_seito-kifu-laws-and-nta.md#3]}
    層: 事実
    変数: [所得税_税額控除を受ける公益社団法人等寄附金の額]
    注: recipient_type の public_interest_corporation・school_corporation。税額控除を選ぶ法人が要件（措法第41条の18の3第1項）を満たすことは前提（法令の読み）

  # --- 所得控除 ---
  - id: 所得税.雑損控除の額
    名称: 雑損控除の額
    定義: {条文: 所得税法第72条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_hoken-kifu-laws.md#6, docs/public-sources/20261109_round2_hoken-kifu-nta-soumu.md#5.1]}
    依存する概念: [所得税.雑損の損失の金額, 所得税.雑損の災害関連支出の金額, 所得税.雑損控除の足切りの端数, 所得税.総所得金額等]
    パラメータ: [所得税.雑損控除]
    変数: [所得税_雑損控除の額]
    集める先: [所得税.所得控除の合計]
    出力: {申告の欄: true, 申告の範囲: true}
    注: >-
      控除しきれない部分は雑損失の金額（所得税法第2条第1項第26号）として翌年以後に繰り越す（所得税.翌年以後に繰り越す雑損失の金額）。
      10分の1の1円未満は候補の全部で評価する（金額だけが違えば幅）。親族の資産の所属（所令第205条第2項）は段 雑損控除の資産の所属 が損失の金額の入力で決める

  - id: 所得税.翌年以後に繰り越す雑損失の金額
    名称: その年に生じた雑損失の金額のうち、その年分に控除しきれず翌年以後に繰り越す金額
    定義:
      条文: 所得税法第2条第1項第26号・第71条第1項・第87条、租税特別措置法通達31・32共−4（雑損失の繰越控除及び所得控除の順序）
      根拠の種類: 法律
      出典:
        - docs/public-sources/20261109_round2_hoken-kifu-laws.md#6
        - docs/public-sources/20261109_round2_hoken-kifu-nta-soumu.md#5.1
        - docs/public-sources/20261111_impl-research3_joto-junjo-laws-and-nta.md#3
    依存する概念: [所得税.雑損控除の額, 所得税.総所得金額等]
    変数: [所得税_翌年以後に繰り越す雑損失の金額]
    出力: {申告の欄: false, 申告の範囲: true}
    注: >-
      雑損控除の額 − 総所得金額等（0未満にしない）。雑損控除は所得控除の最初で、総所得金額 → 上場株式等の所得 → 退職所得金額の順に控除する
      （この版の範囲では総所得金額等の全体から控除しきれない部分）。翌年分の繰越控除（所得税.繰り越された雑損失の金額）は前年分の申告書の記載から
      income_totals が組み立てる（この値はその記載に当たる値で、年をまたいで引かない）。特定非常災害の5年の繰越（所法71の2）は後の段（D22 S12）

  - id: 所得税.医療費控除の額
    名称: 医療費控除の額
    定義: {条文: 所得税法第73条（総所得金額等の5%と10万円のいずれか低い額を超える部分、200万円まで）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_iryohi-law-text.md#1, docs/public-sources/20261109_R1-laws_income-tax.md#4]}
    依存する概念: [所得税.補塡後の医療費の額, 所得税.セルフメディケーション税制の選択, 所得税.医療費控除の足切りの端数, 所得税.総所得金額等]
    パラメータ: [所得税.医療費控除]
    変数: [所得税_医療費控除の額]
    集める先: [所得税.所得控除の合計]
    出力: {申告の欄: true, 申告の範囲: true}
    注: セルフメディケーション税制との選択（選択.医療費控除かセルフメディケーション税制か）は、未入力なら両方で評価（D22 S20）。百分の五の1円未満は候補の全部で評価（金額だけが違えば幅）

  - id: 所得税.セルフメディケーション税制による医療費控除の額
    名称: 特定一般用医薬品等購入費を支払った場合の医療費控除の特例の額
    定義: {条文: 租税特別措置法第41条の17（1万2千円を超える部分、8万8千円まで）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_iryohi-law-text.md#4.1, docs/public-sources/20261109_R1-laws_income-tax.md#4]}
    依存する概念: [所得税.特定一般用医薬品等購入費の額, 所得税.セルフメディケーション税制の選択]
    パラメータ: [所得税.セルフメディケーション税制]
    変数: [所得税_セルフメディケーション税制による医療費控除の額]
    集める先: [所得税.所得控除の合計]
    出力: {申告の欄: true, 申告の範囲: true}

  - id: 所得税.社会保険料控除の額
    名称: 社会保険料控除の額
    定義: {条文: 所得税法第74条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#7.1]}
    依存する概念: [所得税.支払った社会保険料の額]
    変数: [所得税_社会保険料控除の額]
    集める先: [所得税.所得控除の合計]
    出力: {申告の欄: true, 申告の範囲: true}

  - id: 所得税.小規模企業共済等掛金控除の額
    名称: 小規模企業共済等掛金控除の額
    定義: {条文: 所得税法第75条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_hoken-kifu-laws.md#5]}
    依存する概念: [所得税.支払った小規模企業共済等掛金の額]
    変数: [所得税_小規模企業共済等掛金控除の額]
    集める先: [所得税.所得控除の合計]
    出力: {申告の欄: true, 申告の範囲: true}

  - id: 所得税.生命保険料控除の額
    名称: 生命保険料控除の額
    定義: {条文: 所得税法第76条、租税特別措置法第41条の15の5, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_hoken-kifu-laws.md#2.1, docs/public-sources/20261109_round2_hoken-kifu-laws.md#2.3]}
    依存する概念: [所得税.新生命保険料の額, 所得税.旧生命保険料の額, 所得税.介護医療保険料の額, 所得税.新個人年金保険料の額, 所得税.旧個人年金保険料の額, 所得税.生命保険料の新旧の選択, 所得税.年齢23歳未満の扶養親族を有するか]
    パラメータ: [所得税.生命保険料控除]
    変数: [所得税_生命保険料控除の額]
    集める先: [所得税.所得控除の合計]
    出力: {申告の欄: true, 申告の範囲: true}
    注: >-
      1円未満の端数は条文に定めがなく、国税庁「年末調整のしかた」の切上げに従う（D21 R5：手引き。根拠に法令の読みの印。docs/public-sources/20261109_round2_hoken-kifu-nta-soumu.md §1.6）

  - id: 所得税.地震保険料控除の額
    名称: 地震保険料控除の額
    定義: {条文: 所得税法第77条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_hoken-kifu-laws.md#3]}
    依存する概念: [所得税.地震保険料の額, 所得税.旧長期損害保険料の額]
    パラメータ: [所得税.地震保険料控除]
    変数: [所得税_地震保険料控除の額]
    集める先: [所得税.所得控除の合計]
    出力: {申告の欄: true, 申告の範囲: true}

  - id: 所得税.寄附金控除の額
    名称: 寄附金控除の額
    定義: {条文: 所得税法第78条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_hoken-kifu-laws.md#4]}
    依存する概念: [所得税.特定寄附金の額, 所得税.寄附金控除の上限の端数, 所得税.総所得金額等]
    パラメータ: [所得税.寄附金控除]
    変数: [所得税_寄附金控除の額]
    集める先: [所得税.所得控除の合計]
    出力: {申告の欄: true, 申告の範囲: true}
    注: 所得控除か税額控除かの選択（選択.寄附金の控除の方式）は donations.py が人・種類ごとの1か所で解く（税額控除を選んだ額は 所得税.政党等寄附金特別控除等の額 の基礎）

  # --- 税額控除（寄附） ---
  - id: 所得税.政党等寄附金特別控除等の額
    名称: 政党等・認定NPO法人等・公益社団法人等への寄附金の所得税額の特別控除の額
    定義: {条文: 租税特別措置法第41条の18第2項・第41条の18の2第2項・第41条の18の3第1項, 根拠の種類: 法律, 出典: [docs/public-sources/20261111_impl-research_seito-kifu-laws-and-nta.md#1, docs/public-sources/20261111_impl-research_seito-kifu-laws-and-nta.md#2, docs/public-sources/20261111_impl-research_seito-kifu-laws-and-nta.md#3, docs/public-sources/20261111_impl-research_seito-kifu-laws-and-nta.md#7]}
    層: 税額
    依存する概念: [所得税.税額控除を受ける政党等寄附金の額, 所得税.税額控除を受ける認定NPO法人等寄附金の額, 所得税.税額控除を受ける公益社団法人等寄附金の額, 所得税.特定寄附金の額, 所得税.総所得金額等, 所得税.算出税額]
    集約点を通らない依存:
      - 概念: 所得税.総所得金額等
        説明: 寄附金の額の上限（百分の四十）の基礎。読替え（措令第26条の27の4第1項・第26条の28第1項）で分離課税の所得を含む
        出典: [docs/public-sources/20261111_impl-research_seito-kifu-laws-and-nta.md#1]
    パラメータ: [所得税.政党等寄附金特別控除等]
    変数: [所得税_政党等寄附金特別控除等の額]
    出力: {申告の欄: true, 申告の範囲: true}
    注: >-
      公益社団法人等→認定NPO法人等→政党等の順に計算する。特定寄附金の額（寄附金控除の対象）は、他の寄附の額の基礎。
      25%の限度は税額控除の前の所得税の額（措置法通達41の18−3）。tax の基準所得税額が使う

  # --- 申告書・明細書の欄が使う途中の値（足した。2026-11-12：filing.py。様式の対応表の医療費控除の明細書 E・F） ---
  - id: 所得税.医療費控除の足切りの基準の額
    名称: 総所得金額等の百分の五（赤字のときは0。医療費控除の明細書の E）
    定義: {条文: 所得税法第73条第1項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_iryohi-law-text.md#1, docs/public-sources/20261109_impl-prep_iryohi-nta-mhlw.md#2.2]}
    依存する概念: [所得税.総所得金額等, 所得税.医療費控除の足切りの端数]
    パラメータ: [所得税.医療費控除]
    変数: [所得税_医療費控除の足切りの基準の額]
    注: （足した）医療費控除の額の式（calc.medical_deduction）と同じ材料・同じ端数の候補（1円未満は根拠のない端数：D22 S3。端数が出る人がいるときだけ候補を引く）

  - id: 所得税.医療費控除の足切りの額
    名称: 総所得金額等の百分の五と10万円のいずれか少ない方の金額（医療費控除の明細書の F）
    定義: {条文: 所得税法第73条第1項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_iryohi-law-text.md#1, docs/public-sources/20261109_impl-prep_iryohi-nta-mhlw.md#2.2]}
    依存する概念: [所得税.医療費控除の足切りの基準の額]
    パラメータ: [所得税.医療費控除]
    変数: [所得税_医療費控除の足切りの額]
    注: （足した）医療費控除の額＝補塡後の医療費の額－この額（0〜200万円）

  # --- 医療費控除の明細書「1 医療費通知に記載された事項」の3欄（足した。2026-11-12：medical.py が医療費通知の記録から書く入力変数） ---
  - id: 所得税.医療費通知に記載された医療費の額
    名称: 医療費通知に記載された医療費の額（自己負担額。医療費控除の明細書の 1 (1)。支払者ごとの合計）
    定義: {条文: 所得税法第120条第4項第2号・所得税法施行規則第47条の2第13項（医療費通知）、令和7年分 確定申告の手引き「医療費控除の明細書」❶(1), 根拠の種類: 手引き・様式の注記, 出典: [docs/public-sources/20261112_impl-research6_forms-iryohi-tsuchi.md#2, docs/public-sources/20261109_impl-prep_iryohi-law-text.md#5.2]}
    層: 事実
    変数: [所得税_医療費通知に記載された医療費の額]
    注: >-
      医療費通知（medical_expense_notice）の記録のうち payment_year がその年分で、受診者が支払者自身か生計を一にする親族（手引き ❶※2）のものの
      notice_amount の合計（「通知が複数ある場合は、全て合計」）。前年支払分を含みうる（控除の額には使わない。様式の欄の値）

  - id: 所得税.医療費通知のその年中に実際に支払った医療費の額
    名称: 医療費通知に記載された医療費のうちその年中に実際に支払った医療費の額（医療費控除の明細書の ㋐）
    定義: {条文: 所得税法第73条第1項、令和7年分 確定申告の手引き「医療費控除の明細書」❶(2), 根拠の種類: 手引き・様式の注記, 出典: [docs/public-sources/20261112_impl-research6_forms-iryohi-tsuchi.md#2]}
    層: 事実
    変数: [所得税_医療費通知のその年中に実際に支払った医療費の額]
    注: 上と同じ記録の paid_in_year の合計。㋐が通知の額を超える記録は入力の矛盾（c-入力：OD-62）

  - id: 所得税.医療費通知の補塡される金額
    名称: ㋐のうち生命保険や社会保険などで補塡される金額（医療費控除の明細書の ㋑）
    定義: {条文: 所得税法第73条第1項かっこ書、令和7年分 確定申告の手引き「医療費控除の明細書」❶(3), 根拠の種類: 手引き・様式の注記, 出典: [docs/public-sources/20261112_impl-research6_forms-iryohi-tsuchi.md#2, docs/public-sources/20261112_impl-research6_forms-iryohi-tsuchi.md#3]}
    層: 事実
    変数: [所得税_医療費通知の補塡される金額]
    注: >-
      上と同じ記録の min(reimbursed, paid_in_year) の合計（補塡はその給付の目的となった医療費を限度とし、ほかの医療費から差し引かない：手引き ❶(3)。
      通知の記録ごとに㋐を限度とするのは法令の読み）。所得税.補塡後の医療費の額 には ㋐−㋑ が入る
