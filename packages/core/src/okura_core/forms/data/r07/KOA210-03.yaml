  - {位置: "仕入金額の明細/行{行}/{列}", 行: 4, 列: [仕入先名, 所在地, 登録番号, 法人番号, 仕入金額], 列の型: [文字列, 文字列, 文字列, 文字列, 金額], コード: [[E25, E26, E27, G22, G23], [E28, E29, E30, G24, G25], [E31, E32, E33, G26, G27], [E34, E35, E36, G28, G29]], 型: 文字列, 対応: {なし: 事実, 理由: 取引先ごとの仕入の事実（行の選び方は利用アプリ）}}
  - {位置: 仕入金額の明細/上記以外の仕入先の計, コード: G30, 型: 金額, 対応: {なし: 事実, 理由: 取引先ごとの仕入の事実}}
  - {位置: 仕入金額の明細/計, コード: G31, 型: 金額, 対応: {未確定: 印字「計（6）」が1ページのどの欄を指すか（1ページの6は差引原価、仕入金額は3）を docs で確かめていない（yoshiki-forms-r07 §13）}}
  - {位置: 本年中における特殊事情, コード: E12, 型: 文字列, 対応: {なし: 事実, 理由: 利用者が書く文章}}
  # 減価償却費の計算（2026-11-12）：行 k は「行 k の資産」の概念（rules/income_kinds/asset_rows.py）。行に載せる資産の並べ方は様式に定めがないので既定の並べ方
  # （取得の日の早い順、同じなら資産の ID 順。表示だけで税額は変わらない：行の割当て UO23 と同じ扱い）。8番目以後の資産はあふれ（適宜の用紙。資産の数は
  # 所得税.事業所得の減価償却資産の数）。名称等・面積又は数量・取得年月・取得価額は、行の資産の ID（所得税.事業所得の減価償却資産の行k.資産のID）の資産台帳から利用アプリが書く
  - 位置: "減価償却費の計算/行{行}/{列}"
    行: 7
    列: [名称等, 取得年月, 取得価額]
    列の型: [文字列, 日付, 金額]
    コード: [[E01, M01, G01], [E02, M02, G02], [E03, M03, G03], [E04, M04, G04], [E05, M05, G05], [E06, M06, G06], [E07, M07, G07]]
    型: 文字列
    対応:
      場合:
        - {もし: [{概念: "所得税.事業所得の減価償却資産の行{行}.資産のID", 等しい: なし}], 空欄: 行に載せる事業所得の減価償却資産がない}
        - {なし: 事実, 理由: 資産台帳の事実（この行の資産の ID は、結果の「行 k の資産の ID」の概念。利用アプリがその資産の台帳から書く）}
  - 位置: "減価償却費の計算/行{行}/{列}"
    行: 7
    列: [面積又は数量, 摘要]
    型: 文字列
    注: 欄コードなし
    対応:
      場合:
        - {もし: [{概念: "所得税.事業所得の減価償却資産の行{行}.資産のID", 等しい: なし}], 空欄: 行に載せる事業所得の減価償却資産がない}
        - {なし: 事実, 理由: 資産台帳の事実・利用者が書く摘要（docs に摘要の記入の規則を写していない）}
  - 位置: "減価償却費の計算/行{行}/{列}"
    行: 7
    列: [償却保証額, 償却の基礎になる金額, 耐用年数, 本年中の償却期間]
    列の型: [金額, 金額, 数, 数]
    型: 金額
    注: 欄コードなし。償却保証額はイ欄のカッコ内（平成19年4月1日以後に取得した資産で定率法を採用する場合だけ：yoshiki-forms-r07 §6.3 の注記）。少額・一括・措法28の2・特別な方法の資産は耐用年数・本年中の償却期間が0（空欄）、特別な方法は償却の基礎も0（空欄）
    出典: [docs/public-sources/20261109_round2_yoshiki-forms-r07.md#6.3, docs/public-sources/20261109_round2_aoiro-laws-and-nta.md#7.3, docs/public-sources/20261111_impl-research3_genka-laws.md#2]
    対応:
      場合:
        - {もし: [{概念: "所得税.事業所得の減価償却資産の行{行}.資産のID", 等しい: なし}], 空欄: 行に載せる事業所得の減価償却資産がない}
        - {もし: [{概念: "所得税.事業所得の減価償却資産の行{行}.{列}", 判定: 零}], 空欄: この資産の償却の方法ではこの列を書かない（定率法以外の償却保証額、少額・一括・措法28の2・特別な方法）}
        - {そのまま: "所得税.事業所得の減価償却資産の行{行}.{列}"}
  - 位置: "減価償却費の計算/行{行}/{列}"
    行: 7
    列: [償却方法, 償却率, 事業専用割合]
    型: 文字列
    注: 欄コードなし。償却率は「償却率又は改定償却率」の欄：定率法で改定償却率に切り替えた年から改定償却率（所令120の2①一イ(2)）。少額・一括・措法28の2・特別な方法は償却率を書かない
    出典: [docs/public-sources/20261109_round2_aoiro-laws-and-nta.md#7.3, docs/public-sources/20261109_round2_genka-laws-and-nta.md#4, docs/public-sources/20261111_impl-research3_genka-laws.md#2]
    対応:
      場合:
        - {もし: [{概念: "所得税.事業所得の減価償却資産の行{行}.資産のID", 等しい: なし}], 空欄: 行に載せる事業所得の減価償却資産がない}
        - {もし: [{概念: "所得税.事業所得の減価償却資産の行{行}.{列}", 等しい: なし}], 空欄: この資産の償却の方法ではこの列を書かない（少額・一括・措法28の2・特別な方法）}
        - {そのまま: "所得税.事業所得の減価償却資産の行{行}.{列}"}
  - 位置: "減価償却費の計算/行{行}/{列}"
    行: 7
    列: [本年分の普通償却費, 本年分の償却費合計, 本年分の必要経費算入額, 未償却残高]
    型: 金額
    注: 欄コードなし。償却費合計は普通償却費＋割増（特別）償却費（下の欄）、必要経費算入額は償却費合計×事業専用割合、未償却残高は期末残高（償却費の全額で減らす）
    出典: [docs/public-sources/20261109_round2_aoiro-laws-and-nta.md#7.3, docs/public-sources/20261109_round2_genka-laws-and-nta.md#4]
    対応:
      場合:
        - {もし: [{概念: "所得税.事業所得の減価償却資産の行{行}.資産のID", 等しい: なし}], 空欄: 行に載せる事業所得の減価償却資産がない}
        - {そのまま: "所得税.事業所得の減価償却資産の行{行}.{列}"}
  - 位置: "減価償却費の計算/行{行}/割増（特別）償却費"
    行: 7
