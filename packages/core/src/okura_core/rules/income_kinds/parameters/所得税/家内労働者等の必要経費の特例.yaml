description: >-
  家内労働者等の事業所得等の所得計算の特例（租税特別措置法第27条、同施行令第18条の2）。原文と年分ごとの額：
  docs/public-sources/20261109_impl-prep_jigyo-laws-and-nta.md §2.1（表）。
額:
  description: >-
    措法27「…必要経費に算入すべき金額の合計額が六十五万円（令和8年分以後の版は六十九万円）…に満たないときは…」の額。
    給与所得を有する場合の「給与所得控除額を控除した残額」は、この版では計算しない（給与所得控除額は kyuyo の未実装の約束：income_kinds の対象外）。
