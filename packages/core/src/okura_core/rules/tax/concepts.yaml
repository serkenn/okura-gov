    集約点を通らない依存:
      - 概念: 所得税.配当控除の対象の剰余金の配当等に係る配当所得の金額
        説明: 総合課税の配当所得の金額のうちその区分のものに率を掛ける（手引き 3-4_28 の※1：損益通算の前の配当所得の金額。措法9③④）
        出典: [docs/public-sources/20261111_impl-research_haito-laws-and-nta.md#3.1, docs/public-sources/20261111_impl-research_haito-laws-and-nta.md#4]
      - 概念: 所得税.配当控除の対象の証券投資信託の収益の分配に係る配当所得の金額
        説明: 総合課税の配当所得の金額のうちその区分のものに率を掛ける（手引き 3-4_28 の※1：損益通算の前の配当所得の金額。措法9③④）
        出典: [docs/public-sources/20261111_impl-research_haito-laws-and-nta.md#3.1, docs/public-sources/20261111_impl-research_haito-laws-and-nta.md#4]
      - 概念: 所得税.配当控除の対象の一般外貨建等証券投資信託の収益の分配に係る配当所得の金額
        説明: 総合課税の配当所得の金額のうちその区分のものに率を掛ける（手引き 3-4_28 の※1：損益通算の前の配当所得の金額。措法9③④）
        出典: [docs/public-sources/20261111_impl-research_haito-laws-and-nta.md#3.1, docs/public-sources/20261111_impl-research_haito-laws-and-nta.md#4]
    パラメータ: [所得税.配当控除]
    変数: [所得税_配当控除の額]
    出力: {申告の欄: true, 申告の範囲: true}
    注: >-
      所法92①の3区分を措法9③（特定株式投資信託は剰余金の配当等）・④（一般外貨建等証券投資信託は率が半分）で読み替える。区分ごとの配当所得の金額は income_kinds の約束の3概念
