# テストの道具の規則モジュール（packages/core/tests/fixture_modules.py）。法令の概念ではない。
# グループ（法律婚）を組み立て、人をまたぐ依存とグループの組み立ての由来の状態の伝搬（D19・D21 R2）を確かめるためだけに使う。
制度: 所得税
担当: test_groups
既定: {エンティティ: 人物, 期間: 年, 判定の時点: 年分, 実装済み: true}
概念:
  - id: 所得税.試験_相手の合計所得金額
    名称: 試験：法律婚の相手の合計所得金額（グループで集約した人の配列から自分の分を引く）
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R4-modeling_concepts.md#3.2]}
    層: 人的控除・扶養の判定
    値の型: 円
    依存する概念: [所得税.合計所得金額, 所得税.法律婚]
    人をまたぐ依存:
      - 概念: 所得税.合計所得金額
        説明: 試験：配偶者の合計所得金額
        出典: [docs/public-sources/20261109_R4-modeling_concepts.md#3.2]
    変数: [所得税_試験_相手の合計所得金額]
    出力: {申告の欄: false, 申告の範囲: false}

  - id: 所得税.試験_法律婚の人数
    名称: 試験：自分の法律婚のグループの人数（変数を引かずにグループの組み方だけを使う）
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R4-modeling_concepts.md#3.2]}
    層: 人の区分
    値の型: 整数
    依存する概念: [所得税.法律婚]
    変数: [所得税_試験_法律婚の人数]
    出力: {申告の欄: false, 申告の範囲: false}
