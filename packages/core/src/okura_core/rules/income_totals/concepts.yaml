    依存する概念: [所得税.配当所得の金額, 所得税.不動産所得の金額, 所得税.事業所得の金額, 所得税.給与所得の金額, 所得税.雑所得の金額, 所得税.公的年金等に係る雑所得の金額, 所得税.退職所得を除いた区分による公的年金等に係る雑所得の金額, 所得税.一時所得の金額, 所得税.上場株式等に係る配当所得等の金額, 所得税.上場株式等に係る譲渡所得等の金額, 所得税.所得金額調整控除, 所得税.一時所得の2分の1の端数の候補, 所得税.上場株式等の譲渡損失の損益通算を適用するか, 所得税.繰り越された純損失の金額, 所得税.繰り越された雑損失の金額, 所得税.上場株式等の譲渡損失の繰越控除額, 所得税.給与所得控除後の給与等の金額]
