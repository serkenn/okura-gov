  # --- 前々年分の業務に係る雑所得の収入金額（足した 2026-11-12。prior_years.py：IK-114。prior_income_fixed を使う） ---
  - id: 所得税.前々年分の業務に係る雑所得の収入金額
    名称: 前々年分の雑所得を生ずべき業務に係る収入金額（prior_income_fixed の income_source miscellaneous_business の確定値の合計）
    定義: {条文: 所得税法第120条第6項・所得税法施行令第196条の2（前々年分の業務に係る雑所得の収入金額）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_jigyo-laws-and-nta.md#4.1, docs/public-sources/20261109_impl-prep_jigyo-laws-and-nta.md#4.3]}
    判定の時点: {問い: 年分, 説明: 確定申告書を提出する時までに確定しているところにより判定する（所基通120−4の2。問いの提出日より後に確定した記録は数えない）, 出典: [docs/public-sources/20261109_impl-prep_jigyo-laws-and-nta.md#4.3]}
    層: 事実
    変数: [所得税_前々年分の業務に係る雑所得の収入金額]
    パラメータ: [所得税.業務に係る雑所得の前々年分の収入金額の基準]
    実装済み: true
    注: >-
      記録がなく、その年分に業務に係る雑所得の業務がある人は未確定（事実）。同じ業務の記録が2件以上は c-入力（IK-114）。
      パラメータの 現金主義の上限（所令196の2：300万円）は build_inputs が 選択.現金主義（業務に係る雑所得）の要件の検査に読む（前年末現在で確定した記録：所基通67−6。IK-115）。
      事業所得・不動産所得の prior_income_fixed は令和7年分・令和8年分の規定で使わない（措法25の2② は令和9年分以後：jigyo §3）
  - id: 所得税.業務に係る雑所得の収支内訳書の添付を要するか
    名称: 業務に係る雑所得の総収入金額及び必要経費の内容を記載した書類（収支内訳書など）を確定申告書に添付しなければならないか
    定義: {条文: 所得税法第120条第6項（2027-01-01 以後は第8項）・所得税法施行規則第47条の3, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_jigyo-laws-and-nta.md#4.3]}
    値の型: 真偽
    依存する概念: [所得税.前々年分の業務に係る雑所得の収入金額, 所得税.業務に係る雑所得の総収入金額, 所得税.業務に係る雑所得の必要経費, 所得税.業務に係る雑所得の減価償却費]
    パラメータ: [所得税.業務に係る雑所得の前々年分の収入金額の基準]
    変数: [所得税_業務に係る雑所得の収支内訳書の添付を要するか]
    実装済み: true
    出力: {申告の欄: false, 申告の範囲: false}
    注: （足した 2026-11-12）その年分に業務に係る雑所得の総収入金額・必要経費・減価償却費のどれかがあり、前々年分の収入金額が1,000万円を超えるか。様式の対応表（forms）が業務に係る雑所得の収支内訳書を作るかの材料（forms README §3）

  # --- juminzei への窓口（2026-11-12 の3回目。tokutei.py。juminzei の JM-42：地方税法第313条第11項の前年の所得） ---
