description: >-
  被扶養者の年間収入の基準額（この額未満なら収入の要件を満たす）。制度ごとに出典が違う（健保は通知、共済は施行令第3条が委ねた大臣の定め）。
  19歳以上23歳未満の150万円は判定日（認定の対象の日）が適用開始日（令和7年10月1日）以後のときだけ使う（それより前に遡って認定する期間は130万円）。
