    定義: {条文: 所得税法第64条第1項、所得税法施行令第180条第2項第1号、所得税基本通達64−2の2・64−3, 根拠の種類: 政令, 出典: [docs/public-sources/20261112_impl-research4_shotoku-laws-and-nta.md#1.1, docs/public-sources/20261112_impl-research4_shotoku-laws-and-nta.md#1.3]}
    依存する概念: [所得税.回収することができないこととなった給与等の金額, 所得税.配当所得の金額, 所得税.不動産所得の金額, 所得税.事業所得の金額, 所得税.所得税法第64条第1項を当てる前の給与所得の金額, 所得税.業務に係る雑所得の金額, 所得税.その他の雑所得の金額, 所得税.回収不能額等の前の公的年金等に係る雑所得の金額, 所得税.一時所得の金額, 所得税.退職所得の金額, 所得税.上場株式等に係る配当所得等の金額, 所得税.上場株式等に係る譲渡所得等の金額, 所得税.上場株式等の譲渡損失の繰越控除額, 所得税.繰り越された純損失の金額, 所得税.繰り越された雑損失の金額, 所得税.給与等の収入金額, 所得税.特別障害者に当たるか, 所得税.一時所得の2分の1の端数の候補, 所得税.上場株式等の譲渡損失の損益通算を適用するか, 所得税.給与所得控除後の給与等の金額]
    集約点: 所得の種類ごとの所得
    変数: [所得税_回収不能額等の前の総所得金額と退職所得金額の合計額, 所得税_所得金額調整控除の第1項を当てたとした回収不能額等の前の総所得金額と退職所得金額の合計額]
    パラメータ: [所得税.所得金額調整控除]
    注: >-
      （足した 2026-11-12。KY-08）kyuyo の段 未払の給与の回収不能 が読む。損益通算・一時所得の2分の1・純損失と雑損失の繰越控除（所基通64−3）は総所得金額等と同じ関数で、
      給与所得と公的年金等に係る雑所得を回収不能額等の前の額にし、所得金額調整控除もその額で計算し直す。第1項の「扶養親族等を有するか」は段の後にしか
      決まらないので、偽とした額（本人が特別障害者なら第1項を当てる）と真とした額の2つの変数を出す（kyuyo の段が、どちらでも同じ結論かを確かめる）。
      総所得金額に措置法の読替え（上場株式等の所得を加える）は当てない（法令の読み：kyuyo の uncollectible.CAP_RULE）。回収不能額等のない人だけの評価では0

