description: >-
  特定一般用医薬品等購入費を支払った場合の医療費控除の特例（租税特別措置法第41条の17第1項。所得税法第73条第1項の読替え：
  足切りの額を「一万二千円」、上限を「八万八千円」とする）。令和7年分・令和8年分の版で本文が同じ
  （docs/public-sources/20261109_impl-prep_iryohi-law-text.md §0.1・§4.1）。令和9年分以後は改正後の条（同 §4.4。対象年分の外）。
足切り:
