    依存する概念: [所得税.身体障害者手帳の障害の程度の級, 所得税.精神障害者保健福祉手帳の障害等級, 所得税.重度の知的障害者と判定されているか, 所得税.事理を弁識する能力を欠く常況にあるか, 所得税.原子爆弾被爆者の認定を受けているか, 所得税.常に就床を要し複雑な介護を要するか, 所得税.戦傷病者手帳に特別項症から第三項症までと記載されているか, 所得税.市町村長等の特別障害者に準ずる認定を受けているか, 所得税.手帳の申請中で障害が明らかか, 所得税.申請中の障害の程度が特別障害者の程度か, 所得税.年齢]
