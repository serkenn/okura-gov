# 概念辞書：規則モジュール income_kinds（所得の種類）が担当する概念（2026-11-11）。
# 約束の18件を全部実装した。入力の事実と途中の値の概念を足した（このファイルの後半）。変数名・単位（値の型）・期間はここで決めたものを変えない（変えるときは引くモジュールの担当と合わせる）。
# 「集める先」：その所得を集める集約点（income_totals）。集約点がまだ集めない所得が0でない人は、集約点が対象外になる。
# 「未実装のとき」：未実装の間、その人にこれらの記録がその年分になければ、仮置きの変数の0を使ってよい（所得がない）。
# 山林所得・土地建物等の譲渡・非居住者本人の申告は範囲外（D20）。総合譲渡・利子の総合課税・非上場株式の譲渡・
# 現金主義・先物・平均課税・変動所得は後の段（D21 R3。入力にあれば対象外）。
制度: 所得税
担当: income_kinds
既定: {エンティティ: 人物, 期間: 年, 判定の時点: 年分, 値の型: 円, 実装済み: false, 層: 所得の種類ごとの所得}
概念:
  # --- 事実（入力変数。ほかのモジュールも使うもの） ---
  - id: 所得税.公的年金等の収入金額
    名称: その年中の公的年金等の収入金額
    定義: {条文: 所得税法第35条第2項第1号・第3項・第4項（公的年金等の収入金額）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2b_nenkin-laws-and-guidance.md#1.1, docs/public-sources/20261109_round2b_nenkin-laws-and-guidance.md#2.1]}
    判定の時点: {問い: 年分, 説明: 収入すべき時期は所基通36−14（法令等により定められた支給日）, 出典: [docs/public-sources/20261109_round2b_nenkin-laws-and-guidance.md#3]}
    層: 事実
    変数: [所得税_公的年金等の収入金額]
    実装済み: true
    出力: {申告の欄: true, 申告の範囲: true}
    注: >-
      inputs.py が pension_payment から組み立てる。国民年金・厚生年金の老齢の年金と共済組合の退職年金（老齢）を数え、障害・遺族の年金
      （共済組合の遺族年金を除く）は非課税で数えない（nenkin §4.1・§4.2）。共済組合の遺族年金・企業年金・外国の年金・生命保険契約等の年金は
      対象外。確定申告を要しない場合（所得税法第121条第3項：公的年金等の収入金額400万円以下）で tax も使う

  # --- 所得の種類ごとの所得（総合課税） ---
  - id: 所得税.配当所得の金額
    名称: 配当所得の金額（総合課税によるもの）
    定義: {条文: 所得税法第24条（配当所得）。上場株式等の配当等で申告分離課税・申告不要を選ばなかったもの（租税特別措置法第8条の4・第8条の5）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2b_kabu-law-and-nta.md#1.2, docs/public-sources/20261109_round2b_kabu-law-and-nta.md#2.1]}
    依存する概念: [所得税.総合課税の配当等の収入金額, 所得税.総合課税の配当等の負債の利子]
    変数: [所得税_配当所得の金額]
    実装済み: true
    出力: {申告の欄: true, 申告の範囲: true}
    集める先: [所得税.合計所得金額, 所得税.総所得金額]
    注: 課税方式の選択（選択.株式等の申告）が未入力なら全候補で評価する（D22 S20。最適化しない）。一般の口座の配当と源泉徴収選択口座の配当（年間取引報告書）。負債の利子（所法24②）を控除する（赤字は0：手引き 3-2_05）

  - id: 所得税.不動産所得の金額
    名称: 不動産所得の金額（青色申告特別控除の後。損失のうち土地等の負債の利子・別荘等に係る部分を除いた額）
    定義: {条文: 所得税法第26条第2項、租税特別措置法第25条の2・第41条の4、所得税法第69条第2項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2b_fudosan-laws-and-nta.md#1.1, docs/public-sources/20261109_round2b_fudosan-laws-and-nta.md#2.1, docs/public-sources/20261109_round2b_fudosan-laws-and-nta.md#4.3]}
    依存する概念: [所得税.青色申告特別控除前の不動産所得の金額, 所得税.不動産所得から控除する青色申告特別控除額, 所得税.不動産所得の損失のうち生じなかったものとみなす金額]
    変数: [所得税_不動産所得の金額]
    実装済み: true
    出力: {申告の欄: true, 申告の範囲: true}
    集める先: [所得税.合計所得金額, 所得税.総所得金額]
    注: >-
      負になりうる（損益通算は income_totals）。第一表③の金額で、損失のうち生じなかったものとみなす金額（措法41の4①・措令26の6①・所法69②・所令178①二）は除いた後の値（fudosan §4.3 の書き方の例）。
      事業的規模（判断.不動産の事業的規模）は専従者・青色申告特別控除の額・資産損失に効く。賃料の年分は受取日（基通36−5 の支払日の読み：basis の RENTAL_REVENUE）。

  - id: 所得税.青色申告特別控除前の事業所得の金額
    名称: 青色申告特別控除の前の事業所得の金額
    定義: {条文: 所得税法第27条第2項（総収入金額から必要経費を控除した金額）・第37条第1項・第45条第1項、所得税法施行令第96条、租税特別措置法第27条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_jigyo-laws-and-nta.md#1.1, docs/public-sources/20261109_impl-prep_jigyo-laws-and-nta.md#2.1]}
    依存する概念: [所得税.事業所得の総収入金額, 所得税.事業所得の必要経費, 所得税.事業所得の減価償却費, 所得税.事業所得の青色事業専従者給与の額, 所得税.事業所得の事業専従者控除額, 所得税.業務に係る雑所得の総収入金額, 所得税.業務に係る雑所得の必要経費, 所得税.業務に係る雑所得の減価償却費, 所得税.家内労働者等か, 所得税.給与等の収入金額, 所得税.給与所得控除額]
    パラメータ: [所得税.家内労働者等の必要経費の特例]
    変数: [所得税_青色申告特別控除前の事業所得の金額]
    実装済み: true
    注: >-
      途中の値（2026-11-11 に足した）。青色申告特別控除の限度（措法25の2①二・③二：事業所得の金額）と、事業所得の金額の元。
      家内労働者等の特例（措法27・措令18の2②）は業務に係る雑所得と合わせて当てる（calc.home_worker_expenses）。
      家内労働者等で給与所得がある人は「特例の額 − 給与所得控除額」（給与所得控除額は kyuyo の概念）

  - id: 所得税.事業所得の金額
    名称: 事業所得の金額（青色申告特別控除・専従者給与等の後）
    定義: {条文: 所得税法第27条（総収入金額から必要経費を控除した金額）、第57条、租税特別措置法第25条の2, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R1-laws_income-tax.md#4, docs/public-sources/20261109_impl-prep_jigyo-laws-and-nta.md#1.1]}
    依存する概念: [所得税.青色申告特別控除前の事業所得の金額, 所得税.事業所得から控除する青色申告特別控除額]
    変数: [所得税_事業所得の金額]
    実装済み: true
    出力: {申告の欄: true, 申告の範囲: true}
    集める先: [所得税.合計所得金額, 所得税.総所得金額]
    注: >-
      事業所得か業務に係る雑所得かは判断.事業と称するに至る程度（D4）。未入力なら両方で評価（D21 R6）。損失は負の値で返す（損益通算は income_totals）。
      対象外：家族への支払（所法56）・現金主義・電子帳簿による65万円など（inputs.py の docstring）

  - id: 所得税.65歳以上の者に係る公的年金等控除額の控除を受けたか
    名称: その年分に、年齢65歳以上である者に係る公的年金等控除額の控除を受けたか（公的年金等の収入があり、12月31日の年齢が65歳以上）
    定義: {条文: 租税特別措置法第41条の15の3, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2b_nenkin-laws-and-guidance.md#2.2]}
    層: 人の区分
    値の型: 真偽
    依存する概念: [所得税.公的年金等の収入金額, 所得税.年齢]
    パラメータ: [所得税.公的年金等控除額]
    変数: [所得税_65歳以上の者に係る公的年金等控除額の控除を受けたか]
    実装済み: true
    注: >-
      2026-11-11（共有の担当が足した窓口）：国保の軽減の判定の65歳以上の公的年金等の特例（国保令附則第5条・地方税法附則第35条の5）が
      住民税の窓口（住民税.65歳以上の者に係る公的年金等控除額の控除を受けたか）を通して使う。年齢の境は 公的年金等控除額 と同じパラメータ

  - id: 所得税.公的年金等に係る雑所得の金額
    名称: 公的年金等に係る雑所得の金額
    定義: {条文: 所得税法第35条第2項第1号・第4項、租税特別措置法第41条の15の3, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2b_nenkin-laws-and-guidance.md#2.1, docs/public-sources/20261109_round2b_nenkin-laws-and-guidance.md#2.2]}
    依存する概念: [所得税.公的年金等の収入金額, 所得税.公的年金等控除額]
    変数: [所得税_公的年金等に係る雑所得の金額]
    実装済み: true
    出力: {申告の欄: true, 申告の範囲: true}
    注: 雑所得の金額の内訳（集める先は雑所得の金額）。所得金額調整控除の第2項（income_totals）が直接使う

  - id: 所得税.公的年金等控除額
    名称: 公的年金等控除額
    定義: {条文: 所得税法第35条第4項、租税特別措置法第41条の15の3（65歳以上の特例）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2b_nenkin-laws-and-guidance.md#2.1, docs/public-sources/20261109_round2b_nenkin-laws-and-guidance.md#2.2]}
    依存する概念: [所得税.公的年金等の収入金額, 所得税.公的年金等に係る雑所得以外の合計所得金額, 所得税.年齢]
    パラメータ: [所得税.公的年金等控除額]
    変数: [所得税_公的年金等控除額]
    実装済み: true
    注: >-
      公的年金等に係る雑所得以外の合計所得金額は income_totals、年齢は personal_deductions が担当する（未実装の間は仮置きの変数で、
      公的年金等の収入がある人の値は対象外になる）。65歳以上の判定はその年12月31日（死亡の時）の年齢（措法41の15の3④。
      所得税.年齢 の判定の時点と同じ）。公的年金等に係る雑所得の金額の1円未満は切捨て（手引き 3-2_07：calc.PENSION_FLOOR。令和8年分の手引きは未公表で令和7年分を使う）。
      控除額は「収入金額 − 切り捨てた所得の金額」で整数にする（控除額が収入金額以上なら最低額で、整数）

  - id: 所得税.業務に係る雑所得の金額
    名称: 業務に係る雑所得の金額
    定義: {条文: 所得税法第35条第2項第2号（公的年金等以外の雑所得のうち業務に係るもの。第3項・第67条第2項・第232条第2項が「業務に係る雑所得」を使う）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R1-laws_income-tax.md#4, docs/public-sources/20261109_impl-prep_jigyo-laws-and-nta.md#4.1]}
    依存する概念: [所得税.業務に係る雑所得の総収入金額, 所得税.業務に係る雑所得の必要経費, 所得税.業務に係る雑所得の減価償却費, 所得税.家内労働者等か, 所得税.事業所得の総収入金額, 所得税.事業所得の必要経費, 所得税.事業所得の減価償却費, 所得税.事業所得の青色事業専従者給与の額, 所得税.事業所得の事業専従者控除額, 所得税.給与等の収入金額, 所得税.給与所得控除額]
    パラメータ: [所得税.家内労働者等の必要経費の特例]
    変数: [所得税_業務に係る雑所得の金額]
    実装済み: true
    出力: {申告の欄: true, 申告の範囲: true}
    注: >-
      雑所得の金額の内訳。家内労働者等の特例（租税特別措置法第27条）は事業所得と合わせて当てる（docs/public-sources/20261109_impl-prep_jigyo-laws-and-nta.md §2.1）。
      家内労働者等がいないときは事業所得の側の値を引かない（式の中の分岐）。負になりうる

  - id: 所得税.その他の雑所得の金額
    名称: その他の雑所得の金額（公的年金等・業務に係るもの以外）
    定義: {条文: 所得税法第35条第2項第2号, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2b_nenkin-laws-and-guidance.md#1.1, docs/public-sources/20261109_round2b_nenkin-laws-and-guidance.md#1.2]}
    依存する概念: [所得税.その他の雑所得の総収入金額, 所得税.その他の雑所得の必要経費]
    変数: [所得税_その他の雑所得の金額]
    出力: {申告の欄: false, 申告の範囲: false}
    実装済み: true
    注: 雑所得の金額の内訳。生命保険契約等の年金・公的な制度でない外国の年金（必要経費は判断.年金の性質）。benefit_receipt の other は対象外

  - id: 所得税.雑所得の金額
    名称: 雑所得の金額
    定義: {条文: 所得税法第35条第2項（公的年金等に係るものとそれ以外の合計）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R1-laws_income-tax.md#4]}
    依存する概念: [所得税.公的年金等に係る雑所得の金額, 所得税.業務に係る雑所得の金額, 所得税.その他の雑所得の金額]
    変数: [所得税_雑所得の金額]
    実装済み: true
    出力: {申告の欄: true, 申告の範囲: true}
    集める先: [所得税.合計所得金額, 所得税.総所得金額]
    注: 雑所得の損失は損益通算の対象にならない（所得税法第69条第1項の所得に雑所得がない：docs/public-sources/20261109_round2_genka-laws-and-nta.md §6.1）。負の値の扱いは income_totals と合わせる（この値は内訳の合計で負になりうる）

  - id: 所得税.一時所得の金額
    名称: 一時所得の金額（2分の1にする前）
    定義: {条文: 所得税法第34条（総収入金額 − 収入を得るために支出した金額 − 特別控除額）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_jigyo-laws-and-nta.md#6, docs/public-sources/20261109_R1-laws_income-tax.md#4]}
    依存する概念: [所得税.一時所得の総収入金額, 所得税.一時所得の支出した金額]
    パラメータ: [所得税.一時所得]
    変数: [所得税_一時所得の金額]
    実装済み: true
    出力: {申告の欄: true, 申告の範囲: true}
    集める先: [所得税.合計所得金額, 所得税.総所得金額]
    注: 総所得金額に入れるときの2分の1（所得税法第22条第2項第2号）は income_totals が当てる。この版は懸賞の賞金品（業務に関しないもの）と寄附の返礼品の経済的利益（価額の記録があるもの。docs/public-sources/20261109_round2_hoken-kifu-nta-soumu.md#3.5）

  # --- 所得の種類ごとの所得（分離課税で、合計所得金額に入るもの） ---
  - id: 所得税.退職所得の金額
    名称: 退職所得の金額
    定義: {条文: 所得税法第30条第2項〜第7項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2b_taishoku-laws-and-guidance.md#2.1, docs/public-sources/20261109_round2b_taishoku-laws-and-guidance.md#5.1]}
    依存する概念: [所得税.退職手当等の収入金額, 所得税.退職所得の勤続年数, 所得税.退職手当等の区分, 所得税.障害者になったことに直接基因する退職か, 所得税.前の退職手当等との重複年数, 所得税.短期退職手当等の収入金額, 所得税.特定役員退職手当等の収入金額, 所得税.短期退職所得控除額, 所得税.特定役員退職所得控除額, 所得税.所得の金額の端数の候補]
    パラメータ: [所得税.退職所得]
    変数: [所得税_退職所得の金額]
    実装済み: true
    出力: {申告の欄: true, 申告の範囲: true}
    集める先: [所得税.合計所得金額, 所得税.総所得金額等]
    注: >-
      残額の2分の1の円未満の端数は定めがない（根拠のない端数の候補）。前年以前の退職手当等との重複（所法30⑥一・所令70①二）、
      複数の支払者（所令69①三）と二以上の区分（所法30⑦・所令71の2）を計算する。勤務期間の注記（所令69①一イ〜ハ）と
      5年以下の役員等勤続期間が一部だけのもの（所令71の2⑬）は語彙がなく対象外（inputs.py）

  - id: 所得税.上場株式等に係る配当所得等の金額
    名称: 上場株式等に係る配当所得等の金額（申告分離課税を選んだもの）
