description: >-
  非課税とされる通勤手当の限度額（所得税法第9条第1項第5号、所得税法施行令第20条の2、所得税法施行規則第2条の2）。
  限度額の版は「受けるべき通勤手当」の日（支給日）で選ぶ（年分では選ばない）ので、版ごとの値を子に持ち、版の適用開始日を葉に持つ
  （所得税のパラメータの日付のキーは年分の1月1日：packages/core/tests/test_architecture.py）。令和7年分は改正前と令和7年4月以後の、
  令和8年分は令和7年4月以後と令和8年4月以後の版を、支給日で使い分ける。
