# テストの道具の規則モジュール（packages/core/tests/fixture_modules.py）。法令の概念ではない。
# 登録の仕組み・判断の候補評価（D21 R6）・状態の伝搬・仮置きの変数の扱いを確かめるためだけに使う。
制度: 所得税
担当: test_decisions
既定: {エンティティ: 人物, 期間: 年, 判定の時点: 年分, 実装済み: true}
概念:
  - id: 所得税.試験_申告者と生計を一にする
    名称: 試験：先頭の人と生計を一にするか（判断.生計を一にする から写す）
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R4-modeling_concepts.md#4.1]}
    層: 事実
    値の型: 真偽
    変数: [所得税_試験_申告者と生計を一にする]
    出力: {申告の欄: false, 申告の範囲: false}

  - id: 所得税.試験_扶養の目安
    名称: 試験：生計を一にし、扶養親族の合計所得金額要件を満たすか
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R1-laws_income-tax.md#4]}
    層: 人的控除・扶養の判定
    値の型: 真偽
    依存する概念: [所得税.試験_申告者と生計を一にする, 所得税.扶養親族の合計所得金額要件]
    変数: [所得税_試験_扶養の目安]
    出力: {申告の欄: false, 申告の範囲: false}

  - id: 所得税.試験_未実装の区分
    名称: 試験：未実装の約束（「未実装のとき」なし。仮置きの変数）
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R4-modeling_concepts.md#2.2]}
    層: 人の区分
    値の型: 整数
    実装済み: false
    変数: [所得税_試験_未実装の区分]

  - id: 所得税.試験_未実装の所得
    名称: 試験：未実装の約束（業務の記録がなければ0とみなせる。仮置きの変数）
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R1-laws_income-tax.md#4]}
    層: 所得の種類ごとの所得
    値の型: 円
    実装済み: false
    未実装のとき: {零とする記録の種類: [business, business_receipt], 説明: 試験}
    変数: [所得税_試験_未実装の所得]

  - id: 所得税.試験_年齢を使う
    名称: 試験：未実装の約束（仮置きの変数）を引く（以前は実在の年齢を引いていた）
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R4-modeling_concepts.md#2.2]}
    層: 人的控除・扶養の判定
    値の型: 整数
    依存する概念: [所得税.試験_未実装の区分]
    変数: [所得税_試験_年齢を使う]
    出力: {申告の欄: false, 申告の範囲: false}

  - id: 所得税.試験_事業所得を使う
    名称: 試験：未実装の約束（仮置きの変数。記録がなければ0とみなせる）を引く（以前は実在の事業所得の金額を引いていた）
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R1-laws_income-tax.md#4]}
    層: 所得の種類ごとの所得
    値の型: 円
    依存する概念: [所得税.試験_未実装の所得]
    変数: [所得税_試験_事業所得を使う]
    出力: {申告の欄: false, 申告の範囲: false}
