# 概念辞書：規則モジュール income_totals（所得の合計・損益通算・繰越・繰戻し）が担当する概念。
# 2026-11-11：約束の16件を全部実装した（繰戻しは単純な場合だけ：README §4）。
# 所得金額調整控除は第1項・第2項。第1項の「有する」は personal_deductions の段階評価の段が書く入力。
# 変数名・単位（値の型）・期間・層は約束で、変えない（変えるときは引くモジュールの担当と合わせる）。
# 足した概念（約束の外）：退職所得金額（所法22③。tax の課税退職所得金額が使う想定）、端数の候補・選択から作る入力の3件、繰戻しの入力の5件。
# 所得の種類ごとの所得（income_kinds）は、損失が負の値で来る前提（不動産所得・事業所得・上場株式等に係る譲渡所得等）。
制度: 所得税
担当: income_totals
既定: {エンティティ: 人物, 期間: 年, 判定の時点: 年分, 値の型: 円, 実装済み: true, 層: 中心の概念}
概念:
  # --- 事実（入力変数）：前年以前の申告書の記載から作る、その年分の入力 ---
  - id: 所得税.繰り越された純損失の金額
    名称: 前年以前3年内に生じ、まだ控除されていない純損失の金額（青色申告書を提出した年分のもの）
    定義: {条文: 所得税法第70条第1項・第4項（青色申告書を提出した年分の純損失。連続して確定申告書を提出している場合）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_aoiro-laws-and-nta.md#5.2, docs/public-sources/20261109_round2_genka-laws-and-nta.md#7]}
    層: 事実
    変数: [所得税_繰り越された純損失の金額]
    注: >-
      提出した確定申告書・損失申告書の記載（filed_document の reported_amounts）から inputs.py が組み立てる（前年以前の記載はその年分の入力。
      式はほかの年分を引かない）。読み方は README §3。純損失が生じた年分が青色か（所法70①）は青色申告の承認の通知の記録で確かめ、
      決まらなければ対象外（白色の年の変動所得・被災事業用資産の損失の繰越は後の段：D21 R3）

  - id: 所得税.繰り越された雑損失の金額
    名称: 前年以前3年内に生じ、まだ控除されていない雑損失の金額
    定義: {条文: 所得税法第71条第1項・第2項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round3_shibo-shukkoku-laws-and-nta.md#8]}
    層: 事実
    変数: [所得税_繰り越された雑損失の金額]
    注: 前年分の申告書の記載（casualty_loss_carryforward）から組み立てる。特定非常災害の5年の繰越（所法71の2）は後の段（D22 S12）で、3年を超える損失の記載があれば対象外

  - id: 所得税.繰り越された上場株式等の譲渡損失の金額
    名称: 前年以前3年内に生じ、まだ控除されていない上場株式等に係る譲渡損失の金額
    定義: {条文: 租税特別措置法第37条の12の2第5項・第7項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2b_kabu-law-and-nta.md#6]}
    層: 事実
    変数: [所得税_繰り越された上場株式等の譲渡損失の金額]
    注: 前年分の申告書の記載（listed_stock_loss_carryforward。申告書第三表の「翌年以後に繰り越される損失の金額」に当たる）から組み立てる

  # --- 事実（入力変数）：端数の候補・納税者の選択から作る入力 ---
  - id: 所得税.一時所得の2分の1の端数の候補
    名称: 総所得金額に入れる一時所得の金額の2分の1の1円未満の端数の処理の候補（evaluate が候補ごとに入れる）
    定義: {条文: 所得税法第22条第2項第2号（二分の一に相当する金額。端数の定めがない）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_jigyo-laws-and-nta.md#6, docs/public-sources/20261109_impl-prep_jigyo-laws-and-nta.md#11]}
    層: 事実
    値の型: 区分
    変数: [所得税_一時所得の2分の1の端数の候補]
    注: >-
      令和7年分は手引きの計算欄の注記（「1円未満の端数があるときは、その端数を切り捨てます。」：docs/public-sources/20261109_round2_yoshiki-forms-r07.md §2 の ⑪）に従い、
      この候補を引かない（D21 R5・D22 S2）。令和8年分は手引きが未公表なので根拠のない端数（D22 S3）：RoundingSlotSpec が切捨て・切上げ・四捨五入を入れる。金額だけが違えば幅

  - id: 所得税.上場株式等の譲渡損失の損益通算を適用するか
    名称: 上場株式等に係る譲渡損失を申告分離課税の配当所得等から控除する（損益通算）旨を確定申告書に記載するか
    定義: {条文: 租税特別措置法第37条の12の2第1項・第3項（適用を受けようとする旨の記載と明細書の添付がある確定申告書に限る）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2b_kabu-law-and-nta.md#6]}
    層: 事実
    値の型: 真偽
    変数: [所得税_上場株式等の譲渡損失の損益通算を適用するか]
    注: 選択.株式等の申告（loss_offset）から作る。未入力なら真・偽の両方で評価する（D21 R6・D22 S20。最適化しない）

  - id: 所得税.上場株式等の譲渡損失の繰越控除を適用するか
    名称: 繰り越された上場株式等に係る譲渡損失をその年分に控除する旨の明細書を確定申告書に添付するか
    定義: {条文: 租税特別措置法第37条の12の2第5項・第7項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2b_kabu-law-and-nta.md#6]}
    層: 事実
    値の型: 真偽
    変数: [所得税_上場株式等の譲渡損失の繰越控除を適用するか]
    注: 選択.株式等の申告（carryforward）から作る。未入力なら真・偽の両方で評価する（D21 R6・D22 S20）

  - id: 所得税.前年分の課税総所得金額
    名称: 前年分の課税総所得金額（提出した前年分の申告書の記載）
    定義: {条文: 所得税法第140条第1項第1号, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_aoiro-laws-and-nta.md#5.3]}
    層: 事実
    変数: [所得税_前年分の課税総所得金額]
    注: 前年分の申告書の taxable_income_total。前年以前の記載はその年分の入力（式でほかの年分を引かない）

  - id: 所得税.前年分の課税退職所得金額
    名称: 前年分の課税退職所得金額（提出した前年分の申告書の記載）
    定義: {条文: 所得税法第140条第1項第1号、所得税法施行令第271条第1項第3号, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_aoiro-laws-and-nta.md#5.3]}
    層: 事実
    変数: [所得税_前年分の課税退職所得金額]
    注: 前年分の申告書の taxable_retirement_income（記載がなければ0。記載があるかは別の概念）

  - id: 所得税.前年分の課税山林所得金額
    名称: 前年分の課税山林所得金額（提出した前年分の申告書の記載）
    定義: {条文: 所得税法第140条第1項第1号、所得税法施行令第271条第1項第3号, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_aoiro-laws-and-nta.md#5.3]}
    層: 事実
    変数: [所得税_前年分の課税山林所得金額]
    注: 前年分の申告書の taxable_timber_income。山林所得は範囲外（D20）で、繰り戻す額が課税総所得金額を超え、これが正なら還付請求額を対象外（範囲外）にする

  - id: 所得税.前年分の課税退職所得金額等の記載があるか
    名称: 前年分の申告書に課税退職所得金額・課税山林所得金額の記載（0 を含む）があるか
    定義: {条文: 所得税法施行令第271条第1項第3号, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_aoiro-laws-and-nta.md#5.3]}
    層: 事実
    値の型: 真偽
    変数: [所得税_前年分の課税退職所得金額等の記載があるか]
    注: 繰り戻す額が前年分の課税総所得金額を超えるときだけ要る（控除先が決まらないので、記載がなければ還付請求額を対象外にする：0 か書き忘れかを区別できない）

  - id: 所得税.前年分の税額控除後の所得税の額
    名称: 前年分の所得税の額（税額控除の後。繰戻しの還付の限度）
    定義: {条文: 所得税法第140条第2項、所得税基本通達140・141−2, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_aoiro-laws-and-nta.md#5.3]}
    層: 事実
    変数: [所得税_前年分の税額控除後の所得税の額]
    注: 前年分の申告書の income_tax_after_credits

  - id: 所得税.前年分に青色申告書を提出したか
    名称: 前年分の所得税につき青色申告書を提出しているか
    定義: {条文: 所得税法第140条第4項・第141条第3項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_aoiro-laws-and-nta.md#5.3, docs/public-sources/20261109_round3_shibo-shukkoku-laws-and-nta.md#9]}
    層: 事実
    値の型: 真偽
    変数: [所得税_前年分に青色申告書を提出したか]
    注: 前年分の申告書の記録と、青色申告の承認の通知の記録（inputs.py の blue_evidence）から作る

  - id: 所得税.繰り戻す純損失の金額の選択
    名称: 前年分に繰り戻す純損失の金額（納税者の選択。全額の候補は int の上限の値）
    定義: {条文: 所得税法第140条第1項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_aoiro-laws-and-nta.md#5.3]}
    層: 事実
    変数: [所得税_繰り戻す純損失の金額の選択]
    注: 選択.損失申告と繰戻し（carryback_amount）。未入力なら「繰り戻さない」「全額を繰り戻す」の候補で評価（D22 S20）。一部の額の候補は持たない（入力された額はそのまま使う）

  - id: 所得税.その年分の確定申告書を期限内に提出するか
    名称: その年分の青色申告書を提出期限までに提出するか
    定義: {条文: 所得税法第140条第4項・第141条第3項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_aoiro-laws-and-nta.md#5.3, docs/public-sources/20261109_round3_shibo-shukkoku-laws-and-nta.md#9]}
    層: 事実
    値の型: 真偽
    変数: [所得税_その年分の確定申告書を期限内に提出するか]
    注: 計画.申告の方法と時期 の within_deadline（印「計画」が伝わる）。income_kinds の青色申告特別控除と同じ1か所（kind と key が人の ID）を使う

  # --- 事実（入力変数）：前々年分への繰戻し（所法140⑤・141④、所令272）---
  - id: 所得税.前々年分に繰り戻す純損失の金額
    名称: 事業の全部の譲渡・廃止等又は死亡の年の前年の純損失のうち、前々年分に繰り戻す金額
    定義: {条文: 所得税法第140条第5項・第141条第4項、所得税法施行令第272条第1項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_aoiro-laws-and-nta.md#5.3, docs/public-sources/20261109_round3_shibo-shukkoku-laws-and-nta.md#9]}
    層: 事実
    変数: [所得税_前々年分に繰り戻す純損失の金額]
    注: >-
      選択.損失申告と繰戻し の second_prior_year_carryback_amount を、前年分の申告書の純損失の金額（net_loss_total − net_loss_carryback）を限度に切り詰めた額。
      事実（blue_return_procedure の business_transfer_or_closure・死亡）か 判断.事業の休止・重要部分の譲渡、前年分・前々年分の青色申告書が要件（inputs.py の second_prior）。
      選択が未入力なら「繰り戻さない」「全額」、判断が未入力なら判断の候補の全部で評価する（D21 R6・D22 S20）。繰り戻した額は繰り越された純損失の金額から除く（所法70① かっこ書）

  - id: 所得税.前々年分の課税総所得金額
    名称: 前々年分の課税総所得金額（提出した前々年分の申告書の記載）
    定義: {条文: 所得税法施行令第272条第2項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_aoiro-laws-and-nta.md#5.3, docs/public-sources/20261109_round3_shibo-shukkoku-laws-and-nta.md#9]}
    層: 事実
    変数: [所得税_前々年分の課税総所得金額]
    注: 前々年分の申告書の taxable_income_total（繰り戻す額が正のときだけ入れる）

  - id: 所得税.前々年分の課税退職所得金額
    名称: 前々年分の課税退職所得金額（提出した前々年分の申告書の記載）
    定義: {条文: 所得税法施行令第272条第2項・第271条第1項第3号, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_aoiro-laws-and-nta.md#5.3, docs/public-sources/20261109_round3_shibo-shukkoku-laws-and-nta.md#9]}
    層: 事実
    変数: [所得税_前々年分の課税退職所得金額]
    注: 前々年分の申告書の taxable_retirement_income。繰り戻す額が課税総所得金額を超え、課税退職所得金額・課税山林所得金額の記載がなければ対象外、課税山林所得金額が正なら範囲外（inputs.py）

  - id: 所得税.前々年分の税額控除後の所得税の額
    名称: 前々年分の所得税の額（税額控除の後。前々年分への繰戻しの還付の限度）
    定義: {条文: 所得税法施行令第272条第2項、所得税法第140条第2項、所得税基本通達140・141−2, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_aoiro-laws-and-nta.md#5.3, docs/public-sources/20261109_round3_shibo-shukkoku-laws-and-nta.md#9]}
    層: 事実
    変数: [所得税_前々年分の税額控除後の所得税の額]
    注: 前々年分の申告書の income_tax_after_credits

  - id: 所得税.前々年分に既に繰り戻した純損失の金額
    名称: 前年分の申告で前々年分に繰り戻した前年の純損失の金額（所法140①・141①）
    定義: {条文: 所得税法施行令第272条第2項後段, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_aoiro-laws-and-nta.md#5.3, docs/public-sources/20261109_round3_shibo-shukkoku-laws-and-nta.md#9]}
    層: 事実
    変数: [所得税_前々年分に既に繰り戻した純損失の金額]
    注: 前年分の申告書の net_loss_carryback。前々年分の課税総所得金額等からこの額を控除し、その還付額を所得税の額から控除したものとみなす（所令272② 後段）

  # --- 所得の種類ごとの所得の層の合計（公的年金等控除額が使う） ---
  - id: 所得税.公的年金等に係る雑所得以外の合計所得金額
    名称: 公的年金等に係る雑所得以外の合計所得金額
    定義: {条文: 所得税法第35条第4項（その年中の公的年金等の収入金額がないものとして計算した場合の合計所得金額）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2b_nenkin-laws-and-guidance.md#2.1]}
    層: 所得の種類ごとの所得
    依存する概念: [所得税.配当所得の金額, 所得税.不動産所得の金額, 所得税.事業所得の金額, 所得税.給与所得の金額, 所得税.業務に係る雑所得の金額, 所得税.その他の雑所得の金額, 所得税.一時所得の金額, 所得税.退職所得の金額, 所得税.上場株式等に係る配当所得等の金額, 所得税.上場株式等に係る譲渡所得等の金額, 所得税.一時所得の2分の1の端数の候補, 所得税.上場株式等の譲渡損失の損益通算を適用するか]
    変数: [所得税_公的年金等に係る雑所得以外の合計所得金額]
    注: >-
      合計所得金額と同じ式で、雑所得を業務に係るものとその他のもの（公的年金等に係るものを除く）にする。所得金額調整控除の第2項の適用は
      ないものとして計算する（所基通35−8：docs/public-sources/20261109_round2b_nenkin-laws-and-guidance.md §2.1 の後の通達の記載）。
      第1項（未実装）は給与等の収入金額850万円超の人だけにありうるので、その人に公的年金等の収入があれば checks.py が対象外にする（年金がなければこの値を使う規則はない）。
      公的年金等控除額（income_kinds）が使うので、所得の種類ごとの所得と同じ層に置く（中心の概念の所得金額調整控除を引けない）

  # --- 中心の概念 ---
  - id: 所得税.所得金額調整控除
    名称: 所得金額調整控除の額（第1項と第2項の合計）
    定義: {条文: 租税特別措置法第41条の3の11第1項・第2項（第5項で総所得金額の給与所得の金額を控除後の残額に読み替える）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_gaps-sources.md#3.1, docs/public-sources/20261109_round2_gaps-sources.md#3.5]}
    判定の時点: {問い: 年分, 説明: 第1項の特別障害者・扶養親族などに当たるかは、その年12月31日（死亡・出国の時）の現況（同条第3項）, 出典: [docs/public-sources/20261109_round2_gaps-sources.md#3.1]}
    依存する概念: [所得税.給与所得控除後の給与等の金額, 所得税.公的年金等に係る雑所得の金額, 所得税.給与等の収入金額, 所得税.特別障害者に当たるか, 所得税.所得金額調整控除の対象の親族等を有するか]
    集約点を通らない依存:
      - 概念: 所得税.給与所得控除後の給与等の金額
        説明: >-
          第2項の「給与所得控除後の給与等の金額」（同条第4項第5号。令和8年分は措令19の4の2 で措法29の4② の給与所得の金額に読み替える）。
          特定支出控除の前の額（2026-11-12、kyuyo の KY-11 で kyuyo の担当が直した。以前は 所得税.給与所得の金額 を引いていた）
        出典: [docs/public-sources/20261109_round2_gaps-sources.md#3.1, docs/public-sources/20261109_round2_gaps-sources.md#3.3, docs/public-sources/20261112_impl-research8_tokutei-shishutsu-laws.md#5]
      - 概念: 所得税.公的年金等に係る雑所得の金額
        説明: 第2項の「公的年金等に係る雑所得の金額」（同条第4項第6号）
        出典: [docs/public-sources/20261109_round2_gaps-sources.md#3.1]
      - 概念: 所得税.給与等の収入金額
        説明: 第1項の「給与等の収入金額」（850万円超の判定と控除額の計算）
        出典: [docs/public-sources/20261109_round2_gaps-sources.md#3.1]
    変数: [所得税_所得金額調整控除]
    パラメータ: [所得税.所得金額調整控除]
    出力: {申告の欄: false, 申告の範囲: true}
    注: >-
      第1項の「有する」は personal_deductions の段階評価の段が人ごとに書く入力（同じ子を夫婦の双方が有する：措通41の3の11−1）。
      第1項の1円未満の端数は TA No.1411 の切上げ（国税庁の説明。根拠の種類で分かる）。第2項は第1項の控除の後の給与所得の金額から控除する。
      第2項は整数の円だけの計算で端数が出ない（条文に端数の定めがない：§3.1・実測 C3）

