  # =====================================================================
  - id: 住民税.分離課税に係る退職所得の金額
    名称: 所得税の源泉徴収の対象となる退職手当等に係る退職所得の金額（他の所得と区分する）
    定義: {条文: 地方税法第328条・第328条の2, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2b_taishoku-laws-and-guidance.md#6.3, docs/public-sources/20261109_round2_juminzei-tax-law-text.md#12]}
    層: 中心の概念
    値の型: 円
    依存する概念: [住民税.分離課税の退職所得の区分が決まらないか]
    制度をまたぐ依存:
      - {概念: 所得税.退職所得の金額, 説明: 所得税法第30条の計算の例（第328条の2）。損益通算・繰越控除の前の額（分離課税なので他の所得の損失を通算しない。JM-20）, 出典: [docs/public-sources/20261109_round2b_taishoku-laws-and-guidance.md#6.1]}
      - {概念: 所得税.退職手当等の全部が源泉徴収の対象か, 説明: 源泉徴収の対象の退職手当等だけが分離課税（第328条）, 出典: [docs/public-sources/20261109_round2b_taishoku-laws-and-guidance.md#6.3]}
    集約点を通らない依存:
      - {概念: 所得税.退職所得の金額, 説明: 分離課税に係る退職所得は所得税法第30条の計算の例による退職所得の金額そのもの（損益通算の後の集約点の値では分けられない：第328条の2）, 出典: [docs/public-sources/20261109_round2b_taishoku-laws-and-guidance.md#6.1]}
    変数: [住民税_分離課税に係る退職所得の金額]
    注: （足した）

  - id: 住民税.分離課税の退職所得の区分が決まらないか
    名称: 源泉徴収の対象の退職手当等とそれ以外の退職手当等が両方あるか（分離課税と総合課税に分ける計算の一次情報がない：分かれ目）
    定義: {条文: 地方税法第313条・第328条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2b_taishoku-laws-and-guidance.md#6.3, docs/public-sources/20261109_round2b_taishoku-laws-and-guidance.md#9]}
    層: 事実
    値の型: 真偽
    変数: [住民税_分離課税の退職所得の区分が決まらないか]
    注: （足した 2026-11-12。JM-19）

  - id: 住民税.住民税の申告書で特定支出控除を受けるか
    名称: 前年分の所得税の納税義務がなく所得税で特定支出控除を受けない人が、住民税の申告書に適用を受ける旨と特定支出の額の合計額を記載したか（第313条第11項が当たるか）
    定義: {条文: 地方税法第313条第11項・第32条第11項, 根拠の種類: 法律, 出典: [docs/public-sources/20261112_impl-research8_tokutei-shishutsu-laws.md#6]}
    層: 事実
    値の型: 真偽
    段階: 住民税の特定支出控除の申告
    変数: [住民税_住民税の申告書で特定支出控除を受けるか]
    注: >-
      （足した 2026-11-12 の2回目。JM-41）段 住民税の特定支出控除の申告（tokutei.py）が書く。所得税の 所得税.特定支出の額の合計額が給与所得控除額の2分の1を超えるか・
      所得税.特定支出控除の適用を受けるか（偽）・所得税.基準所得税額・所得税.算出税額・所得税.配当控除の額（読み:住民税の特定支出控除の所得税の納税義務。
      2026-11-12 の9回目に所得税法第120条第1項の基準〔算出税額が配当控除の額以下〕を3つ目の候補に足した。2026-11-12 の10回目に、同項の基準に
      租税特別措置法第41条の2の2第6項第2号の読替えを含めた4つ目の候補を足し、所得税.年末調整で控除された住宅借入金等特別控除の額 を読む）と、選択.住民税の申告 の
      specific_expense_deduction（読んだときだけ開く）で決める

  - id: 住民税.第313条第11項の前年の所得
    名称: 住民税の申告書だけで受ける特定支出控除の後の給与所得の金額・合計所得金額（損益通算の後・繰越控除の前）・損益通算の後の退職所得の金額
    定義: {条文: 地方税法第313条第2項・第11項（所得税法第57条の2第1項の例）、所得税法第69条・同施行令第198条（損益通算の計算の例）, 根拠の種類: 法律, 出典: [docs/public-sources/20261112_impl-research8_tokutei-shishutsu-laws.md#6, docs/public-sources/20261109_round2_genka-laws-and-nta.md#6.1]}
    層: 事実
    段階: 住民税の特定支出控除の申告
    変数: [住民税_第313条第11項の給与所得の金額, 住民税_第313条第11項の合計所得金額, 住民税_第313条第11項の損益通算の後の退職所得の金額]
    注: >-
      （足した 2026-11-12 の2回目。JM-41）段が書く（当たらない人は0）。給与所得は kyuyo の 所得税.特定支出控除を当てた場合の給与所得の金額、合計所得金額は所得税の合計所得金額
      （分離課税に係る退職所得のある人は income_totals の窓口）から、所得金額調整控除の後の給与所得の差を所得税法施行令第198条の順で当てた差を引く。
      一時所得の2分の1 の1円未満は令和7年分は手引きの切捨て、令和8年分は根拠のない端数の候補（RoundingSlotSpec。法令の読み：仮説 impl-research8 H10）。
      2026-11-12 の3回目（JM-42）：差で計算するのをやめ、所得税の各モジュールの窓口（income_totals の 所得税.特定支出控除を当てた場合の回収不能額等の後の給与所得の金額・
      所得税.特定支出控除を当てた場合の合計所得金額・所得税.特定支出控除を当てた場合の分離課税の退職所得を除いた合計所得金額・
      所得税.特定支出控除を当てた場合の損益通算の後の退職所得の金額）を写す。未払の給与の回収不能額等・公的年金等控除額の区分の変化も含めて計算し直す。
      一時所得の2分の1 の1円未満は所得税と同じ候補（所得税.一時所得の2分の1の端数の候補）

  - id: 住民税.合計所得金額
    名称: 合計所得金額（住民税）
    定義: {条文: 地方税法第292条第1項第13号（第313条第8項・第9項の繰越控除の前）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_juminzei-tax-law-text.md#2, docs/public-sources/20261109_R1-laws_local-tax.md#2]}
    判定の時点:
      問い: 年度
      説明: その年度の前年の所得（扶養・非課税の判定は「前年の合計所得金額」）
      出典: [docs/public-sources/20261109_impl-prep_kyuyo-sources.md#3.3]
    層: 中心の概念
    値の型: 円
    依存する概念: [住民税.分離課税に係る退職所得の金額, 住民税.住民税の申告書で特定支出控除を受けるか, 住民税.第313条第11項の前年の所得]
    制度をまたぐ依存:
      - {概念: 所得税.分離課税の退職所得を除いた所得の合計, 説明: 分離課税に係る退職所得がある人は、損益通算・公的年金等控除額の区分をその退職所得がないものとして計算した額（income_totals の窓口。JM-20・JM-23）, 出典: [docs/public-sources/20261109_round2b_taishoku-laws-and-guidance.md#6.3]}
      - 概念: 所得税.合計所得金額
        説明: >-
          前年分の所得税の合計所得金額（同じ situation の値。措置法の所得計算の特例を含む：chiho-sochi H1）から分離課税に係る退職所得の金額を除く
          （退職所得は他の所得と区分する：地方税法第328条。住民税の扶養の要件の合計所得金額に退職所得を含めない）
        出典: [docs/public-sources/20261109_round2_juminzei-tax-law-text.md#2, docs/public-sources/20261109_round2b_taishoku-laws-and-guidance.md#6.3]
    変数: [住民税_合計所得金額]
    出力: {申告の欄: false, 申告の範囲: false}

  - id: 住民税.総所得金額等
    名称: 所得割の課税標準の総所得金額・退職所得金額・山林所得金額の合計
    定義: {条文: 地方税法第313条第1項・第2項（前年の所得について、所得税法の総所得金額などの計算の例により算定）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_juminzei-tax-law-text.md#2, docs/public-sources/20261109_impl-prep_kyuyo-sources.md#3.1]}
