# テストの道具の規則モジュール（packages/core/tests/fixture_modules.py）。法令の概念ではない。
# 対象外の伝わり方（集め忘れの検出で値が0でも対象外の入力なら止める、途中の変数の対象外、ほかの年分の値）を確かめるためだけに使う。
制度: 所得税
担当: test_coverage
既定: {エンティティ: 人物, 期間: 年, 判定の時点: 年分, 実装済み: true}
概念:
  - id: 所得税.試験_一時の受取
    名称: 試験：一時所得の材料の受取（この道具は対象外にして0を入れる）
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R1-laws_income-tax.md#4]}
    層: 事実
    値の型: 円
    変数: [所得税_試験_一時の受取]

  - id: 所得税.試験_集めない所得
    名称: 試験：合計所得金額に集める先を書いたが、合計所得金額がまだ引いていない所得
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R1-laws_income-tax.md#4]}
    層: 所得の種類ごとの所得
    値の型: 円
    依存する概念: [所得税.試験_一時の受取]
    集める先: [所得税.合計所得金額]
    変数: [所得税_試験_集めない所得]

  - id: 所得税.試験_中間
    名称: 試験：出力でない途中の変数（計算の後の検出で対象外にする）
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R1-laws_income-tax.md#4]}
    層: 所得の種類ごとの所得
    値の型: 円
    依存する概念: [所得税.給与所得の金額]
    変数: [所得税_試験_中間]

  - id: 所得税.試験_中間を使う
    名称: 試験：途中の変数を引く値
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R1-laws_income-tax.md#4]}
    層: 所得の種類ごとの所得
    値の型: 円
    依存する概念: [所得税.試験_中間]
    変数: [所得税_試験_中間を使う]
    出力: {申告の欄: false, 申告の範囲: false}

  - id: 所得税.試験_前年の給与等の収入金額
    名称: 試験：前年分の給与等の収入金額を引く値
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R1-laws_income-tax.md#4]}
    層: 所得の種類ごとの所得
    値の型: 円
    依存する概念: [所得税.給与等の収入金額]
    年をまたぐ依存:
      - 概念: 所得税.給与等の収入金額
        時点: 前年分
        出典: [docs/public-sources/20261109_R1-laws_income-tax.md#4]
    変数: [所得税_試験_前年の給与等の収入金額]
    出力: {申告の欄: false, 申告の範囲: false}
