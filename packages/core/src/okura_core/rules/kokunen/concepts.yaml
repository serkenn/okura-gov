  - id: 国年.申請する免除等の種類
    名称: 選択.国民年金の免除の申請 で申請する免除等の種類（その年度）
    定義: {条文: 国民年金法第90条第1項・第90条の2第1項〜第3項・第90条の3第1項・第88条の2、平成16年法律第104号附則第19条第2項、平成26年法律第64号附則第14条第1項, 根拠の種類: 法律, 出典: [docs/public-sources/20261111_impl-research3_kokunen-laws.md#1, docs/public-sources/20261111_impl-research3_kokunen-laws.md#4]}
    層: 事実
    値の型: 区分
    変数: [年金_申請する免除等の種類]
    注: >-
      （足した 2026-11-12。語彙の突き合わせ）選択.国民年金の免除の申請（C-17。when.fiscal_year がその年度）の apply と exemption_type：全額免除・4分の3免除・半額免除・4分の1免除・
      納付猶予・学生納付特例・産前産後・種類の指定なし（apply が真で種類がない）・申請しない（apply が偽）。選択がなければ「選択なし」（1か所を置かない：
      申請する種類の基準は選択がなければ問われず、種類ごとの所得の基準は別の概念が全員に出す）。承認は npi_exemption（F-D09）で、この値は承認を意味しない

  - id: 国年.申請する免除等の所得の基準
    名称: 申請する免除等の種類の所得の基準を、審査される人（全額免除・一部免除は本人・世帯主・配偶者、納付猶予は本人・配偶者、学生納付特例は本人）の全員が満たすか
    定義: {条文: 国民年金法第90条第1項・第90条の2第1項〜第3項・第90条の3第1項・第88条の2、平成16年法律第104号附則第19条第2項、平成26年法律第64号附則第14条第1項, 根拠の種類: 法律, 出典: [docs/public-sources/20261111_impl-research3_kokunen-laws.md#1, docs/public-sources/20261111_impl-research3_kokunen-laws.md#4]}
    層: 税額
    値の型: 区分
    変数: [年金_申請する免除等の所得の基準]
    依存する概念:
      - 国年.申請する免除等の種類
      - 国年.全額免除の所得基準を満たすか
      - 国年.一部免除の区分
      - 国年.学生納付特例の所得基準を満たすか
      - 国年.令和8年6月以前の月分の学生納付特例の所得基準を満たすか
      - 国年.納付猶予の所得基準を満たすか
    出力: {申告の欄: false, 申告の範囲: false}
    注: >-
      （足した 2026-11-12。語彙の突き合わせ）免除等は「…被保険者等から申請があつたとき」に限る（[PS3-KN] §1）。値は「満たす」「満たさない」、学生納付特例で年度の4月〜6月分と
      7月以後の月分の判定が違えば（令和8年度）「4月〜6月分だけ満たす」「7月以後の月分だけ満たす」、産前産後は「申請の対象でない（産前産後の免除は法律上当然：第88条の2）」
      （[PS3-KN] §4）、種類の指定なし・申請しない・選択なしはその名前。一部免除は、満たす最も寛大な区分（国年.一部免除の区分）が申請する区分と同じか寛大なら満たす
      （基準額は 88万・128万・168万円に同じ加算額、135万円の経路は全部の区分に当たる）。所得の基準だけで、学生等である期間（国年.免除等の期間の学生等である月数）・
      納付猶予の年齢・天災などは見ない。承認されるか（厚生労働大臣の処分）ではない

