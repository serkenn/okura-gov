description: >-
  申告などの期限が当たると翌日に繰り下がる日（国税通則法第10条第2項：日曜日、国民の祝日に関する法律に規定する休日、その他一般の休日、
  政令で定める日）。日付のキーは暦年の1月1日（その暦年の日）。日曜日は通則法第10条第2項の本文、振替休日・国民の休日は
  祝日法第3条第2項・第3項の規則で、rules/tax/calc.py が作る。値の書き方：月日 "MM-DD"、第n月曜日 "MM-第n月曜日"、
  暦要項が未発表の年 "未発表"。docs/public-sources/20261109_round3_shibo-shukkoku-laws-and-nta.md §6・§6.1（D22 S9：祝日は暦要項と通達）。
