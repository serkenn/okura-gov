description: >-
  減価償却（所得税法第49条・第2条第1項第19号、所得税法施行令第120条の2・第125条・第132条・第134条・第138条・第139条、
  減価償却資産の耐用年数等に関する省令第5条第1項第1号・別表第八、租税特別措置法第28条の2・同施行令第18条の5）。
  原文：docs/public-sources/20261109_round2_genka-laws-and-nta.md §2.1・§2.2・§3.1・§3.2。
  定額法の償却率は別表第八（平成19年4月1日以後に取得をされた減価償却資産）で、令和7年分・令和8年分の版で同じ（genka §2.2。全行は
  scripts/results/R2X_genka_laws/taiyo_tables_2026-12-31.json）。千分率の整数で持つ（償却率＝値／1000）。旧定額法・旧定率法・定率法の率・残存割合・旧償却の限度は末尾（耐用年数省令4①・5①二・6①・別表第七・第九〜第十一、所令134①一イ・②。
  docs/public-sources/20261111_impl-research3_genka-laws.md §1・§3〜§5。保証率は十万分率の整数）。
少額の減価償却資産の取得価額の上限:
  description: 所令138①「十万円未満」（使用可能期間1年未満のものとともに、業務の用に供した年分に全額を必要経費に算入）。未満なので比較は「＜」。
  metadata: &rei138
    law: 所得税法施行令第138条第1項
    source_kind: 政令
    unit: 円
    reference:
      - docs/public-sources/20261109_round2_genka-laws-and-nta.md#3.1
  values:
    2025-01-01: {value: 100000, metadata: {適用: 令和7年分・令和8年分の版で同文（genka §3.1）}}
一括償却資産の取得価額の上限:
  description: 所令139①「二十万円未満」（業務の用に供した年以後3年間、一括償却対象額の3分の1を各年分の必要経費に算入）。未満なので比較は「＜」。
  metadata: &rei139
    law: 所得税法施行令第139条第1項
    source_kind: 政令
    unit: 円
    reference:
      - docs/public-sources/20261109_round2_genka-laws-and-nta.md#3.1
  values:
    2025-01-01: {value: 200000, metadata: {適用: 令和7年分・令和8年分の版で同文（genka §3.1）}}
中小事業者の少額減価償却資産:
  description: >-
    租税特別措置法第28条の2（青色申告書を提出する中小事業者）。取得価額の上限は取得の日で区分する（令和8年法律第12号附則第35条。genka §3.2 の表：
    平成18年4月1日〜令和8年3月31日の取得は30万円未満、令和8年4月1日以後の取得は40万円未満）。キーは適用開始日（年分の1月1日）で、
    区分は値ごとの metadata と inputs の分岐（取得の日）で持つ。年間の合計額の上限は業務の用に供した年分で見る（開業・廃業の年は月割：第1項・第2項）。
