description: >-
  調整控除（地方税法第314条の6・第37条、施行令第48条の7の2）。人的控除差の表（第1号イ）と率。asof 2026-01-01〜2028-01-01 で文言が同じ
  （docs/public-sources/20261109_round2_juminzei-tax-law-text.md §5）。表の「5万円」は定額で、所得税の基礎控除に連動しない。
合計所得金額の上限:
  description: 前年の合計所得金額 2,500万円以下の納税義務者に限る
  metadata: &chosei
    law: 地方税法第314条の6・第37条
    source_kind: 法律
    unit: 円
    reference: [docs/public-sources/20261109_round2_juminzei-tax-law-text.md#5, docs/public-sources/20261109_round2_spouse-laws-and-sources.md#3.3]
  values:
    2025-01-01: {value: 25000000, metadata: &r89 {適用: 令和8年度分・令和9年度分（文言が同じ。日付のキーは所得の年分の1月1日）}}
合計課税所得金額の基準:
  description: 合計課税所得金額が200万円以下か超えるかで式が分かれる
  metadata: *chosei
  values:
    2025-01-01: {value: 2000000, metadata: *r89}
最低の額:
  description: 200万円超の式で、人的控除差−（合計課税所得金額−200万円）が下回るときの5万円
  metadata: *chosei
  values:
    2025-01-01: {value: 50000, metadata: *r89}
基本の額:
  description: 人的控除差の合計の「五万円に…を加算した金額」の5万円
  metadata: *chosei
  values:
    2025-01-01: {value: 50000, metadata: *r89}
