    名称: 同一の世帯の認定対象者の年間収入を比べる、被保険者の年間収入に対する割合（この割合を掛けた額未満。値は「分子/分母」）（足した：国年の窓口）
    定義: {条文: 昭和52年4月6日 保発第9号・庁保発第9号 記1, 根拠の種類: 通知・事務連絡, 出典: [docs/public-sources/20261109_R3-tsutatsu_shakaihoken-juminzei.md#1.1, docs/public-sources/20261109_round3_dai3go-notice-search.md#3]}
