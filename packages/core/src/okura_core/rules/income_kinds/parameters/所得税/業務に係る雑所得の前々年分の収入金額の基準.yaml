description: >-
  前々年分の雑所得を生ずべき業務に係る収入金額（prior_income_fixed）で決まる規定の基準額。
  原文：docs/public-sources/20261109_impl-prep_jigyo-laws-and-nta.md §4.1・§4.3。
現金主義の上限:
  description: >-
    所得税法施行令第196条の2「法第六十七条第二項…に規定する政令で定める要件は、その年の前々年分の雑所得を生ずべき業務に係る収入金額が
    三百万円以下であることとする。」の三百万円（業務に係る雑所得の現金主義の要件。現金主義は後の段：D21 R3。選択の要件の検査にだけ使う）。
    判定は前年末現在において確定しているところによる（所基通67−6）。
  metadata:
    law: 所得税法第67条第2項、所得税法施行令第196条の2
    source_kind: 法律
    unit: 円
    比較: 以下
    reference:
      - docs/public-sources/20261109_impl-prep_jigyo-laws-and-nta.md#4.1
  values:
    2025-01-01:
      value: 3000000
      metadata:
        適用: 令和7年分・令和8年分の版で同文（jigyo §4.1「4つの版で同文」）
収支内訳書の添付の基準:
  description: >-
    所得税法第120条第6項（2027-01-01 以後は第8項）：その年において業務に係る雑所得を有する居住者で、前々年分の業務に係る雑所得の収入金額が
    千万円を超えるものは、総収入金額及び必要経費の内容を記載した書類を確定申告書に添付しなければならない。判定は確定申告書を提出する時までに
    確定しているところによる（所基通120−4の2）。
  metadata:
    law: 所得税法第120条第6項、所得税法施行規則第47条の3
    source_kind: 法律
    unit: 円
    比較: 超
    reference:
      - docs/public-sources/20261109_impl-prep_jigyo-laws-and-nta.md#4.3
  values:
    2025-01-01:
      value: 10000000
      metadata:
        適用: 令和7年分（asof 2025-12-31）・令和8年分（asof 2026-12-31）の版は第6項（jigyo §4.3。2027-01-01 から第8項、中身は同じ）
