  # --- 申告書の欄の途中の値（2026-11-12 の3回目。filing.py。様式の対応表 forms が第一表 ㋔ の区分 G13・⑥ に写す） ---
  - id: 所得税.所得金額調整控除の区分
    名称: 第一表 ㋔（収入金額等の給与）の区分に書く値（所得金額調整控除の第1項なら「1」、第2項なら「2」、両方なら「3」、なければ「なし」）
    定義: {条文: 確定申告の手引き 3-2_06（Step3 の (1)・(2)。(1) は租税特別措置法第41条の3の11第1項、(2) は同第2項）, 根拠の種類: 手引き・様式の注記, 出典: [docs/public-sources/20261112_impl-research9_tokutei-jumin-sources.md#4.1, docs/public-sources/20261112_impl-research9_tokutei-jumin-sources.md#4.2, docs/public-sources/20261109_round2_gaps-sources.md#3.1]}
    値の型: 区分
    依存する概念: [所得税.給与所得控除後の給与等の金額, 所得税.公的年金等に係る雑所得の金額, 所得税.給与等の収入金額, 所得税.特別障害者に当たるか, 所得税.所得金額調整控除の対象の親族等を有するか]
    集約点を通らない依存:
      - 概念: 所得税.給与所得控除後の給与等の金額
        説明: 第2項の「給与所得控除後の給与等の金額」（所得税.所得金額調整控除 と同じ）
        出典: [docs/public-sources/20261109_round2_gaps-sources.md#3.1]
      - 概念: 所得税.公的年金等に係る雑所得の金額
        説明: 第2項の「公的年金等に係る雑所得の金額」
        出典: [docs/public-sources/20261109_round2_gaps-sources.md#3.1]
      - 概念: 所得税.給与等の収入金額
        説明: 第1項の「給与等の収入金額」（850万円超の判定）
        出典: [docs/public-sources/20261109_round2_gaps-sources.md#3.1]
    変数: [所得税_所得金額調整控除の区分]
    パラメータ: [所得税.所得金額調整控除]
    注: >-
      （足した 2026-11-12 の3回目）手引き 3-2_06「〔オ〕欄「区分」の□には、Step3「所得金額調整控除の計算」の（1）に該当する場合は「1」を、（2）に該当する場合は「2」を、
      （1）及び（2）の両方に該当する場合は「3」を記入」。(1) に当たる＝第1項の控除額が正、(2) に当たる＝第2項の控除額が正（給与所得控除後の給与等の金額と公的年金等に係る
      雑所得の金額がともに正で合計が10万円を超えるとき、第2項の式〔それぞれ10万円まで〕の額も正になる）。以前の様式の対応表は G13 を特定支出控除、G16 を所得金額調整控除としていた（原文と逆：仮説 impl-research9 H3）

  - id: 所得税.所得金額調整控除の後の給与所得の金額
    名称: 第一表 ⑥（所得金額等の給与）に書く給与所得の金額（手引き 3-2_06 の計算欄 J：給与所得の金額−所得金額調整控除。負なら0）
    定義: {条文: 確定申告の手引き 3-2_06（Step4 J＝C−(F＋I)）、租税特別措置法第41条の3の11第1項・第2項・第5項, 根拠の種類: 手引き・様式の注記, 出典: [docs/public-sources/20261112_impl-research9_tokutei-jumin-sources.md#4.1, docs/public-sources/20261109_round2_gaps-sources.md#3.1]}
    依存する概念: [所得税.給与所得の金額, 所得税.所得金額調整控除]
    集約点を通らない依存:
      - 概念: 所得税.給与所得の金額
        説明: 手引き 3-2_06 の計算欄 C（給与所得の金額）から所得金額調整控除（F＋I）を引く
        出典: [docs/public-sources/20261112_impl-research9_tokutei-jumin-sources.md#4.1]
    変数: [所得税_所得金額調整控除の後の給与所得の金額]
    注: >-
      （足した 2026-11-12 の3回目）以前の様式の対応表は、所得金額調整控除があるときの ⑥ を「未確定（計算欄 J が所得金額調整控除の後の額かを原文で確かめていない）」にしていた。
      手引きの J＝C−(F＋I)（impl-research9 の写し）で決まった。負になる場合（特定支出控除・所法64① で給与所得が控除額より小さい）の書き方の定めは見つからないので、
      損益通算と同じく0（calc.offset_losses）

