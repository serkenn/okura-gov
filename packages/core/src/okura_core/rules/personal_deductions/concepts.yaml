# 概念辞書：規則モジュール personal_deductions（人的控除と扶養の割当て）が担当する概念。
# 項目の書き方は concepts/__init__.py の docstring。出典は docs のファイル#節（公開資料の情報・実測）だけ。
# 変数名・単位（値の型）・期間・層は約束（2026-11-11 の39件）。変えない。足した概念は「（足した）」と注に書く。
#
# この版（2026-11-11）の実装の範囲：
#   - 扶養所属・法律婚のグループと、申告者・配偶者との関係（親族か・生計・同居・直系尊属・専従者・書類・送金・子・配偶者の生計など）は、
#     段階評価の段（allocation.py：所得金額調整控除の対象の親族等・扶養の割当て・扶養の連鎖の合計）が書く（所令218〜220）。
#     段が書く入力は事実の層に置き、概念に 段階 を書く（SCOPE §6-3）。
#   - 人の区分のうち、その人だけで決まるもの（年齢・居住者・障害者・学生・婚姻）は、事実の層の入力（build_inputs）と式で実装した。
制度: 所得税
担当: personal_deductions
既定: {エンティティ: 人物, 期間: 年, 判定の時点: 年分, 値の型: 真偽, 実装済み: false, 層: 人の区分}
概念:
  # =====================================================================
  # グループ（変数を持たない。段階評価の段 扶養の割当て が組み立てる：allocation.py）
  # =====================================================================
  - id: 所得税.扶養の割当て
    名称: 扶養親族・特定親族を、どの居住者の扶養親族等とするか（扶養所属のグループ）
    定義: {条文: 所得税法第85条第6項、所得税法施行令第218条〜第220条（申告書等に記載されたところによる）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_misc-age-kinship-attribution.md#3.2, docs/public-sources/20261109_R4-modeling_concepts.md#4.7]}
    エンティティ: 扶養所属
    値の型: 区分
    段階: 扶養の割当て
    変数: []
    注: >-
      扶養所属のグループ（申告者〔最初の役割・max 1〕／扶養親族等）。段 扶養の割当て が、提出した申告書等の記載（filed_document の entries）と
      選択.扶養の所属 から所令218〜219 の順で組み立てる（記載がなければ所得の合計額が最も大きい人、同額なら 選択.扶養の所属 の未入力として候補で評価）。
      連鎖の人（扶養親族等で、自分も申告者）は自分のインスタンスの申告者に置く（連鎖の扶養親族等か）。配偶者はこのグループに入れない（R4 H1.2）

  - id: 所得税.法律婚
    名称: 法律上の婚姻（法律婚のグループ）
    定義: {条文: 民法第739条第1項（届出）、所得税基本通達2−46（所得税の配偶者は法律上の配偶者）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R4-modeling_concepts.md#3.1, docs/public-sources/20261109_round2_spouse-laws-and-sources.md#2.1]}
    エンティティ: 法律婚
    値の型: 区分
    段階: 扶養の割当て
    変数: []
    注: >-
      段 扶養の割当て が、判定の時（12月31日・死亡の時。配偶者が既に死亡していればその死亡の時）に続いている婚姻から組み立てる。
      年の中途の死亡と再婚は所令220① の一人（申告書等の記載か 選択.配偶者の記載。なければ候補で評価）。配偶者控除などの式は、このグループの中の「自分でない配偶者」の値を引く

  # =====================================================================
  # 事実（入力変数。build_inputs が中間表現から書く。2026-11-11 に足した）
  # =====================================================================
  - id: 所得税.生年月日
    名称: 生年月日
    定義: {条文: 所得税法第85条（年齢の判定の材料）、年齢計算ニ関スル法律, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_misc-age-kinship-attribution.md#1.3]}
    層: 事実
    値の型: 日付
    変数: [所得税_生年月日]
    実装済み: true
    注: （足した）中間表現の persons[].birth_on

  - id: 所得税.死亡日
    名称: 死亡日（死亡していなければ 9999-12-31）
    定義: {条文: 所得税法第85条第1項・第3項（死亡の時の現況）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_misc-age-kinship-attribution.md#1.1, docs/public-sources/20261109_round3_shibo-shukkoku-laws-and-nta.md#4.1]}
    層: 事実
    値の型: 日付
    変数: [所得税_死亡日]
    実装済み: true
    注: >-
      （足した）中間表現の persons[].death_on。ない人は 9999-12-31（式は年分の12月31日との早い方を判定の時にする）。
      死亡日の翌日が誕生日に応当する日のときは、死亡の時に年齢が加わるかの一次情報がないので対象外にする（inputs.py）

  - id: 所得税.判定の時に住所が国内にあるか
    名称: 判定の時（その年12月31日・死亡の時）に国内に住所を有するか
    定義: {条文: 所得税法第2条第1項第3号（居住者）、所得税法施行令第14条・第15条（推定）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_elderly-abroad-laws.md#4, docs/public-sources/20261109_round2_elderly-abroad-guidance.md#4]}
    層: 事実
    変数: [所得税_判定の時に住所が国内にあるか]
    実装済み: true
    注: >-
      （足した）国外の滞在（abroad_stay）がなければ真。国外の滞在があれば判断.住所の所在（D4。未入力なら国内・国外の両方で評価）。
      この年分に非居住者の期間がある（ありうる）人は、その人の値を全部対象外にする（inputs.py。国外転出時課税の確かめを含む：D22 S11）

  - id: 所得税.留学により国内に住所及び居所を有しなくなった者か
    名称: 留学により国内に住所及び居所を有しなくなった者か（非居住者である扶養親族の区分）
    定義: {条文: 所得税法第2条第1項第34号の2ロ(1), 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_elderly-abroad-laws.md#3.1, docs/public-sources/20261109_round2_elderly-abroad-guidance.md#3.3]}
    層: 事実
    変数: [所得税_留学により国内に住所及び居所を有しなくなった者か]
    実装済み: true
    注: （足した）判定の時に目的が留学（purpose study）の国外の滞在があり、住所が国外のとき真

  - id: 所得税.身体障害者手帳の障害の程度の級
    名称: 判定の時に交付を受けている身体障害者手帳に記載された障害の程度の級（手帳がなければ0、級の記載がなければ99）
    定義: {条文: 所得税法施行令第10条第1項第3号・第2項第3号, 根拠の種類: 政令, 出典: [docs/public-sources/20261109_round2_jinteki-laws-and-guidance.md#1.5]}
    判定の時点: {問い: 年分, 説明: その年12月31日（死亡の時）の現況（所得税法第85条）, 出典: [docs/public-sources/20261109_round2_jinteki-laws-and-guidance.md#1.3]}
    層: 事実
    値の型: 整数
    変数: [所得税_身体障害者手帳の障害の程度の級]
    実装済み: true
    注: （足した）disability_basis の physical_disability_certificate。複数あれば最も重い級（小さい数）。級の記載がなければ特別障害者に当たるかを対象外にする（checks.py）

  - id: 所得税.精神障害者保健福祉手帳の障害等級
    名称: 判定の時に交付を受けている精神障害者保健福祉手帳の障害等級（手帳がなければ0、等級の記載がなければ99）
    定義: {条文: 所得税法施行令第10条第1項第2号・第2項第2号, 根拠の種類: 政令, 出典: [docs/public-sources/20261109_round2_jinteki-laws-and-guidance.md#1.5]}
    判定の時点: {問い: 年分, 説明: その年12月31日（死亡の時）の現況（所得税法第85条）, 出典: [docs/public-sources/20261109_round2_jinteki-laws-and-guidance.md#1.3]}
    層: 事実
    値の型: 整数
    変数: [所得税_精神障害者保健福祉手帳の障害等級]
    実装済み: true
    注: （足した）disability_basis の mental_disability_certificate

  - id: 所得税.知的障害者と判定されているか
    名称: 児童相談所・知的障害者更生相談所などの判定により知的障害者とされているか
    定義: {条文: 所得税法施行令第10条第1項第1号, 根拠の種類: 政令, 出典: [docs/public-sources/20261109_round2_jinteki-laws-and-guidance.md#1.5]}
    層: 事実
    変数: [所得税_知的障害者と判定されているか]
    実装済み: true
    注: （足した）disability_basis の intellectual_disability_assessment

  - id: 所得税.重度の知的障害者と判定されているか
    名称: 重度の知的障害者とされているか（判断.障害の程度 severe_intellectual_disability）
    定義: {条文: 所得税法施行令第10条第2項第1号, 根拠の種類: 政令, 出典: [docs/public-sources/20261109_round2_jinteki-laws-and-guidance.md#1.5]}
    層: 事実
    変数: [所得税_重度の知的障害者と判定されているか]
    実装済み: true
    注: （足した）知的障害の判定の記録があり判断が未入力なら真偽の両方で評価（D21 R6）

  - id: 所得税.事理を弁識する能力を欠く常況にあるか
    名称: 精神上の障害により事理を弁識する能力を欠く常況にあるか（判断.障害の程度 lacks_capacity）
    定義: {条文: 所得税法施行令第10条第1項第1号・第2項第1号, 根拠の種類: 政令, 出典: [docs/public-sources/20261109_round2_jinteki-laws-and-guidance.md#1.5]}
    層: 事実
    変数: [所得税_事理を弁識する能力を欠く常況にあるか]
    実装済み: true
    注: （足した）判断がなければ偽（材料の事実の種類が中間表現にない。判断台帳に書く）

  - id: 所得税.戦傷病者手帳の交付を受けているか
    名称: 戦傷病者手帳の交付を受けているか
    定義: {条文: 所得税法施行令第10条第1項第4号, 根拠の種類: 政令, 出典: [docs/public-sources/20261109_round2_jinteki-laws-and-guidance.md#1.5]}
    層: 事実
    変数: [所得税_戦傷病者手帳の交付を受けているか]
    実装済み: true
    注: （足した）程度（同条第2項第4号）は 所得税.戦傷病者手帳に特別項症から第三項症までと記載されているか

  - id: 所得税.原子爆弾被爆者の認定を受けているか
    名称: 原子爆弾被爆者に対する援護に関する法律第11条第1項の厚生労働大臣の認定を受けているか
    定義: {条文: 所得税法施行令第10条第1項第5号・第2項第5号, 根拠の種類: 政令, 出典: [docs/public-sources/20261109_round2_jinteki-laws-and-guidance.md#1.5]}
    層: 事実
    変数: [所得税_原子爆弾被爆者の認定を受けているか]
    実装済み: true
    注: （足した）

  - id: 所得税.常に就床を要し複雑な介護を要するか
    名称: 常に就床を要し、複雑な介護を要するか（判断.障害の程度 bedridden_requiring_complex_care）
    定義: {条文: 所得税法施行令第10条第1項第6号・第2項第5号、所得税基本通達2−39, 根拠の種類: 政令, 出典: [docs/public-sources/20261109_round2_jinteki-laws-and-guidance.md#1.5, docs/public-sources/20261109_round2_jinteki-laws-and-guidance.md#1.7]}
    層: 事実
    変数: [所得税_常に就床を要し複雑な介護を要するか]
    実装済み: true
    注: （足した）判断がなければ偽（要介護認定は使わない：TA1185）

  - id: 所得税.市町村長等の障害者の認定を受けているか
    名称: 市町村長等の認定（精神又は身体に障害のある年齢65歳以上の者）を受けているか
    定義: {条文: 所得税法施行令第10条第1項第7号, 根拠の種類: 政令, 出典: [docs/public-sources/20261109_round2_jinteki-laws-and-guidance.md#1.5]}
    層: 事実
    変数: [所得税_市町村長等の障害者の認定を受けているか]
    実装済み: true
    注: （足した）特別障害者の程度の認定（同条第2項第6号）を中間表現で区別できないので、ある人の特別障害者に当たるかは対象外（checks.py）

  - id: 所得税.手帳の申請中で障害が明らかか
    名称: 手帳の交付を申請中で、判定の時に明らかに手帳に記載される程度の障害があるか（判断.障害の程度 evidently_disabled_pending_application）
    定義: {条文: 所得税基本通達2−38, 根拠の種類: 通達, 出典: [docs/public-sources/20261109_round2_jinteki-laws-and-guidance.md#1.7]}
    層: 事実
    変数: [所得税_手帳の申請中で障害が明らかか]
    実装済み: true
    注: （足した）申請の記録（disability_basis の application）があり判断が未入力なら真偽の両方で評価。程度（特別障害者か）は 所得税.申請中の障害の程度が特別障害者の程度か

  - id: 所得税.戦傷病者手帳に特別項症から第三項症までと記載されているか
    名称: 戦傷病者手帳に恩給法別表第一号表ノ二の特別項症から第三項症までである者として記載されているか
    定義: {条文: 所得税法施行令第10条第2項第4号, 根拠の種類: 政令, 出典: [docs/public-sources/20261109_round2_jinteki-laws-and-guidance.md#1.5]}
    層: 事実
    変数: [所得税_戦傷病者手帳に特別項症から第三項症までと記載されているか]
    実装済み: true
    注: （足した。2026-11-11）disability_basis（war_injury_certificate）の war_injury_class が special_item・item_1〜item_3。記載がなければ checks.py が特別障害者に当たるかを対象外（war_injury_class を入力すれば決まる）

  - id: 所得税.市町村長等の特別障害者に準ずる認定を受けているか
    名称: 障害の程度が所令10②一・三の者に準ずるものとして市町村長等の認定を受けているか
    定義: {条文: 所得税法施行令第10条第2項第6号, 根拠の種類: 政令, 出典: [docs/public-sources/20261109_round2_jinteki-laws-and-guidance.md#1.5]}
    層: 事実
    変数: [所得税_市町村長等の特別障害者に準ずる認定を受けているか]
    実装済み: true
    注: （足した。2026-11-11）municipal_certification の certified_severity が severe。年齢の下限（第1項第7号）は式で見る。記載がなければ checks.py が対象外（入力すれば決まる）

  - id: 所得税.申請中の障害の程度が特別障害者の程度か
    名称: 手帳の申請中の障害の程度が、明らかに特別障害者（所令10②三・四）の程度か
    定義: {条文: 所得税基本通達2−38, 根拠の種類: 通達, 出典: [docs/public-sources/20261109_round2_jinteki-laws-and-guidance.md#1.7]}
    層: 事実
    変数: [所得税_申請中の障害の程度が特別障害者の程度か]
    実装済み: true
    注: >-
      （足した。2026-11-11）application の grade（身体障害者手帳の級と読む：2−38 は身体障害者手帳・戦傷病者手帳の通達）が1級・2級、又は war_injury_class が
      特別項症〜第三項症。申請中で障害が明らかと判断された人について、記載がなければ checks.py が対象外（入力すれば決まる）

  - id: 所得税.学校教育法第1条の学校の学生等か
    名称: 判定の時に学校教育法第1条に規定する学校の学生・生徒・児童か
    定義: {条文: 所得税法第2条第1項第32号イ, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#6.1]}
    判定の時点: {問い: 年分, 説明: その年12月31日（死亡の時）の現況（所得税法第85条第1項）, 出典: [docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#6.1]}
    層: 事実
    変数: [所得税_学校教育法第1条の学校の学生等か]
    実装済み: true
    注: >-
      （足した）enrollment の school_type が school_act_article1。専修学校・各種学校・認定職業訓練（同号ロ・ハ）は
      政令の課程の要件（所令11の3②）の材料が中間表現にないので、学生に当たるかを対象外にする（checks.py）

  - id: 所得税.政令で定める課程を履修する専修学校等の学生等か
    名称: 所法2①三十二ロの設置者の専修学校・各種学校の学生又は生徒、又はハの認定職業訓練を受ける者で、政令で定める課程を履修するものか
    定義: {条文: 所得税法第2条第1項第32号ロ・ハ、所得税法施行令第11条の3、所得税法施行規則第47条の2第11項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#6.1, docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#6.2, docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#6.3]}
    判定の時点: {問い: 年分, 説明: その年12月31日（死亡の時）の現況（所得税法第85条第1項）, 出典: [docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#6.1]}
    層: 事実
    変数: [所得税_政令で定める課程を履修する専修学校等の学生等か]
    実装済み: true
    注: >-
      （足した。2026-11-11）enrollment の establisher_type（国・地方公共団体・学校法人等）又は establisher_certificate（所令11の3①二の基準）と、
      course_certificate（課程が所令11の3②に当たる旨の大臣の証明）で判定する（課程の要件は証明書の有無で受ける：zeigaku-calc-model H3）

  - id: 所得税.判定の時に婚姻をしているか
    名称: 判定の時（その年12月31日・死亡の時）に婚姻の届出による配偶者がいるか
    定義: {条文: 民法第739条第1項、所得税基本通達2−46, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R4-modeling_concepts.md#3.1, docs/public-sources/20261109_round2_spouse-laws-and-sources.md#2.1]}
    層: 事実
    変数: [所得税_判定の時に婚姻をしているか]
    実装済み: true
    注: >-
      （足した）中間表現の marriage（区間・終了の理由）と相手の死亡日から。年分と重なる婚姻が2つ以上ある人（年の中途の死別・離婚と
      再婚：所法85⑦・所令220、R4 U7）は対象外（inputs.py）

  - id: 所得税.翌年1月1日の障害者・婚姻の現況
    名称: 翌年の1月1日（住民税の賦課期日）の障害者・婚姻の現況（住民税への窓口）
    定義: {条文: 所得税法施行令第10条第1項、所得税法第2条第1項第30号・第31号、地方税法第295条第1項第2号, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_jinteki-laws-and-guidance.md#1.5, docs/public-sources/20261109_round2_jinteki-laws-and-guidance.md#1.1, docs/public-sources/20261109_impl-prep_juminzei-hikazei-fuyo-shinkoku.md#3.1]}
    判定の時点: {問い: 年分, 説明: 翌年の1月1日の現況（住民税の非課税の判定の時点を賦課期日とする市町村のため）, 出典: [docs/public-sources/20261109_impl-prep_juminzei-hikazei-fuyo-shinkoku.md#3.1]}
    層: 事実
    変数: [所得税_翌年1月1日に障害者に当たるか, 所得税_翌年1月1日に婚姻の状況が判定の時と違うか, 所得税_翌年1月1日に婚姻又は事実婚をしているか]
    実装済み: true
    注: >-
      （足した。2026-11-12。juminzei JM-03）判定の時の材料と同じ記録（disability_basis・判断.障害の程度・marriage・legal_sex・住民票）を翌年の1月1日に取り出す（jan1.py）。
      障害者の区分は classify.所得税_障害者に当たるか と同じ材料の論理和

  - id: 所得税.配偶者の生死が明らかでない者か
    名称: 配偶者の生死の明らかでない者で政令で定めるもの（所得税法施行令第11条・第11条の2第1項）か
    定義: {条文: 所得税法第2条第1項第30号ロ・第31号、所得税法施行令第11条・第11条の2第1項, 根拠の種類: 政令, 出典: [docs/public-sources/20261109_round2_jinteki-laws-and-guidance.md#1.6]}
    層: 事実
    変数: [所得税_配偶者の生死が明らかでない者か]
    実装済み: true
    注: >-
      （足した）判定の時に続いている婚姻の spouse_missing（since_on・circumstance・peril_ended_on）を所令11 の各号で判定する（2026-11-11）。
      期間は事故・危難の日の翌日から起算し応当する日の終了で満了（民法140・143）。事由・危難が去った日がなく決まらなければ入力を求める理由つきで対象外（inputs.py）

  - id: 所得税.住民票に事実婚の続柄の記載がある相手がいるか
    名称: 住民票の世帯主との続柄に、世帯主の未届の夫・未届の妻その他事実上婚姻関係と同様の事情にあると認められる続柄の記載がある相手がいるか
    定義: {条文: 所得税法第2条第1項第30号イ(3)・第31号ハ、所得税法施行規則第1条の3・第1条の4, 根拠の種類: 省令, 出典: [docs/public-sources/20261109_round2_jinteki-laws-and-guidance.md#1.6]}
    層: 事実
    変数: [所得税_住民票に事実婚の続柄の記載がある相手がいるか]
    実装済み: true
    注: >-
      （足した）resident_record の relation_to_householder の unregistered_spouse（世帯主でなければ自分の続柄、世帯主なら同じ世帯の人の続柄）。
      判定の時の住民票の記録がなく、寡婦・ひとり親に当たりうる人（婚姻・親子・養子縁組の記録がある人）は対象外（inputs.py）

  - id: 所得税.事業所得等が自己の勤労に基づくか
    名称: 事業所得・雑所得が自己の勤労に基づいて得たものか（判断.自己の勤労に基づく）
    定義: {条文: 所得税法第2条第1項第32号（自己の勤労に基づいて得た事業所得、給与所得、退職所得又は雑所得）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_gaps-sources.md#1.1, docs/public-sources/20261109_round2_gaps-sources.md#1.5]}
