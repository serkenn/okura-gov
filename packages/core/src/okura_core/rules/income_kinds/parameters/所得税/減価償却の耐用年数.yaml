description: >-
  耐用年数の表のうち、個人の事業でよくある資産の行（減価償却資産の耐用年数等に関する省令 別表第一・第三）。令和7年分・令和8年分の版で同じ。
  原文：docs/public-sources/20261109_round2_genka-laws-and-nta.md §2.2。行の ID は 判断.減価償却の区分 の useful_life_table_row。
  表にない資産は useful_life_years（耐用年数）で判断を書く。無形（ソフトウエア）は所令134 の残存なし（inputs で判定：名前が ソフトウエア で始まる）。
