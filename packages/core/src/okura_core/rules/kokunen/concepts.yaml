    変数: [年金_育児期間の免除の月数]
    出力: {申告の欄: false, 申告の範囲: false}
    注: （足した）第1項は産前産後の期間の後の月から出産予定日から12月を経過した日の属する月の前月まで、第2項は子を養育することとなった日の属する月から1歳に達する日の翌日の属する月の前月まで。2026-11-12：令和6年法律第47号附則第10条（令和8年10月以後の各月の保険料に適用）により、施行前の出産・養育の開始でも2026年10月以後の月に当てる（断定）

  - id: 国年.連鎖の扶養親族等の数
    名称: 扶養の連鎖の人（他の人の扶養親族等で、自分も申告者である人）のうち、扶養親族等に数える人の数
    定義: {条文: 国民年金法第36条の3第1項・第90条第1項第1号, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_kokuho-premium-structure.md#12.1, docs/public-sources/20261109_impl-prep_misc-age-kinship-attribution.md#4.1]}
    層: 事実
    段階: 国年の扶養の連鎖の扶養親族等
    値の型: 整数
    変数: [年金_連鎖の扶養親族等の数]
    注: （足した）所得税の段 扶養の割当て の連鎖（所得税_連鎖の扶養親族等か・所得税_扶養親族等の申告者）を読む

  - id: 国年.連鎖の扶養親族等の額
    名称: 扶養の連鎖の人の分の一部免除の加算額と、一部免除判定所得から差し引く障害者の額
    定義: {条文: 国民年金法施行令第6条の8の2・第6条の9・第6条の9の2・第6条の12第2項第2号, 根拠の種類: 政令, 出典: [docs/public-sources/20261109_round2_kokuho-premium-structure.md#12.2, docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#8.1]}
    層: 事実
    段階: 国年の扶養の連鎖の扶養親族等
    値の型: 円
    変数: [年金_連鎖の扶養親族等の加算額, 年金_連鎖の扶養親族等の障害者の額]
    注: （足した）

  # =====================================================================
  # 第3号被保険者（判定日）
  # =====================================================================
  - id: 国年.判定日の年齢
    名称: 判定日の年齢（20歳以上60歳未満か）
    定義: {条文: 国民年金法第7条第1項第3号, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R1-laws_social-insurance-age-records.md#2, docs/public-sources/20261109_round2_spouse-laws-and-sources.md#5.1]}
    判定の時点: 判定日
    層: 事実
    値の型: 整数
    変数: [年金_判定日の年齢]
    出力: {申告の欄: false, 申告の範囲: false}
    注: 出力は年齢の境目の比べる年齢のため（共有の担当。2026-11-12）

  - id: 国年.本人が第2号被保険者か
    名称: 判定日に本人が第2号被保険者か
    定義: {条文: 国民年金法第7条第1項第2号・第3号・附則第3条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_spouse-laws-and-sources.md#5.1]}
    判定の時点: 判定日
    層: 事実
    値の型: 真偽
    変数: [年金_本人が第2号被保険者か]
    注: （足した）employees_pension（又は national_pension の category＝second）。65歳以上で老齢の年金の受給権がある人は第2号でない

  - id: 国年.配偶者が第2号被保険者か
    名称: 判定日に、配偶者（事実上婚姻関係と同様の事情にある者を含む）が第2号被保険者か
    定義: {条文: 国民年金法第5条第7項・第7条第1項第3号・附則第3条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_spouse-laws-and-sources.md#5.1]}
    判定の時点: 判定日
    層: 事実
    値の型: 真偽
    変数: [年金_配偶者が第2号被保険者か]
    注: 婚姻の届出（marriage）と 判断.事実婚。65歳以上で老齢の年金の受給権がある厚生年金保険の被保険者の配偶者は除く（附則第3条）

  - id: 国年.国内居住の要件を満たすか
    名称: 判定日に国内に住所を有するか、又は国内居住の要件の例外（留学・同行など）に当たるか
    定義: {条文: 国民年金法第7条第1項第3号、国民年金法施行規則第1条の3, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_spouse-laws-and-sources.md#5.1]}
    判定の時点: 判定日
    層: 事実
    値の型: 真偽
    変数: [年金_国内居住の要件を満たすか]
    注: 住民票の記録があれば国内に住所。なければ abroad_stay の目的（留学・同行・観光は第1号〜第3号）と、それ以外は 判断.国内居住の例外第5号（第4号の身分関係の例外も判断で入れる）

  - id: 国年.被扶養配偶者の年間収入
    名称: 被扶養配偶者の認定の年間収入（認定された日以降の年間の見込み収入額）
    定義: {条文: 国民年金法施行令第4条（健康保険法等における被扶養者の認定の取扱いを勘案して日本年金機構が認定する）, 根拠の種類: 政令, 出典: [docs/public-sources/20261109_round3_dai3go-notice-search.md#6, docs/public-sources/20261109_round3_dai3go-notice-search.md#3.1]}
    判定の時点: 判定日
    層: 事実
    値の型: 円
    変数: [年金_被扶養配偶者の年間収入]
    注: 見込みは判断（見込み.年間収入。予測の印）。令和8年4月1日以後の判定日は、労働契約の内容による年収（docs/public-sources/20261109_R3-tsutatsu_shakaihoken-juminzei.md §1.3）が基準額未満ならそれを使う。保険者の運用（注入データ）は使わない

  - id: 国年.第2号被保険者の年間収入
    名称: 配偶者である第2号被保険者の年間収入の見込み
    定義: {条文: 国民年金法施行令第4条、昭和52年4月6日 保発第9号・庁保発第9号（同一世帯の2分の1）, 根拠の種類: 通知・事務連絡, 出典: [docs/public-sources/20261109_round3_dai3go-notice-search.md#3, docs/public-sources/20261109_round3_dai3go-notice-search.md#3.1]}
    判定の時点: 判定日
    層: 事実
    値の型: 円
    変数: [年金_第2号被保険者の年間収入]
    注: （足した）見込み.被保険者の年間収入

  - id: 国年.第2号被保険者と同一の世帯に属するか
    名称: 判定日に配偶者である第2号被保険者と同一の世帯に属するか（生計を共にし、かつ同居）
    定義: {条文: 国民年金法施行令第4条、昭和61年4月1日 庁保険発第18号, 根拠の種類: 通知・事務連絡, 出典: [docs/public-sources/20261109_round3_dai3go-notice-search.md#1.1, docs/public-sources/20261109_round3_dai3go-notice-search.md#3]}
    判定の時点: 判定日
    層: 事実
    値の型: 真偽
    変数: [年金_第2号被保険者と同一の世帯に属するか]
    注: （足した）cohabitation の記録か、同じ dwelling_stay の住居

  - id: 国年.第2号被保険者からの援助による収入額
    名称: 別世帯の場合の、第2号被保険者からの援助による収入額の見込み
    定義: {条文: 国民年金法施行令第4条、昭和52年4月6日 保発第9号・庁保発第9号（別世帯は援助額より少ない）, 根拠の種類: 通知・事務連絡, 出典: [docs/public-sources/20261109_round3_dai3go-notice-search.md#3, docs/public-sources/20261109_round3_dai3go-notice-search.md#3.1]}
    判定の時点: 判定日
    層: 事実
    値の型: 円
    変数: [年金_第2号被保険者からの援助による収入額]
    注: （足した）見込み.援助額

  - id: 国年.第3号被保険者に当たるか
    名称: 判定日に第3号被保険者に当たるか（主として第2号被保険者の収入により生計を維持する配偶者）
    定義: {条文: 国民年金法第7条第1項第3号・第2項、同施行令第4条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_spouse-laws-and-sources.md#5.1, docs/public-sources/20261109_round3_dai3go-notice-search.md#6, docs/public-sources/20261109_R1-laws_social-insurance-age-records.md#2]}
    判定の時点: 判定日
    層: 人的控除・扶養の判定
    値の型: 真偽
    変数: [年金_第3号被保険者に当たるか]
    依存する概念:
      - 国年.判定日の年齢
      - 国年.本人が第2号被保険者か
      - 国年.配偶者が第2号被保険者か
      - 国年.国内居住の要件を満たすか
      - 国年.被扶養配偶者の年間収入
      - 国年.第2号被保険者の年間収入
      - 国年.第2号被保険者と同一の世帯に属するか
      - 国年.第2号被保険者からの援助による収入額
    制度をまたぐ依存:
      - 概念: 健保.配偶者の収入の基準額
        説明: 収入の基準（130万円未満・概ね障害厚生年金の受給要件に該当する程度の障害者は180万円未満）は健保の被扶養者（配偶者）の認定の基準と同じ値（国年令第4条の勘案。第3号について原文未確認：HANDOFF D22 S7）
        出典: [docs/public-sources/20261109_round3_dai3go-notice-search.md#3.1, docs/public-sources/20261109_round3_dai3go-notice-search.md#6]
      - 概念: 健保.同一の世帯の収入の割合
        説明: 同一世帯は第2号被保険者の年間収入の2分の1未満（健保の昭和52年通知 記1 と同じ割合）
        出典: [docs/public-sources/20261109_round3_dai3go-notice-search.md#3, docs/public-sources/20261109_round3_dai3go-notice-search.md#6]
    出力: {申告の欄: false, 申告の範囲: false}
    年齢の境目:
      - {id: 国年.第3号被保険者の年齢の下限, 比べる年齢: 国年.判定日の年齢, 基準の年齢: 20, 比較: 以上, 判定の日: 判定日}
      - {id: 国年.第3号被保険者の年齢の上限, 比べる年齢: 国年.判定日の年齢, 基準の年齢: 60, 比較: 未満, 判定の日: 判定日}
    注: >-
      2026-11-12（共有の担当）：年齢の境目（20歳以上60歳未満。式の年齢の数と同じ。根拠はこの概念の定義：
      docs/public-sources/20261109_R1-laws_social-insurance-age-records.md §2）を足した。
      2026-11-11：収入の基準の値（130万円・180万円・2分の1）は kokunen で持たず、hifuyosha の約束の概念（健保.配偶者の収入の基準額・健保.同一の世帯の収入の割合）を
      制度をまたいで引く（structure.yaml で国年は健保に依存してよい）。障害者かは健保の事実（障害の年金の受給権か 判断.障害の程度）による。
      別世帯は援助額より少ない。第3号についての原文未確認の印は根拠（rules）に付ける（HANDOFF D22 S7）。2分の1以上で第2号の年間収入を上回らないときは機構の総合的な勘案（判断）で未確定
