description: >-
  森林環境税（森林環境税及び森林環境譲与税に関する法律・同施行令。国税で、住所地の市町村が個人住民税の均等割と併せて賦課徴収する）。
  非課税の金額は政令の式で級地から直接決まる（市町村の条例の額によらない：docs/public-sources/20261109_round2_juminzei-tax-law-text.md §14）。
  令和6年度以後の年度分に適用（附則第2条）。
