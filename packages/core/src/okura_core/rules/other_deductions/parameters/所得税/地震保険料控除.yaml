description: >-
  地震保険料控除（所得税法第77条第1項）と旧長期損害保険料の経過措置（平成18年法律第10号附則第10条第2項）。
  所法R6〜R9・附則第10条は同文（docs/public-sources/20261109_round2_hoken-kifu-laws.md §1・§3）。
地震保険料の上限:
  description: 地震保険料の合計額の上限（第77条第1項「当該合計額が五万円を超える場合には、五万円」）
  metadata:
    law: 所得税法第77条第1項
    source_kind: 法律
    reference:
      - docs/public-sources/20261109_round2_hoken-kifu-laws.md#3
      - docs/public-sources/20261109_round2_hoken-kifu-laws.md#1
  values:
    2025-01-01:
      value: 50000
      metadata: &r7r8
        適用: 所法R6〜R9 の4つの版で本文が同じ（docs/measurements/20261109_round2_hoken-kifu-fetch.md §2）。この規定を設けた改正法と当初の施行日は docs で確かめていない
旧長期損害保険料:
  # 附則第10条第2項第2号の3つの場合（条文の順。イ・ロ・ハは計算の段の名前）
  イ:
    以下:
      description: 旧長期損害保険料の合計額がこの額以下なら、その合計額（「一万円以下」）
      metadata: &fusoku10
        law: 平成18年法律第10号附則第10条第2項第2号（旧長期損害保険料：一万円以下はその額、一万円を超え二万円以下は一万円と超える部分の二分の一、二万円を超えるときは一万五千円）
        source_kind: 法律
        reference:
          - docs/public-sources/20261109_round2_hoken-kifu-laws.md#3
          - docs/measurements/20261109_round2_hoken-kifu-formula-checks.md#3
      values:
        2025-01-01: {value: 10000, metadata: *r7r8}
  ロ:
    以下:
      description: 第2の段の上限（「二万円以下」）
      metadata: *fusoku10
      values:
        2025-01-01: {value: 20000, metadata: *r7r8}
    加算額:
      description: 第2の段の加える額（「一万円と」）
      metadata: *fusoku10
      values:
        2025-01-01: {value: 10000, metadata: *r7r8}
    控除する金額:
      description: 第2の段で合計額から控除する額（「一万円を控除した金額」）
      metadata: *fusoku10
      values:
        2025-01-01: {value: 10000, metadata: *r7r8}
    率:
      分子:
        description: 第2の段の率の分子（「二分の一」）
        metadata: *fusoku10
        values:
          2025-01-01: {value: 1, metadata: *r7r8}
      分母:
        description: 第2の段の率の分母（「二分の一」）
        metadata: *fusoku10
        values:
          2025-01-01: {value: 2, metadata: *r7r8}
  ハ:
    額:
      description: 二万円を超えるときの額（「一万五千円」）
      metadata: *fusoku10
      values:
        2025-01-01: {value: 15000, metadata: *r7r8}
合計の上限:
  description: 地震保険料と旧長期損害保険料の両方があるときの合計の上限（附則第10条第2項第3号「五万円」）
  metadata:
    law: 平成18年法律第10号附則第10条第2項第3号
    source_kind: 法律
    reference:
      - docs/public-sources/20261109_round2_hoken-kifu-laws.md#3
  values:
    2025-01-01: {value: 50000, metadata: *r7r8}
