  metadata: &sochi41_17
    law: 租税特別措置法第41条の17第1項（所得税法第73条第1項中「…の合計額の百分の五に相当する金額（当該金額が十万円を超える場合には、十万円）」とあるのは「一万二千円」と、「二百万円」とあるのは「八万八千円」と読み替える）
    source_kind: 法律
