    注: >-
      （足した 2026-11-12 の3回目。juminzei JM-42）income_totals の 所得税.特定支出控除を当てた場合の回収不能額等の前の総所得金額と退職所得金額の合計額 の材料。
      所得税.回収不能額等の前の公的年金等に係る雑所得の金額 と同じ関数・パラメータ・端数で、区分の基になる額だけを変える

  - id: 所得税.特定支出控除を当てた場合の公的年金等に係る雑所得の金額
    名称: 公的年金等控除額の区分を、特定支出控除を当てた場合の公的年金等に係る雑所得以外の合計所得金額で求めた公的年金等に係る雑所得の金額
