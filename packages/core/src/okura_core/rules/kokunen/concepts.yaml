# 概念辞書：規則モジュール kokunen（国民年金：保険料の額、免除・納付猶予・学生納付特例の所得基準、第3号被保険者の判定。SCOPE §5.4・§5.5）
# が担当する概念。項目の書き方は concepts/__init__.py の docstring。出典は docs のファイル#節（公開資料の情報・実測）だけ。OpenFisca の変数の接頭辞は 年金_。
#
# 時点（timepoints.py）：年度 F の値は、所得の年分 F−1 の situation で計算し、「所得の年分 F−1 で判定する期間」の値とする
#   （免除・納付猶予は F年7月〜F+1年6月、学生納付特例は F年4月〜F+1年3月。国年法第90条第1項第1号のかっこ書き・国年規第77条の2）。
#   F年1月〜6月（学生納付特例は1月〜3月）の月分は、年度 F−1 の値（所得の年分 F−2）になる。年をまたぐ依存にはしない（政令の値のパラメータも、日付のキーを所得の年分の1月1日にして同じ期間で引く）。
#   第3号被保険者は判定日の値（判定日の属する暦年の situation）。
# 2026-11-11：concepts/kokunen.yaml の 国年.免除判定所得・国年.一部免除判定所得 をここへ移した。
# 2026-11-11（実装）：一部免除判定所得の層を「課税所得」、一部免除の区分・学生納付特例の層を「税額」にした（所得税の個々の所得控除の額を引くため。
#   中心の概念の層からは上の層を引けない）。被扶養配偶者の年間収入の層を「事実」にした（判断台帳の値を入れる入力変数）。概念を足した（注に「足した」）。README §2。
制度: 国年
担当: kokunen
既定: {エンティティ: 人物, 期間: 年, 判定の時点: 年度, 実装済み: true}
概念:
  # =====================================================================
  # 免除・納付猶予・学生納付特例（年度）
  # =====================================================================
  - id: 国年.免除判定所得
    名称: 全額免除・納付猶予の判定に使う所得
    定義:
      条文: 国民年金法施行令第6条の11（地方税法第313条第8項・第9項の控除前の総所得金額・退職所得金額・山林所得金額など）
      根拠の種類: 政令
      出典:
        - docs/public-sources/20261109_round2_kokuho-premium-structure.md#12.3
    判定の時点:
      問い: 年度
      説明: 年度 F の値は所得の年分 F−1 の所得（F年7月〜F+1年6月の月分。それより前の月分は年度 F−1 の値）
      出典:
        - docs/public-sources/20261109_round2_kokuho-premium-structure.md#12.3
    層: 中心の概念
    値の型: 円
    制度をまたぐ依存:
      - 概念: 住民税.合計所得金額
        説明: >-
          その所得が生じた年の翌年の4月1日の属する年度分の市町村民税に係る、地方税法第313条第8項・第9項の控除（繰越控除）の前の
          総所得金額・退職所得金額・山林所得金額。住民税の合計所得金額（第292条第1項第13号。同じく控除の前）に依存させる
        出典:
          - docs/public-sources/20261109_round2_kokuho-premium-structure.md#12.3
          - docs/public-sources/20261109_round2_juminzei-tax-law-text.md#2
      - 概念: 所得税.上場株式等に係る配当所得等の金額
        説明: 国年令第6条の11 の列挙に上場株式等に係る配当所得等（地方税法附則第33条の2第5項）はないので、合計所得金額に入る額（損益通算の後・繰越控除の前）を除く
        出典: [docs/public-sources/20261111_impl-research3_kokunen-laws.md#1]
      - 概念: 所得税.上場株式等に係る譲渡所得等の金額
        説明: 同じく上場株式等に係る譲渡所得等（附則第35条の2の2第5項）は列挙にない
        出典: [docs/public-sources/20261111_impl-research3_kokunen-laws.md#1]
      - 概念: 所得税.上場株式等の譲渡損失の損益通算を適用するか
        説明: 合計所得金額に入る上場株式等の額（措法第37条の12の2第1項の損益通算の後）
        出典: [docs/public-sources/20261109_round2b_kabu-law-and-nta.md#6]
    集約点を通らない依存:
      - 概念: 所得税.上場株式等に係る配当所得等の金額
        説明: 国年令第6条の11 の所得の範囲から上場株式等の所得を除く（集約点の合計所得金額では分けられない）
        出典: [docs/public-sources/20261111_impl-research3_kokunen-laws.md#1]
      - 概念: 所得税.上場株式等に係る譲渡所得等の金額
        説明: 同上
        出典: [docs/public-sources/20261111_impl-research3_kokunen-laws.md#1]
    変数: [年金_免除判定所得]
    出力: {申告の欄: false, 申告の範囲: false}
    注: 所得の段階（繰越控除の前。専従者給与は差し引いた後）は docs/hypotheses/20261109_round2_kokuho-core-vs-injected.md H11。2026-11-12：上場株式等の所得を除いた（国年令第6条の11 の列挙にない。原文 scripts/results/IMPL3_egov_fetch/kokunen/grep_kokunenrei_2027-04-01.txt の Num=6_11）

