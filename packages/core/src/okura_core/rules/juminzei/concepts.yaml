# 概念辞書：規則モジュール juminzei（住民税：個人の市町村民税・道府県民税の判定と税額、併せて賦課徴収する森林環境税。SCOPE §5.3）が担当する概念。
# 項目の書き方は concepts/__init__.py の docstring。出典は docs のファイル#節（公開資料の情報・実測）だけ。
# 2026-11-11 の雛形の約束（15 件）の名前・単位・期間・層は変えていない。足した概念は「（足した）」と注に書く。
#
# 時点（timepoints.py）：年度 F の値は、所得の年分 F−1 の situation で計算する（変数の期間は年、値は年度 F の値）。
# 所得税の値（前年分の合計所得金額・扶養などの判定）は「制度をまたぐ依存」で同じ期間の値を引く（年をまたぐ依存ではない）。README §3。
制度: 住民税
担当: juminzei
既定: {エンティティ: 人物, 期間: 年, 判定の時点: 年度, 実装済み: true, 値の型: 円}
概念:
  # =====================================================================
  # 事実（入力変数。inputs.py の build_inputs・allocation.py の段が書く）
  # =====================================================================
  - id: 住民税.賦課期日に住所を有する市町村
    名称: 賦課期日（その年度の初日の属する年の1月1日）に住所を有する市町村の団体コード
    定義: {条文: 地方税法第294条第1項第1号・第2項〜第4項・第318条（賦課期日）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_kyosai-separate-address.md#4.1, docs/public-sources/20261109_R1-laws_local-tax.md#1, docs/public-sources/20261109_round3_juminzei-extra-law-text.md#1.3]}
    判定の時点:
      問い: 年度
      説明: 賦課期日（timepoints の Window.date("賦課期日")）の住所。resident_record（住民票）と municipal_tax_domicile（住民票と違う市町村が課税する決定）、市町村の処分 authority_decision（taxation_at_non_resident_record_municipality。2026-11-12）から書く
      出典: [docs/public-sources/20261109_round2_kyosai-separate-address.md#4.2]
    層: 事実
    値の型: 区分
    変数: [住民税_賦課期日に住所を有する市町村]
    出力: {申告の欄: false, 申告の範囲: false}
    注: 住所がなければ「なし」（calc.NO_DOMICILE。その人に所得割・住所による均等割・森林環境税を課さない。2026-11-12 に空の文字列から変えた：結果の区分の値は空でない文字列）。記録がなければ未確定（決める手段：事実）

  - id: 住民税.家屋敷課税の対象か
    名称: 住所を有しない市町村内に事務所・事業所・家屋敷を有し、均等割を課される者か
    定義: {条文: 地方税法第294条第1項第2号・第3項、同第318条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round3_juminzei-extra-law-text.md#1.1, docs/public-sources/20261109_round3_juminzei-extra-law-text.md#1.2, docs/public-sources/20261109_round3_juminzei-extra-law-text.md#1.8]}
    層: 事実
    値の型: 真偽
    変数: [住民税_家屋敷課税の対象か]
    出力: {申告の欄: false, 申告の範囲: false}
    注: residence_property と 判断.家屋敷・事務所に当たる（未入力なら両方で評価）、municipal_tax_domicile（house_or_office）から書く。市町村ごとの均等割の額は 住民税.家屋敷課税の均等割の額（段 住民税の均等割。2つ以上の市町村は市町村ごとに足す：2026-11-12）

  - id: 住民税.生活扶助を受けているか
    名称: 賦課期日に生活保護法の規定による生活扶助を受けているか
    定義: {条文: 地方税法第295条第1項第1号, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_juminzei-hikazei-fuyo-shinkoku.md#3.1, docs/public-sources/20261109_impl-prep_juminzei-hikazei-fuyo-shinkoku.md#3.2]}
    層: 事実
    値の型: 真偽
    変数: [住民税_生活扶助を受けているか]
    注: （足した）public_assistance（livelihood_assistance）が賦課期日を含む

  - id: 住民税.減免の承認があるか
    名称: その年度の住民税（市町村民税・道府県民税）の減免の承認があるか
    定義: {条文: 地方税法第323条・第45条, 根拠の種類: 法律, 出典: [docs/public-sources/20261112_impl-research8_tokutei-shishutsu-laws.md#8]}
    層: 事実
    値の型: 真偽
    変数: [住民税_減免の承認があるか]
    出力: {申告の欄: false, 申告の範囲: false}
    注: >-
      （足した 2026-11-12。JM-40）authority_decision の reduction_approved（税目 resident_tax、when.fiscal_year がその年度）がその人にあれば真。
      減免は市町村の条例の定めによる個別の処分（第323条。道府県民税は第45条で市町村民税と同じ割合で減免されたものとする）で、額は記録にない。
      税額（所得割・均等割）は減免の前の額のまま出し、この値で減免の承認があることを示す（減免の後の額を推し量らない：SCOPE §2-4。国保.減免の承認があるか と同じ扱い）

  - id: 住民税.未成年者か
    名称: 第295条第1項第2号の未成年者（年齢18歳未満）か
    定義: {条文: 地方税法第295条第1項第2号、民法第4条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_juminzei-hikazei-fuyo-shinkoku.md#3.1, docs/public-sources/20261109_impl-prep_juminzei-hikazei-fuyo-shinkoku.md#3.3]}
    判定の時点:
      問い: 年度
      説明: 判定の時点は法令の文言で定まらない（注入データ 住民税.135万円の非課税の判定の時点。未注入なら賦課期日・前年の12月31日の両方で評価）
      出典: [docs/public-sources/20261109_impl-prep_juminzei-hikazei-fuyo-shinkoku.md#3.2, docs/public-sources/20261109_impl-prep_juminzei-hikazei-fuyo-shinkoku.md#3.3]
    層: 事実
    値の型: 真偽
    変数: [住民税_未成年者か]
    注入データ: [住民税.135万円の非課税の判定の時点]
    注: （足した）

  - id: 住民税.指定都市の区域内に住所を有するか
    名称: 賦課期日の住所が地方自治法第252条の19第1項の指定都市の区域内か
    定義: {条文: 地方税法第314条の3第1項・第314条の6・附則第5条の4第5項ほか（指定都市の率）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_juminzei-tax-law-text.md#4]}
    層: 事実
    値の型: 真偽
    変数: [住民税_指定都市の区域内に住所を有するか]
    注入データ: [住民税.所得割の税率]
    注: （足した）指定都市の一覧（政令の20市）は名前で、団体コードの一次情報が docs にないので、注入データ 住民税.所得割の税率 の 指定都市 の欄から書く（欄がなければ未確定）

  - id: 住民税.所得割の税率
    名称: 市町村民税・道府県民税の所得割の税率（条例の率。分子・分母）
    定義: {条文: 地方税法第314条の3第1項・第35条第1項（標準税率。超過課税・減税は条例）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_juminzei-tax-law-text.md#4, docs/public-sources/20261109_round2_juminzei-tax-admin-and-municipal.md#3]}
    層: 事実
    値の型: 整数
    変数: [住民税_市町村民税の所得割の税率の分子, 住民税_市町村民税の所得割の税率の分母, 住民税_道府県民税の所得割の税率の分子, 住民税_道府県民税の所得割の税率の分母]
    注入データ: [住民税.所得割の税率]
    注: （足した）候補を持たない注入点（未注入なら値は0で、依存する値は未確定）。道府県の率は指定都市の区域内か外かで選ぶ

  - id: 住民税.均等割の税率
    名称: 市町村民税・道府県民税の均等割の税率（条例の額）
    定義: {条文: 地方税法第310条・第38条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_juminzei-tax-law-text.md#13]}
    層: 事実
    変数: [住民税_市町村民税の均等割の税率, 住民税_道府県民税の均等割の税率]
    注入データ: [住民税.均等割の税率]
    注: （足した）

  - id: 住民税.均等割の非課税の条例の額
    名称: 均等割を課さない者の基準の条例の基本額・加算額
    定義: {条文: 地方税法第295条第3項、同施行令第47条の3, 根拠の種類: 政令, 出典: [docs/public-sources/20261109_impl-prep_juminzei-hikazei-fuyo-shinkoku.md#1.2, docs/public-sources/20261109_impl-prep_juminzei-hikazei-fuyo-shinkoku.md#1.4]}
    層: 事実
    変数: [住民税_均等割の非課税の基本額, 住民税_均等割の非課税の加算額]
    パラメータ: [住民税.非課税.均等割]
    注入データ: [住民税.均等割の非課税の額, 住民税.級地]
    注: （足した）注入されていなければ、級地（候補）の政令の上限どおりの額（35万円・21万円×級地の率）

  - id: 住民税.森林環境税の非課税の額
    名称: 森林環境税を課さない者の基準の基本額（35万円×級地の率）・加算額（21万円×級地の率）
    定義: {条文: 森林環境税及び森林環境譲与税に関する法律第4条第1項第3号、同施行令第1条, 根拠の種類: 政令, 出典: [docs/public-sources/20261109_round2_juminzei-tax-law-text.md#14]}
    層: 事実
    変数: [住民税_森林環境税の非課税の基本額, 住民税_森林環境税の非課税の加算額]
    パラメータ: [住民税.森林環境税.非課税]
    注入データ: [住民税.級地]
    注: （足した）級地は前年の12月31日。政令の式で直接決まる（条例の額によらない）

  - id: 住民税.家屋敷課税の均等割の額
    名称: 家屋敷課税の均等割の額（住所のない市町村ごとの、市町村民税と道府県民税の均等割の合計）
    定義: {条文: 地方税法第294条第1項第2号・第24条第1項第2号・第7項・第295条第1項・第3項・第310条・第38条・第20条の4の2第3項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round3_juminzei-extra-law-text.md#1.1, docs/public-sources/20261109_round3_juminzei-extra-law-text.md#1.5, docs/public-sources/20261109_round3_juminzei-extra-law-text.md#1.7]}
    層: 事実
    段階: 住民税の均等割
    変数: [住民税_家屋敷課税の均等割の額]
    パラメータ: [住民税.非課税.均等割]
    注入データ: [住民税.均等割の税率, 住民税.均等割の非課税の額, 住民税.級地, 住民税.家屋敷課税の運用]
    注: >-
      （足した。2026-11-12 に 住民税.家屋敷課税の市町村の額 と 住民税.家屋敷課税の均等割を課さない者か を置き換えた）段 住民税の均等割（kintowari.py）が、
      家屋敷・事務所のある市町村ごとに、その団体の税率・非課税の基準（施行地に住所を有する者に限る）と運用の型（型 B：その市町村に住む配偶者が住所地で課税されていれば課さない）で決めて足す

  - id: 住民税.軽減後の市町村民税の均等割の税率
    名称: 第311条の条例の軽減を当てた、住所地の市町村民税の均等割の額（軽減に当たらなければ税率）
    定義: {条文: 地方税法第311条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_juminzei-tax-law-text.md#13]}
    層: 事実
    段階: 住民税の均等割
    変数: [住民税_軽減後の市町村民税の均等割の税率]
    注入データ: [住民税.均等割の軽減, 住民税.均等割の税率]
    注: >-
      （足した）第1号（自身が均等割を納付する義務がある同一生計配偶者・扶養親族〔16歳未満・控除対象扶養親族〕）・第2号（第1号の者を2人以上有する）に当たる人だけが
      注入データ 住民税.均等割の軽減 を読む（候補を持たない：未注入ならその人の値は未確定）

  - id: 住民税.分離課税の所得から控除する所得控除の額
    名称: 総所得金額から引ききれない所得控除のうち、上場株式等に係る配当所得等の金額・譲渡所得等の金額から控除する額
    定義: {条文: 地方税法第314条の2第11項、附則第33条の2第7項第3号・第35条の2第8項第3号・第35条の2の2第8項, 根拠の種類: 法律, 出典: [docs/public-sources/20261111_impl-research3_juminzei-laws-and-soumu.md#3]}
    層: 事実
    段階: 住民税の分離課税の所得への所得控除
    変数: [住民税_上場株式等に係る配当所得等の金額から控除する所得控除の額, 住民税_上場株式等に係る譲渡所得等の金額から控除する所得控除の額]
    パラメータ: [住民税.税率.端数.課税標準の単位]
    注: （足した）区分の間の順序の一次情報がない。所得税の措通31・32共−4 の順（配当が先）で書き、もう一つの順と課税標準の合計が違えば分かれ目（決める手段：一次情報）

  - id: 住民税.寄附金税額控除の対象の寄附金の額
    名称: 前年中に支出した都道府県等に対する寄附金・特例控除対象寄附金・第2号〜第4号に当たりうる寄附金の額
    定義: {条文: 地方税法第314条の7第1項・第2項・第9項・第37条の2, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_juminzei-tax-law-text.md#8.1, docs/public-sources/20261109_round2_hoken-kifu-laws.md#8.1]}
    層: 事実
    変数: [住民税_都道府県等に対する寄附金の額, 住民税_特例控除対象寄附金の額, 住民税_市町村民税の第2号から第4号までの寄附金の額, 住民税_道府県民税の第2号から第4号までの寄附金の額, 住民税_第2号の寄附金の額]
    注入データ: [住民税.特例控除対象寄附金の指定, 住民税.条例で定める寄附金]
    注: >-
      （2026-11-12）住民税_第2号の寄附金の額 は第2号（共同募金会・日本赤十字社）の額だけ（第2号〜第4号の額と同じ分かれ目・由来）。確定申告書 第二表の寄附の欄を分ける
      （住民税.第二表の… の4つの概念）。
      （足した）特例控除対象寄附金の指定（総務大臣）は注入点 住民税.特例控除対象寄附金の指定（寄附先の団体ごと・寄附をした日。未注入なら指定の有無の両方で評価。
      2026-11-11）。寄附先の団体コードが中間表現にない寄附は未確定（決める手段：事実）。第3号・第4号は市町村・道府県ごとの条例（注入点 住民税.条例で定める寄附金：
      寄附先の名称で突き合わせる。未注入なら未確定）、第2号（共同募金会・日本赤十字社）は地令第48条の8・第7条の17（総務大臣の承認を受けた募集：mic_approved_solicitation）と
      住所の道府県内の事務所で決め、承認の記載がないもの・共同募金会の第7条の17第2号（告示が docs にない）は候補つき（一次情報なしで候補評価。2026-11-12。JM-08）

  - id: 住民税.申告特例控除の対象か
    名称: 申告特例通知書の送付があり、申告特例の求めがなかったものとみなされないか
    定義: {条文: 地方税法附則第7条第8項〜第13項・第7条の2第4項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_juminzei-tax-law-text.md#8.3, docs/public-sources/20261109_round2_hoken-kifu-laws.md#8.3]}
    層: 事実
    値の型: 真偽
    変数: [住民税_申告特例控除の対象か]
    注: >-
      （足した）選択.ワンストップ特例（未入力なら両方）。確定申告書・住民税の申告書の提出、5団体を超えた場合はなかったものとみなす。所法第121条の適用を受けない場合は 住民税.申告特例控除の額 の式で見る。
      2026-11-12（JM-39）：提出の記録がない人は、申告特例を求めた候補でだけ 選択.住民税の申告 の file_resident_tax_return（その年度分の住民税の申告書を提出するか）を読み、
      真なら附則第7条第13項第2号でなかったものとみなす（読んだときだけ開く1か所。未入力なら両方：D22 S20）

  - id: 住民税.控除の対象の配当割額等
    名称: 前年分の確定申告書に記載した特定配当等・特定株式等譲渡所得金額に課された配当割額・株式等譲渡所得割額
    定義: {条文: 地方税法第314条の9第1項・第37条の4・第23条第1項第15号、令和8年法律第2号附則第3条第3項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round3_juminzei-extra-law-text.md#2.1, docs/public-sources/20261109_round3_juminzei-extra-law-text.md#2.5]}
    層: 事実
    変数: [住民税_控除の対象の配当割額等]
    注: （足した）令和9年度分の配当の扱いの変更（D21 R3：2026-04-01 以後に支払を受けるべき特定配当等のロ）を含む

  - id: 住民税.住宅借入金等特別税額控除の版
