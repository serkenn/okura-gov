  - id: 所得税.申告納税額
    名称: 申告納税額（源泉徴収税額を控除した後。百円未満切捨て。控除しきれないときは0）
    定義: {条文: 所得税法第120条第1項第4号、国税通則法第119条第1項、復興財源確保法第24条第2項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#4.1, docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#1.2, docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#3.3]}
