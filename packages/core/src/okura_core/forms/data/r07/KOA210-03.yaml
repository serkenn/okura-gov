      場合:
        - {もし: [{概念: "所得税.事業所得の減価償却資産の行{行}.資産のID", 等しい: なし}], 空欄: 行に載せる事業所得の減価償却資産がない}
        - {もし: [{概念: "所得税.事業所得の減価償却資産の行{行}.本年分の割増償却費", 判定: 零}], 空欄: この資産にその年分の割増・特別償却がない}
        - {そのまま: "所得税.事業所得の減価償却資産の行{行}.本年分の割増償却費"}
