    依存する概念: [住民税.分離課税に係る退職所得の金額, 住民税.損失の繰越が所得税と違うか, 住民税.繰り越された雑損失の金額, 住民税.繰り越された純損失の金額, 住民税.合計所得金額, 住民税.住民税の申告書で特定支出控除を受けるか, 住民税.第313条第11項の前年の所得]
