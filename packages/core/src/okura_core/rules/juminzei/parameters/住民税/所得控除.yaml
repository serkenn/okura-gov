description: >-
  所得控除（地方税法第314条の2。道府県民税は第34条で同じ額）。令和8年度分（asof 2026-01-01・2026-11-09）と令和9年度分（asof 2027-01-01）で
  金額の文言は同じ（docs/public-sources/20261109_round2_juminzei-tax-law-text.md §3）。ひとり親控除の33万円は令和10年度分から（ここには置かない）。
