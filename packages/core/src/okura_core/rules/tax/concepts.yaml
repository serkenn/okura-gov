    変数: [所得税_確定申告書の提出義務があるか]
    パラメータ: [所得税.確定申告を要しない場合]
    出力: {申告の欄: false, 申告の範囲: false}
    注: >-
      判定（calc.filing_obligation）：第120条第1項の税額（課税総所得金額・課税退職所得金額・上場株式等の課税所得に対する税額の合計：措令の読替え）が配当控除の額を超えないなら偽、
      控除しきれない源泉徴収税額・予納税額があれば（還付される税額 > 0）偽。それ以外は第121条（給与：第1項、退職：第2項、公的年金等：第3項）の判定。
      従たる給与等の金額が分からない二以上の支払者（第1項第2号イ）は対象外（checks.py。c-入力：源泉徴収票の secondary_column を入れれば決まる）。
      「配当控除の額」は措法第41条の2の2第6項第2号の読替えで年末調整の住宅借入金等特別控除の額との合計額（所得税.年末調整で控除された住宅借入金等特別控除の額。2026-11-12）。
      第184条の家事使用人のみに支払う者・国外の支払（基通121−5(1)(3)）・令第262条の2 の同族会社の役員等は 所得税.給与等が第121条第1項の適用除外か で判定する（2026-11-12）。
      源泉徴収税額は所得税と復興特別所得税の合計で比べる（第120条第1項のかっこ書きは所得税の部分で比べる。zeigaku の仮説 H7：法令の読み）

  - id: 所得税.還付申告ができるか
    名称: 還付等を受けるための申告書を提出できるか
    定義: {条文: 所得税法第122条第1項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#5.3, docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#4.2]}
    値の型: 真偽
    依存する概念: [所得税.還付される税額]
    変数: [所得税_還付申告ができるか]
    出力: {申告の欄: false, 申告の範囲: false}
    注: 還付申告をするかは 選択.還付申告（納税者の選択。ライブラリは勧めない）。外国税額控除は範囲外（D20）

  - id: 所得税.還付申告の選択
    名称: 還付等を受けるための申告書を提出する選択（選択.還付申告、又は提出した確定申告書の記録）
    定義: {条文: 所得税法第122条第1項（提出することができる）、所得税基本通達121−1, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#4.2, docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#5.3]}
    層: 事実
    値の型: 真偽
    段階: 還付申告の選択
    変数: [所得税_還付申告の選択]
    注: >-
      2026-11-12（VOC C-13）：段 還付申告の選択（refund.py）が書く。所得税.還付申告ができるか が偽の人は偽（選択を読まない）。真の人は、その年分の確定申告書
      （準確定・確定損失を含む）の提出の記録があれば真（通達121−1）、なければ 選択.還付申告 の値（読んだときだけ開く1か所。未入力なら両方で評価：D22 S20）

  - id: 所得税.還付を受けるための申告書を提出するか
    名称: 控除しきれない源泉徴収税額・予納税額の還付を受けるための申告書（所得税法第122条）を提出するか
    定義: {条文: 所得税法第122条第1項・第138条第1項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#4.2, docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#5.3]}
    値の型: 真偽
    依存する概念: [所得税.還付申告ができるか, 所得税.還付申告の選択]
    変数: [所得税_還付を受けるための申告書を提出するか]
    出力: {申告の欄: false, 申告の範囲: false}
    注: >-
      2026-11-12：還付申告ができる（還付される税額が0超。控除しきれない源泉徴収税額等がある人は第120条第1項の提出義務の外）かつ 選択.還付申告 で提出する
      （又は確定申告書の提出の記録がある）とき真。偽なら第138条の還付は受けない（還付される税額は申告したときの額）。第122条の申告書には第三期の期限の文言がない
      （国税庁の説明 TA2030 は「翌年1月1日から5年間」：§4.2。この版は期間の末日を計算しない）

  - id: 所得税.申告期限
    名称: 確定申告書の提出期限（年の中途の死亡・出国の場合を含む）
    定義: {条文: 所得税法第120条第1項（翌年2月16日から3月15日まで）・第124条・第125条（死亡）・第126条・第127条（出国の時まで）、国税通則法第10条第2項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#5.1, docs/public-sources/20261109_round3_shibo-shukkoku-laws-and-nta.md#2.1, docs/public-sources/20261109_round3_shibo-shukkoku-laws-and-nta.md#3.1]}
    判定の時点: {問い: 年分, 説明: 期限の日が休日のときの扱い（国税通則法第10条第2項）, 出典: [docs/public-sources/20261109_round3_shibo-shukkoku-laws-and-nta.md#6]}
    値の型: 日付
    依存する概念: [所得税.申告の種類, 所得税.相続の開始があったことを知った日, 所得税.出国の日]
    変数: [所得税_申告期限]
    パラメータ: [所得税.申告期限, 所得税.休日]
    年をまたぐ依存:
      - パラメータ: 所得税.休日
        時点: 翌年・翌々年（期限の日の属する暦年の休日）
        説明: 第120条の期限は翌年、第125条の期限は年分の年・翌年・翌々年にかかりうるので、その暦年の休日（暦年ごとのパラメータ）で繰り下げる
        出典: [docs/public-sources/20261109_round3_shibo-shukkoku-laws-and-nta.md#6.1]
    出力: {申告の欄: false, 申告の範囲: false}
    注: >-
      祝日は暦要項と通達による（D22 S9：docs/public-sources/20261109_round3_shibo-shukkoku-laws-and-nta.md §6.1）。第120条の期限（第三期の末日）と、
      第124条・第125条の期限（相続人等の知った日の翌日から4月を経過した日の前日）を休日の繰下げつきで出し、第126条・第127条の期限は出国の時（繰り下げない）。
      第125条第2項（還付の申告）には期限の文言がないが、確定申告期限（所法第2条第1項第41号）として同じ日を出す。第124条の「提出しないで」は提出した申告書の記録と問いの提出日で判定する。
      2026-11-12：相続人が出国をする場合は出国の時（所得税.出国の日 に相続人の出国の日を入れる）。相続人ごとの期限が違えば分かれ目（一次情報）、相続人不存在は清算人が確定した日（語彙にない：事実）、
      暦要項が未発表なら分かれ目（公表待ち）で未確定にする（以前は対象外）
