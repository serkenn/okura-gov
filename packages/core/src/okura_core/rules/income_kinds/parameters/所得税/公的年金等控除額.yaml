description: >-
  公的年金等控除額（所得税法第35条第4項）と65歳以上の最低控除額の特例（租税特別措置法第41条の15の3第1項・第4項）。
  原文：docs/public-sources/20261109_round2b_nenkin-laws-and-guidance.md §2.1・§2.2（令和7年分〔asof 2025-12-31〕・令和8年分〔asof 2026-12-31〕・
  2027-01-01 の版で第1項〜第4項は同文：docs/measurements/20261109_round2b_nenkin-fetch-and-checks.md V1）。
  第5項（給与所得控除額との合計が280万円を超える場合の調整）は令和9年分以後（令和8年法律第12号）で、この木には入れていない
  （令和9年分は判定コアの対象の年分の外）。当初の施行日（令和2年分以後の形にした改正）は docs で確かめていない。
  円未満の端数の定めは第35条・措法41の15の3・国税庁の速算表のどれにもない（同 §10 の1）→ 規則モジュールの根拠のない端数の候補で評価する。
