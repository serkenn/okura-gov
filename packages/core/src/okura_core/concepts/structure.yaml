# 概念辞書の構造：層と制度（SCOPE §6-3・§6-4・§7）。共通の部分（規則モジュールは触らない）。
# YAML はコードとして扱う：タグを書かない（読み込みは安全な読み込み。重複したキーは誤り）。
# 規則：
#   - 変数の式は、同じ層か下の層（順位が小さい）の概念だけを引く。
#   - 制度をまたぐ依存は「依存してよい制度」へだけ。所得税（幹）は他の制度に依存しない。
#     住民税・国保・国年・健保は、中心の概念から分かれる別の系統（SCOPE §6-3）。
#   - 集約点のある層（「所得の種類ごとの所得」「所得控除」）へ上の層から直接つなぐのは、その層の集約点だけ（SCOPE §6-4）。
#     例外は概念の「集約点を通らない依存」に根拠つきで書く。
# 2026-11-11：「人の区分」（所得に依存しない人・人と人の判定）と「所得控除」（各所得控除の額）の層を足した
#   （所得金額調整控除の第1項が扶養親族・特別障害者に依存し、合計所得金額がそれに依存するため、所得に依存しない判定を
#    所得の種類より下の層に置く。packages/core/README.md §10）。

層:
  - id: 事実
    順位: 1
    説明: 入力変数（中間表現の事実・判断・選択から状況を組み立てるときに入れる値）。式を持たない
  - id: 人の区分
    順位: 2
    説明: 年齢・居住者・障害者・親族・生計を一にする・同居など、所得に依存しない人の属性と人と人の関係の判定
  - id: 所得の種類ごとの所得
    順位: 3
    説明: 給与所得の金額・事業所得の金額など、所得の種類ごとの金額
  - id: 中心の概念
    順位: 4
    説明: 合計所得金額・総所得金額等など、多くの規則が共通に使う所得の合計（集約点を含む）と所得金額調整控除・繰越控除
  - id: 人的控除・扶養の判定
    順位: 5
    説明: 扶養親族・配偶者・寡婦・ひとり親・勤労学生などに当たるかの判定（真偽）
  - id: 所得控除
    順位: 6
    説明: 各所得控除の額（人的控除の額と、その他の所得控除の額）
  - id: 所得控除の合計
    順位: 7
    説明: 所得控除の額の合計（所得控除の層の集約点）
  - id: 課税所得
    順位: 8
    説明: 課税総所得金額など
  - id: 税額
    順位: 9
    説明: 税額・税額控除・復興特別所得税・源泉徴収税額の精算・申告の要否と期限・保険料の額

# 制度：概念 ID の接頭辞（「制度.」）・OpenFisca の変数の接頭辞・パラメータの木の根（制度の名前と同じ）。
制度:
  - id: 所得税
    変数の接頭辞: 所得税_
    依存してよい制度: []
    説明: 幹。所得税法・租税特別措置法・東日本大震災からの復興のための施策を実施するために必要な財源の確保に関する特別措置法
  - id: 住民税
    変数の接頭辞: 住民税_
    依存してよい制度: [所得税]
    説明: 地方税法の個人住民税（所得税法の計算の例による部分がある。地方税法第313条第2項）
  - id: 国保
    変数の接頭辞: 国保_
    依存してよい制度: [住民税]
    説明: 国民健康保険料（税）。所得割の基礎と軽減の判定は地方税法の総所得金額等による
  - id: 国年
    変数の接頭辞: 年金_
    依存してよい制度: [住民税, 所得税, 健保]
    説明: >-
      国民年金（保険料の免除の所得は地方税法の総所得金額等、扶養親族等は所得税法の定義による。国民年金法第36条の3第1項）。
      第3号被保険者の生計維持の認定は健康保険法等の被扶養者の認定の取扱いを勘案する（国民年金法施行令第4条：
      docs/public-sources/20261109_round3_dai3go-notice-search.md §6）ので、健保の基準（約束の概念）に依存してよい（2026-11-11 ユーザーの判断）
  - id: 健保
    変数の接頭辞: 健保_
    依存してよい制度: []
    説明: 健康保険・共済組合の被扶養者。他の制度への依存は、必要になったときに根拠つきで足す
