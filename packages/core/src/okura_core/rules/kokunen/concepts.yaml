      - 概念: 所得税.扶養親族に当たるか
        説明: 所得税法に規定する扶養親族（国年法第36条の3第1項）
        出典: [docs/public-sources/20261109_round2_kokuho-premium-structure.md#12.1]
      - 概念: 所得税.同一生計配偶者に当たるか
        説明: 所得税法に規定する同一生計配偶者（国年法第36条の3第1項）
        出典: [docs/public-sources/20261109_round2_kokuho-premium-structure.md#12.1]
      - 概念: 所得税.年齢
