      中心の概念の層の合計額なので、この値も中心の概念の層に置く（所得税の側は段 未払の給与の回収不能 が上限を写すが、この値は所得税の扶養の判定に戻らないので段は要らない）。
      2分の1を超える特定支出のない人は0（juminzei の段は読まない）

