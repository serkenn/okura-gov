description: >-
  所得税法第89条第1項の税率の表。課税総所得金額・課税退職所得金額を、それぞれ区分ごとに率を乗じて合計する（超過累進）。
  令和6年分・令和7年分・令和8年分の版で同文（docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md §2・§10）。
  課税山林所得金額の5分5乗は範囲外（山林所得：D20）。
