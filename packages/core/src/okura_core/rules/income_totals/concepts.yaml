      （足した 2026-11-12 の3回目。juminzei JM-42）所得税.回収不能額等の前の総所得金額と退職所得金額の合計額 と同じ関数（uncollectible._pre_totals）で、給与所得と
      公的年金等に係る雑所得を特定支出控除を当てた場合の64① の前の額にする。所得金額調整控除は所得税の値から第2項だけを計算し直す（第1項は収入金額と
      「有するか」で決まり特定支出控除で変わらない。「有するか」は扶養の判定の段の後の確定した値：所得税の側のような偽・真の2つの値と段は要らない）

