    定義: {条文: 所得税法第70条、所得税法施行令第201条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_aoiro-laws-and-nta.md#5.2, docs/public-sources/20261109_round2_genka-laws-and-nta.md#7]}
    依存する概念: [所得税.繰り越された純損失の金額, 所得税.配当所得の金額, 所得税.不動産所得の金額, 所得税.事業所得の金額, 所得税.給与所得の金額, 所得税.雑所得の金額, 所得税.一時所得の金額, 所得税.退職所得の金額, 所得税.所得金額調整控除, 所得税.一時所得の2分の1の端数の候補]
    集約点: 所得の種類ごとの所得
    変数: [所得税_純損失の繰越控除額]
    注: 損益通算の後に（所令201①三）、総所得金額から、なお控除しきれない額を退職所得金額から控除する（所令201①二。山林所得は範囲外）。合計所得金額は繰越控除を適用しないで計算する（所得税法第2条第1項第30号イ(2)）

  - id: 所得税.雑損失の繰越控除額
    名称: 雑損失の繰越控除の額
    定義: {条文: 所得税法第71条、所得税法施行令第204条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round3_shibo-shukkoku-laws-and-nta.md#8]}
    依存する概念: [所得税.繰り越された雑損失の金額, 所得税.純損失の繰越控除額, 所得税.配当所得の金額, 所得税.不動産所得の金額, 所得税.事業所得の金額, 所得税.給与所得の金額, 所得税.雑所得の金額, 所得税.一時所得の金額, 所得税.退職所得の金額, 所得税.所得金額調整控除, 所得税.一時所得の2分の1の端数の候補, 所得税.上場株式等に係る配当所得等の金額, 所得税.上場株式等に係る譲渡所得等の金額, 所得税.上場株式等の譲渡損失の繰越控除額, 所得税.上場株式等の譲渡損失の損益通算を適用するか]
    集約点: 所得の種類ごとの所得
    変数: [所得税_雑損失の繰越控除額]
    注: >-
      損益通算と純損失の繰越控除の後に（所令204②）、総所得金額 → 上場株式等に係る配当所得等 → 上場株式等に係る譲渡所得等（措令4の2⑨・25の11の2⑳の読替え。
      上場分は損益通算・繰越控除の後：⑰⑱）→ 退職所得金額の順に控除する（一般株式等・山林所得は範囲外）。純損失は上場分に及ばない（所法70 は読替えの対象外）

  - id: 所得税.純損失の繰戻しによる還付請求額
    名称: 純損失の繰戻しによる還付の請求額
    定義: {条文: 所得税法第140条第1項・第2項・第4項、第141条第1項〜第3項、所得税法施行令第271条第1項第1号、所得税基本通達140・141−2・140・141−4, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_aoiro-laws-and-nta.md#5.3, docs/public-sources/20261109_round3_shibo-shukkoku-laws-and-nta.md#9]}
    層: 税額
    依存する概念: [所得税.純損失の金額, 所得税.青色申告の承認を受けているか, 所得税.前年分の課税総所得金額, 所得税.前年分の課税退職所得金額, 所得税.前年分の税額控除後の所得税の額, 所得税.前年分に青色申告書を提出したか, 所得税.繰り戻す純損失の金額の選択, 所得税.その年分の確定申告書を期限内に提出するか]
    変数: [所得税_純損失の繰戻しによる還付請求額]
    パラメータ: [所得税.純損失の繰戻し]
    出力: {申告の欄: false, 申告の範囲: false}
    注: >-
      前年分の課税総所得金額に所法89① の税率を当てた税額から、繰り戻した後の課税総所得金額の税額を引く（課税標準は千円未満・税額は百円未満を切捨て：所基通140・141−4）。
      前年分の税額控除後の所得税の額が限度（所法140②、所基通140・141−2）。繰り戻す額が前年分の課税総所得金額を超えるときは、残りを課税山林所得金額、次に課税退職所得金額から
      控除する（所令271①三）。課税山林所得金額が正なら範囲外（D20）、記載がなければ対象外（checks.py）。前年の平均課税（所令271①六）は後の段（D21 R3）。
      事業の廃止等・死亡の年の前年の純損失の前々年分への繰戻し（所法140⑤・141④）は別の概念（所得税.前々年分への純損失の繰戻しによる還付請求額）。
      税率は年分に応じた複製（所得税.純損失の繰戻し.税率：前年分の年分の表）を持つ（tax の税率表は当年分の課税総所得金額の計算のため。所法R6〜R8 で同文）

  - id: 所得税.前々年分への純損失の繰戻しによる還付請求額
    名称: 事業の全部の譲渡・廃止等又は死亡の年の前年の純損失の前々年分への繰戻しによる還付の請求額
    定義: {条文: 所得税法第140条第5項・第141条第4項、所得税法施行令第272条第2項・第271条第1項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_aoiro-laws-and-nta.md#5.3, docs/public-sources/20261109_round3_shibo-shukkoku-laws-and-nta.md#9]}
    層: 税額
    依存する概念: [所得税.前々年分に繰り戻す純損失の金額, 所得税.前々年分の課税総所得金額, 所得税.前々年分の課税退職所得金額, 所得税.前々年分の税額控除後の所得税の額, 所得税.前々年分に既に繰り戻した純損失の金額]
    変数: [所得税_前々年分への純損失の繰戻しによる還付請求額]
    パラメータ: [所得税.純損失の繰戻し]
    出力: {申告の欄: false, 申告の範囲: false}
    注: >-
      所令272②：前々年分の課税総所得金額・課税退職所得金額と所得税の額を基礎に、所法140①〜③・所令271 に準じて計算する（calc.second_prior_refund）。
      前年分の申告で前々年分に繰り戻した額（所法140①）があれば、その額を課税総所得金額等から控除し、その還付額を限度の所得税の額から控除する（「所得税の額」を
      還付の限度と読む：法令の読み）。税率の表は所法R6〜R8 で同文なので同じパラメータ（令和6年分の前々年分の表）。令和7年分の前々年分（令和5年分）の表は docs に
      記録がないので対象外（README の IT-13）

