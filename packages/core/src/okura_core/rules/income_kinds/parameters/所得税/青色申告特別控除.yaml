description: >-
  青色申告特別控除（租税特別措置法第25条の2）の令和7年分・令和8年分の額。原文：docs/public-sources/20261109_round2_aoiro-laws-and-nta.md §3.1
  （2025-12-31 版と 2026-12-31 版で同文。措規9の6 も同文）。令和9年分以後は第2項〜第7項の形が変わる（同 §3.3。令和8年法律第12号附則第33条：
  令和九年分以後の所得税について適用）が、令和9年分は判定コアの対象の年分の外なので、この木には入れていない。
  当初の施行日（55万円・65万円の形にした改正）は docs で確かめていない。
第1項の額:
  description: 第1項第1号「十万円」（不動産所得・事業所得・山林所得の金額の合計額が限度）
