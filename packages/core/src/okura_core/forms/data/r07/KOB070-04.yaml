名称: 給与所得者の特定支出に関する明細書（4面：支出の明細）
様式番号: 未確認（国税庁の様式 039.pdf の様式番号を docs に写していない）
様式の根拠: 国税庁の様式「給与所得者の特定支出に関する明細書」（https://www.nta.go.jp/taxes/shiraberu/shinkoku/yoshiki/02/pdf/039.pdf）。e-Tax の帳票フィールド仕様書 KOB070 7.0
記載事項の根拠: 所得税法第57条の2第3項、所得税法施行令第167条の4
