措法第41条の15の5:
  適用:
    description: その年分に措法第41条の15の5（年齢23歳未満の扶養親族を有する場合の生命保険料控除の特例）を当てうるか（条文「令和八年分又は令和九年分」）
    metadata:
      law: 租税特別措置法第41条の15の5第1項
      source_kind: 法律
      reference:
        - docs/public-sources/20261109_round2_hoken-kifu-laws.md#2.3
        - docs/public-sources/20261109_round2_hoken-kifu-laws.md#1
        - docs/measurements/20261109_round2_hoken-kifu-fetch.md#3.1
    values:
      2025-01-01:
        value: false
        metadata:
          適用: 令和7年分にはこの条がない（措法 asof 2025-12-31 の版にない）
      2026-01-01:
        value: true
        metadata: &sp2026
          施行日: 2026-01-01
          適用: >-
            令和7年法律第13号附則第1条第2号ロ（令和8年1月1日施行）で新設（当初は「令和八年分」だけ）。令和8年法律第12号で
            「令和八年分又は令和九年分」に改正（asof 2026-04-01 の版から。law_revision 332AC0000000026_20260401_508AC0000000012）。
            読替えの額は両方の版で同じ
      2028-01-01:
        value: false
        metadata:
          適用: 令和10年分以後は条文の「令和八年分又は令和九年分」の外
