    変数: [所得税_事業所得等が自己の勤労に基づくか]
    実装済み: true
    注: （足した）判断がある人・業務の記録がある人は判断の値（未入力なら両方で評価：D21 R6）。それ以外は偽（事業所得・雑所得がない）

