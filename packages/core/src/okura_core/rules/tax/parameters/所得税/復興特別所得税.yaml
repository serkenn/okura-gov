description: >-
  復興特別所得税（東日本大震災からの復興のための施策を実施するために必要な財源の確保に関する特別措置法）。
  基準所得税額に税率を乗じる（第12条・第13条）。1円未満の端数は年分で根拠が違う（rules/tax/basis.py：
  令和7年分は手引きの注記、令和8年分は根拠が見つからず候補で評価）。令和9年分以後は防衛特別所得税と合わせて
  見直される（令和9年分は対象の年分の外。防衛特別所得税は docs で読んでいない：zeigaku §11-4）。
