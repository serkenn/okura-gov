description: >-
  生命保険料控除（所得税法第76条第1項〜第4項）と、年齢23歳未満の扶養親族を有する場合の特例（租税特別措置法第41条の15の5）。
  区分ごとの式（イ〜ニ）、新旧の両方を支払った場合の上限、合計の上限。所法76 は所法R6〜R9 で同文
  （docs/public-sources/20261109_round2_hoken-kifu-laws.md §1・§2.1）。端数の定めは条文にない（同 §9）。
  式の1円未満は国税庁「令和8年分 年末調整のしかた」の切上げに従う（rules/other_deductions/basis.py の HOKEN_CEIL）。
