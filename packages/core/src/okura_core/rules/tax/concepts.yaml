    変数: [所得税_基準所得税額]
    出力: {申告の欄: true, 申告の範囲: true}
    注: >-
      税額控除は手引き 3-4_36（㊷）の順（㉝ 配当控除 → ㉞ 事業所得等の特例 → ㉟ 住宅借入金等 → ㊱〜㊳ 政党等寄附金等 → ㊴〜㊶ 住宅耐震改修等）に、
      それぞれ前に残った税額を限度に控除する（合計で算出税額を限度。0未満にしない：calc.deduct_credits。2026-11-12 に ㉞・㊴〜㊶ を足した）。災害減免額は後の段（D21 R3）

  - id: 所得税.事業所得等の特例に係る税額控除の区分
    名称: 第一表 ㉞ の区分（事業所得等の特例に係る税額控除があれば「1」、なければ「なし」）
    定義: {条文: 令和7年分 確定申告の手引き 3-4_29, 根拠の種類: 手引き・様式の注記, 出典: [docs/public-sources/20261112_impl-research6_forms-tax-credits.md#2]}
    値の型: 区分
    依存する概念: [所得税.事業所得等の特例に係る税額控除の額]
    変数: [所得税_事業所得等の特例に係る税額控除の区分]
    注: 2026-11-12 に足した。額が正なら「1」（左側の空欄に「投資税額等」）。手引きは ㉞ の区分の番号を「1」のほかに書いていない

  - id: 所得税.住宅耐震改修特別控除等の額
    名称: 住宅耐震改修特別控除等の額（第一表 ㊴〜㊶：住宅耐震改修特別控除・住宅特定改修特別税額控除・認定住宅等新築等特別税額控除の合計）
    定義: {条文: 令和7年分 確定申告の手引き 3-4_32（複数の控除がある場合は合計額）, 根拠の種類: 手引き・様式の注記, 出典: [docs/public-sources/20261112_impl-research6_forms-tax-credits.md#3]}
    依存する概念: [所得税.住宅耐震改修特別控除の額, 所得税.住宅特定改修特別税額控除の額, 所得税.認定住宅等新築等特別税額控除の額]
    変数: [所得税_住宅耐震改修特別控除等の額]
    出力: {申告の欄: true, 申告の範囲: true}
    注: 2026-11-12 に足した。外部で計算した3つの額の合計（計算はしない）

  - id: 所得税.住宅耐震改修特別控除等の区分
    名称: 第一表 ㊴〜㊶ の区分（住宅耐震改修特別控除 1・住宅特定改修特別税額控除 2・認定住宅等新築等特別税額控除 3・複数 4。なければ「なし」）
    定義: {条文: 令和7年分 確定申告の手引き 3-4_32, 根拠の種類: 手引き・様式の注記, 出典: [docs/public-sources/20261112_impl-research6_forms-tax-credits.md#3]}
    値の型: 区分
    依存する概念: [所得税.住宅耐震改修特別控除の額, 所得税.住宅特定改修特別税額控除の額, 所得税.認定住宅等新築等特別税額控除の額]
    変数: [所得税_住宅耐震改修特別控除等の区分]
    注: 2026-11-12 に足した。額が正の控除の種類で決める（calc.housing_credit_category）

  - id: 所得税.復興特別所得税額
    名称: 復興特別所得税の額（基準所得税額の2.1%）
    定義: {条文: 東日本大震災からの復興のための施策を実施するために必要な財源の確保に関する特別措置法第12条・第13条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#3.1]}
    依存する概念: [所得税.基準所得税額, 所得税.復興特別所得税額の端数の候補]
    変数: [所得税_復興特別所得税額]
    パラメータ: [所得税.復興特別所得税]
    出力: {申告の欄: true, 申告の範囲: true}
    注: >-
      1円未満の端数：令和7年分は手引きの注記（切捨て。根拠の種類は手引き・様式の注記）、令和8年分は手引きが未公表なので国税通則法基本通達第119条関係6 の
      一般の定めで切捨て（根拠の種類は通達・法令の読みの印。docs/public-sources/20261111_impl-research_hasu-tebiki-and-nta.md §5。手引きの公表後に照合する）。
      令和9年分以後の改正は対象の年分の外（zeigaku §3.2）

