# 概念辞書：規則モジュール tax（所得控除の合計・課税所得・税額・申告の要否・期限）が担当する概念。
# 変数名・単位（値の型）・期間・層は約束（変えるときは引くモジュールの担当と合わせる）。2026-11-11 に全部を実装した
# （約束の23件に、事実の層の「申告の種類」「相続の開始があったことを知った日」「復興特別所得税額の端数の候補」を足した。どれもこのモジュールの中だけで使う）。
# 端数：課税標準は千円未満の切捨て（国税通則法第118条第1項）、確定金額は所得税と復興特別所得税の合計で百円未満の切捨て
# （同第119条第1項・復興財源確保法第24条第2項）、還付金は1円未満の切捨て（通則法第120条第1項）。
# 復興特別所得税額の1円未満は、令和7年分は手引きの注記、令和8年分は国税通則法基本通達第119条関係6 の読みで切捨て（D21 R5・D22 S1）。
# 住宅借入金等特別控除などの税額控除は外部で計算した額を受け取る（SCOPE §4・§5.2）。外国税額控除は範囲外（D20）。災害減免は後の段（D21 R3）。
# 金額の概念は「申告の欄」「申告の範囲」を両方 true にした（2026-11-11：所得控除の合計が引く控除が実装されたので）。上流が対象外の人は申告用の値全体が止まる（build_filing）。
# 真偽・日付の概念（提出義務・還付申告・申告期限）は欄に写す金額でないので false のまま。
制度: 所得税
担当: tax
既定: {エンティティ: 人物, 期間: 年, 判定の時点: 年分, 値の型: 円, 実装済み: true, 層: 税額}
概念:
  # --- 事実（入力変数） ---
  - id: 所得税.源泉徴収税額
    名称: その年分の各種所得について源泉徴収をされた（又はされるべき）所得税及び復興特別所得税の額
    定義: {条文: 所得税法第120条第1項第4号、復興財源確保法第28条・第31条第2項（所得税と併せて徴収し、合計で1円未満を切り捨てる）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#4.1, docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#3.1]}
    層: 事実
    変数: [所得税_源泉徴収税額]
    出力: {申告の欄: true, 申告の範囲: true}
    注: >-
      源泉徴収票（D23 K4）・給与の支払・業務の報酬の受取・年金の支払・退職手当等の支払・配当等・特定口座の源泉徴収税額の合計（inputs.py）。申告不要を選んだ配当等・
      源泉徴収口座の分は含めない（措法第8条の5・第37条の11の5、手引き 3-4_38）。給与は支給日（due_on）の年分で数える（kyuyo の収入金額と同じ区切り：所基通36−9。所法120①四の「計算の基礎となつた各種所得につき」）。支払の記録の欄がない場合は対象外（c-入力）。
      源泉徴収をしない支払者（所法184）・国外の支払は欄がなければ0。未払の給与の「されるべき」額は読みが分かれる（［H3］H7）ので、(a) 別表（gensen.py）で計算・(b) 入れない の両方で評価し、
      (a) の額を決める入力（支給期の区分など）が語彙にないので分かれ目（一次情報）を付ける（甲欄で日額表の最初の帯より下なら (a) も0で分かれない）。源泉徴収票と記録の合計の食い違いの印は未実装

  - id: 所得税.予定納税額
    名称: その年分の予定納税額（第1期・第2期の合計。通知書の合計額）
    定義: {条文: 所得税法第104条・第120条第2項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#4.3]}
    層: 事実
    変数: [所得税_予定納税額]
    出力: {申告の欄: true, 申告の範囲: true}
    注: 予定納税の通知（prepayment_notice）の prepayment_total。同じ人・年分に通知が2件以上あれば対象外（減額の承認などの扱いを決めていない）

  - id: 所得税.住宅借入金等特別控除の額
    名称: 住宅借入金等特別控除の額（外部で計算した額）
    定義: {条文: 租税特別措置法第41条（外部で計算した額を受け取る。SCOPE §4）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#5.1]}
    層: 事実
    変数: [所得税_住宅借入金等特別控除の額]
    出力: {申告の欄: true, 申告の範囲: true}
    注: housing_loan_credit の credit_amount。同じ人・年分に2件以上あれば対象外（合計してよいかを決めていない）

  # 外部で計算した税額控除（2026-11-12。SCOPE §4：住宅借入金等特別控除と同じく額を受け取る）。第一表 ㉞・㊴〜㊶。
  # 個々の控除の根拠条文と限度は docs で読んでいない（計算明細書・付表で外部が計算する）。欄と区分は手引きで確かめた
  - id: 所得税.事業所得等の特例に係る税額控除の額
    名称: 事業所得等の特例に係る税額控除の額（中小企業者が機械等を取得した場合の所得税額の特別控除など。第一表 ㉞ の「投資税額等」。外部で計算した額）
    定義: {条文: 令和7年分 確定申告の手引き 3-4_29（外部で計算した額を受け取る。SCOPE §4）, 根拠の種類: 手引き・様式の注記, 出典: [docs/public-sources/20261112_impl-research6_forms-tax-credits.md#2]}
    層: 事実
    変数: [所得税_事業所得等の特例に係る税額控除の額]
    出力: {申告の欄: true, 申告の範囲: true}
    注: external_tax_credit の credit_type business_income_special の credit_amount（複数の制度は外部で合計して1件）。同じ人・年分に2件以上あれば対象外（TX-26）

  - id: 所得税.住宅耐震改修特別控除の額
    名称: 住宅耐震改修特別控除の額（外部で計算した額）
    定義: {条文: 令和7年分 確定申告の手引き 3-4_32（外部で計算した額を受け取る。SCOPE §4）, 根拠の種類: 手引き・様式の注記, 出典: [docs/public-sources/20261112_impl-research6_forms-tax-credits.md#3]}
    層: 事実
    変数: [所得税_住宅耐震改修特別控除の額]
    注: external_tax_credit の credit_type seismic_retrofit の credit_amount。同じ人・年分に2件以上あれば対象外（TX-26）

  - id: 所得税.住宅特定改修特別税額控除の額
    名称: 住宅特定改修特別税額控除の額（外部で計算した額）
    定義: {条文: 令和7年分 確定申告の手引き 3-4_32（外部で計算した額を受け取る。SCOPE §4）, 根拠の種類: 手引き・様式の注記, 出典: [docs/public-sources/20261112_impl-research6_forms-tax-credits.md#3]}
    層: 事実
    変数: [所得税_住宅特定改修特別税額控除の額]
    注: external_tax_credit の credit_type specified_housing_renovation の credit_amount。同じ人・年分に2件以上あれば対象外（TX-26）

  - id: 所得税.認定住宅等新築等特別税額控除の額
    名称: 認定住宅等新築等特別税額控除の額（外部で計算した額）
    定義: {条文: 令和7年分 確定申告の手引き 3-4_32（外部で計算した額を受け取る。SCOPE §4）, 根拠の種類: 手引き・様式の注記, 出典: [docs/public-sources/20261112_impl-research6_forms-tax-credits.md#3]}
    層: 事実
    変数: [所得税_認定住宅等新築等特別税額控除の額]
    注: external_tax_credit の credit_type certified_housing_new_build の credit_amount。同じ人・年分に2件以上あれば対象外（TX-26）

  - id: 所得税.申告の種類
    名称: その年分の確定申告書の種類（期限の規定）
    定義: {条文: 所得税法第120条第1項・第124条〜第127条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round3_shibo-shukkoku-laws-and-nta.md#2.1, docs/public-sources/20261109_round3_shibo-shukkoku-laws-and-nta.md#3.1]}
    層: 事実
    値の型: 区分
    変数: [所得税_申告の種類]
    出力: {申告の欄: false, 申告の範囲: false}
    注: >-
      値は「第120条」・「第124条」（翌年の初めの死亡で確定申告書を提出していない）・「第125条」（年の中途の死亡）・「第125条（知った日が決まらない）」・「出国」（第126条・第127条）・
      「出国又は非居住者」（判定できない）。後の2つの判定できない値は入力を対象外にする。第124条の期限は第125条と同じ形

  - id: 所得税.出国の日
    名称: 「出国」（納税管理人の届出をしないで国内に住所及び居所を有しないこととなること）の日
    定義: {条文: 所得税法第2条第1項第42号・第126条・第127条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round3_shibo-shukkoku-laws-and-nta.md#3.1]}
    層: 事実
    値の型: 日付
    変数: [所得税_出国の日]
    注: 判断.住所の所在 の foreign の開始日で、納税管理人の届出がない人の出国の時（申告の種類が「出国」の人だけが使う。inputs.py）

  - id: 所得税.給与等の支払者の数
    名称: その年中に給与等の支払を受けた支払者の数
    定義: {条文: 所得税法第121条第1項第1号・第2号, 根拠の種類: 法律, 出典: [docs/public-sources/20261111_impl-research_121-laws-and-nta.md#1]}
    層: 事実
    値の型: 整数
    変数: [所得税_給与等の支払者の数]

  - id: 所得税.給与等の全部が源泉徴収の対象か
    名称: 給与等の全部について第183条・第190条の規定による所得税の徴収をされた又はされるべきか
    定義: {条文: 所得税法第121条第1項第1号・第2号, 根拠の種類: 法律, 出典: [docs/public-sources/20261111_impl-research_121-laws-and-nta.md#1, docs/public-sources/20261111_impl-research_121-laws-and-nta.md#2]}
    層: 事実
    値の型: 真偽
    変数: [所得税_給与等の全部が源泉徴収の対象か]
    注: 記録の源泉徴収税額の欄があれば徴収された（又はされるべき）ものと読む。第184条の家事使用人のみに支払う者・国外の支払（基通121−5）は語彙に材料がなく見ない（根拠に読みの印）

  - id: 所得税.給与等の全部が年末調整の対象か
    名称: 給与等の全部について第190条（年末調整）の規定が適用されるか
    定義: {条文: 所得税基本通達121−4, 根拠の種類: 通達, 出典: [docs/public-sources/20261111_impl-research_121-laws-and-nta.md#3]}
    層: 事実
    値の型: 真偽
    変数: [所得税_給与等の全部が年末調整の対象か]

  - id: 所得税.従たる給与等の金額
    名称: 第195条第1項の従たる給与等の支払者から支払を受ける給与等の金額
    定義: {条文: 所得税法第121条第1項第2号イ, 根拠の種類: 法律, 出典: [docs/public-sources/20261111_impl-research_121-laws-and-nta.md#1]}
    層: 事実
    変数: [所得税_従たる給与等の金額]
    注: 源泉徴収票の secondary_column が真の支払者の金額の合計

  - id: 所得税.従たる給与等の金額が分かるか
    名称: 給与の支払者ごとの源泉徴収票の記載から従たる給与等の金額を決められるか
    定義: {条文: 所得税法第121条第1項第2号イ, 根拠の種類: 法律, 出典: [docs/public-sources/20261111_impl-research_121-laws-and-nta.md#1]}
    層: 事実
    値の型: 真偽
    変数: [所得税_従たる給与等の金額が分かるか]

  - id: 所得税.公的年金等の全部が源泉徴収の対象か
    名称: 公的年金等の全部について第203条の2 の規定による所得税の徴収をされた又はされるべきか
    定義: {条文: 所得税法第121条第3項, 根拠の種類: 法律, 出典: [docs/public-sources/20261111_impl-research_121-laws-and-nta.md#1, docs/public-sources/20261109_round2b_nenkin-laws-and-guidance.md#6]}
    層: 事実
    値の型: 真偽
    変数: [所得税_公的年金等の全部が源泉徴収の対象か]

  - id: 所得税.退職手当等の全部が源泉徴収の対象か
    名称: 退職手当等の全部について第199条・第201条第1項の規定による所得税の徴収をされた又はされるべきか
    定義: {条文: 所得税法第121条第2項第1号, 根拠の種類: 法律, 出典: [docs/public-sources/20261111_impl-research_121-laws-and-nta.md#1, docs/public-sources/20261109_round2b_taishoku-laws-and-guidance.md#4.1]}
    層: 事実
    値の型: 真偽
    変数: [所得税_退職手当等の全部が源泉徴収の対象か]

  - id: 所得税.退職手当等の源泉徴収税額
    名称: 退職手当等の源泉徴収税額の合計
    定義: {条文: 所得税法第121条第2項第2号, 根拠の種類: 法律, 出典: [docs/public-sources/20261111_impl-research_121-laws-and-nta.md#1, docs/public-sources/20261109_round2b_taishoku-laws-and-guidance.md#4.1]}
    層: 事実
    変数: [所得税_退職手当等の源泉徴収税額]

  - id: 所得税.相続の開始があったことを知った日
    名称: 相続の開始があったことを知った日（年の中途で死亡した人の相続人等の記録から）
    定義: {条文: 所得税法第125条第1項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round3_shibo-shukkoku-laws-and-nta.md#2.1]}
    層: 事実
    値の型: 日付
    変数: [所得税_相続の開始があったことを知った日]
    注: >-
      2026-11-11 に足した。heirship の when.on を知った日として読む（語彙の読み：VOC F-R07 の中身。vocabulary.py の題には書かれていない）。
      申告の種類が「第125条」の人だけ意味がある（ほかの人は使わない日を入れる）

  - id: 所得税.給与等が第121条第1項の適用除外か
    名称: 第121条第1項（給与所得者の確定申告不要）を適用しない給与等の支払を受けたか
    定義: {条文: 所得税法第121条第1項ただし書・第184条、所得税法施行令第262条の2、所得税基本通達121−5, 根拠の種類: 法律, 出典: [docs/public-sources/20261111_impl-research_121-laws-and-nta.md#1, docs/public-sources/20261111_impl-research_121-laws-and-nta.md#2, docs/public-sources/20261111_impl-research_121-laws-and-nta.md#3]}
    層: 事実
    値の型: 真偽
    変数: [所得税_給与等が第121条第1項の適用除外か]
    注: >-
      2026-11-12 に足した（TX-25）。salary_payment の payer_withholding_exempt_household・paid_outside_japan（基通121−5(1)(3)）、payer_family_company_officer と interest_or_rent_from_payer の両方（所令262の2）。
      欄がなければ当たらないものとする（法令の読み）。基通121−5(2) の在日大公使館等は中間表現の語彙にない

  - id: 所得税.年末調整で控除された住宅借入金等特別控除の額
    名称: 年末調整で租税特別措置法第41条の2の2第1項により控除された住宅借入金等特別控除の額
    定義: {条文: 租税特別措置法第41条の2の2第1項・第6項第2号, 根拠の種類: 法律, 出典: [docs/public-sources/20261111_impl-research3_joto-junjo-laws-and-nta.md#4]}
    層: 事実
    変数: [所得税_年末調整で控除された住宅借入金等特別控除の額]
    注: >-
      2026-11-12 に足した（TX-20）。所得税法第120条第1項の比較で配当控除の額に加える。居住の年分（moved_in_on の年）・給与がない・全部の支払者の源泉徴収票が年末調整なしなら0。
      それ以外は源泉徴収票の「住宅借入金等特別控除の額」（withholding_slip の amounts.housing_loan_credit。2026-11-12 に語彙を足した）の合計。記載がなければ分かれ目（事実）で未確定

  - id: 所得税.上場株式等の所得控除の順序
    名称: 所得控除を上場株式等に係る配当所得等・譲渡所得等の金額に当てる順序
    定義: {条文: 租税特別措置法関係通達31・32共−4（ただし書：納税者が異なる順序で控除して申告したときは認める）, 根拠の種類: 通達, 出典: [docs/public-sources/20261111_impl-research3_joto-junjo-laws-and-nta.md#3]}
    層: 事実
    値の型: 区分
    変数: [所得税_上場株式等の所得控除の順序]
    注: >-
      2026-11-12 に足した（TX-19）。値は「配当所得等→譲渡所得等」（通達の順）か「譲渡所得等→配当所得等」。上場株式等の配当・譲渡の記録がある人は 選択.所得控除の順序 の1か所
      （値 dividends_first・transfers_first。未入力なら両方で評価：D22 S20）。式は2つの順で結果が違う人がいるときだけ引く

  - id: 所得税.復興特別所得税額の端数の候補
    名称: 復興特別所得税額の1円未満の端数の候補の名前（根拠のない端数を候補の全部で評価するときに evaluate が入れる）
    定義: {条文: 復興財源確保法第13条・第24条（基準所得税額×2.1% の1円未満を定める規定は見つからない）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#3.3, docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#11]}
    層: 事実
    値の型: 区分
    変数: [所得税_復興特別所得税額の端数の候補]
