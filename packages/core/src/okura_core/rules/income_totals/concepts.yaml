    定義: {条文: 所得税法第64条第1項、所得税法施行令第180条第2項第1号、所得税基本通達64−2の2・64−3、地方税法第313条第2項・第11項, 根拠の種類: 政令, 出典: [docs/public-sources/20261112_impl-research4_shotoku-laws-and-nta.md#1.1, docs/public-sources/20261112_impl-research4_shotoku-laws-and-nta.md#1.3, docs/public-sources/20261112_impl-research8_tokutei-shishutsu-laws.md#6]}
