# テストの道具の規則モジュール（packages/core/tests/fixture_modules.py）。法令の概念ではない。
# build_inputs の窓口（パラメータ・端数の候補・提出日・段の値）と、年分別の根拠を確かめるためだけに使う。
制度: 所得税
担当: test_windows
既定: {エンティティ: 人物, 期間: 年, 判定の時点: 年分, 実装済み: true}
概念:
  - id: 所得税.試験_窓口の額
    名称: 試験：窓口から読んだ値で作る入力
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R4-modeling_concepts.md#4.1]}
    層: 事実
    値の型: 円
    変数: [所得税_試験_窓口の額]
    出力: {申告の欄: false, 申告の範囲: false}

  - id: 所得税.試験_提出月
    名称: 試験：提出日の月
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R4-modeling_concepts.md#4.1]}
    層: 事実
    値の型: 整数
    変数: [所得税_試験_提出月]
    出力: {申告の欄: false, 申告の範囲: false}

  - id: 所得税.試験_給与の三分の一の丸め
    名称: 試験：build_inputs で根拠のない端数を丸めた額
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R4-modeling_concepts.md#4.1]}
    層: 事実
    値の型: 円
    変数: [所得税_試験_給与の三分の一の丸め]
    出力: {申告の欄: false, 申告の範囲: false}

  - id: 所得税.試験_相手の給与の写し
    名称: 試験：段の値を build_inputs で読んで書く入力
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R4-modeling_concepts.md#4.1]}
    層: 事実
    値の型: 円
    変数: [所得税_試験_相手の給与の写し]
    段階: 試験_給与を読む
    出力: {申告の欄: false, 申告の範囲: false}
