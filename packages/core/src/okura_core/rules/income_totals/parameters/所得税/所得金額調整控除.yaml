description: >-
  所得金額調整控除（租税特別措置法第41条の3の11）。第1項（給与等の収入金額850万円超で特別障害者・年齢23歳未満の扶養親族などを有する者）と
  第2項（給与所得と公的年金等に係る雑所得の双方を有する者）の控除額の計算に使う。
  原文：docs/public-sources/20261109_round2_gaps-sources.md#3.1（措法の asof 2025-12-31 版・2026-12-31 版で本文が同一）。
第1項の給与等の収入金額の基準:
  description: >-
    第1項（子ども・特別障害者等を有する者等）の適用がありうる給与等の収入金額の基準（この額を超える居住者）。第1項の控除の額の起点でもある。
  metadata:
    law: 租税特別措置法第41条の3の11第1項（「その年中の給与等の収入金額が八百五十万円を超える居住者で…」）
    source_kind: 法律
    unit: 円
    比較: 超
    reference:
      - docs/public-sources/20261109_round2_gaps-sources.md#3.1
      - docs/measurements/20261109_round2_gaps-fetch-and-checks.md#C3
  values:
    2025-01-01:
      value: 8500000
      metadata:
        適用: >-
          令和7年分（asof 2025-12-31）・令和8年分（asof 2026-12-31）の版で本文が同一であることを確かめた
          （docs/public-sources/20261109_round2_gaps-sources.md §3.1）。この条を設けた改正法と当初の施行日は確かめていない（施行日は未確認）
第1項の給与等の収入金額の上限:
  description: 第1項の「当該給与等の収入金額が千万円を超える場合には、千万円」
  metadata:
    law: 租税特別措置法第41条の3の11第1項（「当該給与等の収入金額が千万円を超える場合には、千万円」）
    source_kind: 法律
    unit: 円
    比較: 超
    reference:
      - docs/public-sources/20261109_round2_gaps-sources.md#3.1
      - docs/measurements/20261109_round2_gaps-fetch-and-checks.md#C3
  values:
    2025-01-01:
      value: 10000000
      metadata:
        適用: 令和7年分（asof 2025-12-31）・令和8年分（asof 2026-12-31）の版で本文が同一（docs/public-sources/20261109_round2_gaps-sources.md §3.1）。この条を設けた改正法と当初の施行日は確かめていない（施行日は未確認）
第1項の率:
  description: 第1項の「百分の十」（850万円を超える部分に乗じる率。分子/分母）
  分子:
    description: 第1項の率の分子
    metadata:
      law: 租税特別措置法第41条の3の11第1項（百分の十）
      source_kind: 法律
      reference:
        - docs/public-sources/20261109_round2_gaps-sources.md#3.1
    values:
      2025-01-01:
        value: 10
        metadata: {適用: 令和7年分・令和8年分の版で本文が同一}
  分母:
    description: 第1項の率の分母
    metadata:
      law: 租税特別措置法第41条の3の11第1項（百分の十）
      source_kind: 法律
      reference:
        - docs/public-sources/20261109_round2_gaps-sources.md#3.1
    values:
      2025-01-01:
        value: 100
        metadata: {適用: 令和7年分・令和8年分の版で本文が同一}
第2項:
  description: >-
    第2項：給与所得控除後の給与等の金額（10万円を超えるときは10万円）と公的年金等に係る雑所得の金額（10万円を超えるときは10万円）の
    合計額から10万円を控除した残額を、給与所得の金額から控除する（合計額が10万円を超え、双方がある居住者）。
  給与所得控除後の給与等の金額の上限:
    description: 第2項の「当該給与所得控除後の給与等の金額（当該給与所得控除後の給与等の金額が十万円を超える場合には、十万円）」
    metadata: &dai2
      law: 租税特別措置法第41条の3の11第2項（令和8年分は租税特別措置法施行令第19条の4の2第1項の読替えがある）
      source_kind: 法律
      unit: 円
      reference:
        - docs/public-sources/20261109_round2_gaps-sources.md#3.1
        - docs/public-sources/20261109_round2_gaps-sources.md#3.3
        - docs/measurements/20261109_round2_gaps-fetch-and-checks.md#C3
    values:
      2025-01-01:
        value: 100000
        metadata: &tekiyo
          適用: >-
            令和7年分（措法 asof 2025-12-31）・令和8年分（asof 2026-12-31）の版で本文が同一（docs/public-sources/20261109_round2_gaps-sources.md §3.1、
            実測 C3：条の中の金額は 8,500,000、10,000,000、10,000,000、8,500,000、100,000×6）。この条を設けた改正法と当初の施行日は確かめていない（施行日は未確認）
  公的年金等に係る雑所得の金額の上限:
    description: 第2項の「当該公的年金等に係る雑所得の金額（当該公的年金等に係る雑所得の金額が十万円を超える場合には、十万円）」
    metadata: *dai2
    values:
      2025-01-01:
        value: 100000
        metadata: *tekiyo
  控除する額:
    description: 第2項の「合計額が十万円を超えるもの」「合計額から十万円を控除した残額」の十万円（超えなければ控除はない）
    metadata: *dai2
    values:
      2025-01-01:
        value: 100000
        metadata: *tekiyo
