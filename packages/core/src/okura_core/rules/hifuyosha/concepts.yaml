    定義: {条文: 昭和52年4月6日 保発第9号・庁保発第9号 記2、組合の基準, 根拠の種類: 通知・事務連絡, 出典: [docs/public-sources/20261109_R3-tsutatsu_shakaihoken-juminzei.md#1.1, docs/public-sources/20261109_round2_kyosai-separate-address.md#2]}
