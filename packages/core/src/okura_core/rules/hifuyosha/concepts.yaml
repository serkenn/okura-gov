# 概念辞書：規則モジュール hifuyosha（健康保険・共済組合〔国家公務員・地方公務員・私学〕の被扶養者の判定。SCOPE §5.5）が担当する概念の約束。
# 項目の書き方は concepts/__init__.py の docstring。出典は docs のファイル#節（公開資料の情報・実測）だけ。
# 変数名・単位（値の型）・期間・層は約束（2026-11-11 の雛形の13件）。2026-11-11 の実装で事実の層の概念を14件足した（注に「（足した）」）。
#
# 時点（timepoints.py）：判定日ごとの値。判定日 D の属する暦年の situation を D ごとに作る（変数の期間は年、値は判定日 D の値）。
# 保険者ごとの運用は注入データ（injection_points.py の 健保.*）。未注入なら調査で集めた運用の型の全部で評価する（D21 R6）。
# 健保は他の制度に依存しない（structure.yaml）。第3号被保険者の判定は kokunen（保険者の運用を使わない）。
制度: 健保
担当: hifuyosha
既定: {エンティティ: 人物, 期間: 年, 判定の時点: 判定日, 実装済み: true}
概念:
  # =====================================================================
  # 被扶養者の所属（グループ）と事実
  # =====================================================================
  - id: 健保.被扶養者の割当て
    名称: 誰の被扶養者として判定するか（健康保険のグループ：被保険者・被扶養者・対象外）
    定義: {条文: 健康保険法第3条第7項、国家公務員共済組合法第2条第1項第2号など（被扶養者の定義）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R1-laws_social-insurance-age-records.md#1, docs/public-sources/20261109_round2_kyosai-law-and-criteria.md#1.1]}
    層: 人の区分
    エンティティ: 健康保険
    値の型: 区分
    変数: []
    実装済み: false
    注: >-
      グループの概念で変数を持たない（実装済みの印は変数の有無で決まる）。inputs.build_groups が組み立てる：選択.被扶養者の届出 ＞ medical_insurance（capacity＝dependent・役割 insured）＞ insurer_decision（最新の認定・届出）の順。
      同じ順位で2人の被保険者に届け出ていれば、夫婦共同扶養なら主として生計を維持する者に置き、それ以外は最初の被保険者に置いて
      「選択.被扶養者の届出」の分かれ目を付ける（1人が2人の被保険者の被扶養者にならない：docs/public-sources/20261109_impl-prep_kenpo-dependent-practice.md §4.2）

  - id: 健保.判定日
    名称: 判定日（認定の対象の日。基準額の版を選ぶ）（足した）
    定義: {条文: 令和7年7月4日 保発0704第1号・第2号 記3、令和7年10月1日 保保発1001第3号, 根拠の種類: 通知・事務連絡, 出典: [docs/public-sources/20261109_impl-prep_kenpo-dependent-practice.md#5.1]}
    層: 事実
    値の型: 日付
    変数: [健保_判定日]

  - id: 健保.判定日の年齢
    名称: 判定日の年齢（60歳以上かなど）
    定義: {条文: 昭和52年4月6日 保発第9号・庁保発第9号（収入の基準の年齢）, 根拠の種類: 通知・事務連絡, 出典: [docs/public-sources/20261109_R3-tsutatsu_shakaihoken-juminzei.md#1.1, docs/public-sources/20261109_impl-prep_kenpo-dependent-practice.md#5.5]}
    層: 事実
    値の型: 整数
    変数: [健保_判定日の年齢]
    出力: {申告の欄: false, 申告の範囲: false}
    注: >-
      60歳の判定の時点は通知・組合の資料に書かれていない（docs/public-sources/20261109_impl-prep_kenpo-dependent-practice.md §5.5）。判定日の年齢で見る（読み）。
      出力は年齢の境目の比べる年齢のため（共有の担当。2026-11-12）

  - id: 健保.判定日の属する年の12月31日の年齢
    名称: 判定日の属する年の12月31日の年齢（19歳以上23歳未満かの判定）
    定義: {条文: 令和7年10月1日からの収入の基準（19歳以上23歳未満は150万円未満）の通知, 根拠の種類: 通知・事務連絡, 出典: [docs/public-sources/20261109_R3-tsutatsu_shakaihoken-juminzei.md#1.2, docs/public-sources/20261109_round3_kyosai-b-ministerial-criteria.md#2.3, docs/public-sources/20261109_round3_kyosai-b-ministerial-criteria.md#3.3]}
    層: 事実
    値の型: 整数
    変数: [健保_判定日の属する年の12月31日の年齢]
    出力: {申告の欄: false, 申告の範囲: false}
    注: 共済の大臣の定めの原文に判定の時点はなく、組合の案内による（D22 S5）。出力は年齢の境目の比べる年齢のため（共有の担当。2026-11-12）

  - id: 健保.障害を支給事由とする給付の受給要件に該当する程度の障害を有するか
    名称: 障害厚生年金（障害を支給事由とする給付）の受給要件に該当する程度の障害を有する者か（180万円の基準）
    定義: {条文: 昭和52年4月6日 保発第9号・庁保発第9号、共済組合の運用方針（大臣の定め）, 根拠の種類: 通知・事務連絡, 出典: [docs/public-sources/20261109_R3-tsutatsu_shakaihoken-juminzei.md#1.1, docs/public-sources/20261109_round3_kyosai-b-ministerial-criteria.md#1.2]}
    層: 事実
    値の型: 真偽
    変数: [健保_障害を支給事由とする給付の受給要件に該当する程度の障害を有するか]
    注: pension_entitlement（disability）があれば真。なければ 判断.障害の程度（aspect＝pension_disability_level_for_health_insurance）。手帳（disability_basis）だけで判断がなければ候補で評価

  - id: 健保.国内居住の要件を満たすか
    名称: 判定日に日本国内に住所を有するか、又は国内居住の要件の例外に当たるか
    定義: {条文: 健康保険法第3条第7項（国内居住要件）、健康保険法施行規則第37条の2、令和元年の通知, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_kenpo-dependent-practice.md#2.3, docs/public-sources/20261109_round2_kyosai-law-and-criteria.md#1.2]}
    層: 事実
    値の型: 真偽
    変数: [健保_国内居住の要件を満たすか]
    注: 判断.住所の所在 ＞ 住民票の記録 ＞ abroad_stay。国外なら留学・赴任に同行・観光等の一時的な渡航は例外、それ以外は 判断.国内居住の例外第5号

  - id: 健保.被扶養者の範囲の親族か
    名称: 被保険者の直系尊属・配偶者・子・孫・兄弟姉妹か（同居を要しない）、それ以外の三親等内の親族等か（同居を要する）の区分
    定義: {条文: 健康保険法第3条第7項第1号〜第4号、国家公務員共済組合法第2条第1項第2号イ〜ハ, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R1-laws_social-insurance-age-records.md#1, docs/public-sources/20261109_impl-prep_kenpo-dependent-practice.md#2.3, docs/public-sources/20261109_round2_kyosai-law-and-criteria.md#1.2]}
    層: 事実
    値の型: 区分
    変数: [健保_被扶養者の範囲の親族か]
    注: 値は「同居を要しない親族」「同居を要する親族」「範囲外」。共済は曾祖父母が同居を要する親族（kinship.py）

  - id: 健保.同一の世帯に属するか
    名称: 被保険者と同一の世帯に属するか（保険者の運用による）
    定義: {条文: 健康保険法第3条第7項、昭和52年4月6日 保発第9号・庁保発第9号、国家公務員共済組合法等の運用方針 第2条関係 第1項第2号 5, 根拠の種類: 通知・事務連絡, 出典: [docs/public-sources/20261109_impl-prep_kenpo-dependent-practice.md#2.3, docs/public-sources/20261109_round2_kyosai-separate-address.md#1.2]}
    層: 事実
    値の型: 真偽
    変数: [健保_同一の世帯に属するか]
    注入データ: [健保.同一の世帯の運用]
    注: 判断.健保の同一の世帯 があればその値。なければ cohabitation・resident_record・separation_reason・判断.一時的な別居・institution_stay・dwelling_stay と保険者の運用。共済は 判断.共済の生計を共にする も要る

  - id: 健保.被保険者の配偶者か
    名称: 被保険者の配偶者（事実婚を含む）か（足した）
    定義: {条文: 令和7年7月4日 保発0704第1号（被保険者の配偶者を除く）、同日の事務連絡 Q1, 根拠の種類: 通知・事務連絡, 出典: [docs/public-sources/20261109_R3-tsutatsu_shakaihoken-juminzei.md#1.2, docs/public-sources/20261109_round3_kyosai-b-ministerial-criteria.md#3.3]}
    層: 事実
    値の型: 真偽
    変数: [健保_被保険者の配偶者か]

  - id: 健保.被保険者の制度
    名称: 届け出る被保険者の制度（健康保険・国家公務員共済・地方公務員共済・私学共済。被保険者でなければ空）（足した）
    定義: {条文: 健康保険法第3条第7項、国家公務員共済組合法第2条第1項第2号、地方公務員等共済組合法第2条第1項第2号、私立学校教職員共済法第25条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_kyosai-law-and-criteria.md#1.1]}
    層: 事実
    値の型: 区分
    変数: [健保_被保険者の制度]
    注: 船員保険の被保険者の被扶養者は範囲外（SCOPE §5.5）として、その人の値を対象外にする

  - id: 健保.被扶養者から除かれる資格を有するか
    名称: 判定日に健保・船員保険・共済の被保険者・組合員本人、後期高齢者医療の被保険者、又は健保則第37条の3 の者か（足した）
    定義: {条文: 健康保険法第3条第7項ただし書・健康保険法施行規則第37条の3、国家公務員共済組合法施行規則第2条の5第1項など、国家公務員共済組合法等の運用方針 第2条関係 第1項第2号 1、事業主の証明に依る被扶養者認定に関するQ&A A4-1, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_kenpo-dependent-practice.md#4.1, docs/public-sources/20261109_impl-prep_kenpo-dependent-practice.md#4.2, docs/public-sources/20261109_round2_kyosai-law-and-criteria.md#1.2, docs/public-sources/20261109_round2_kyosai-law-and-criteria.md#3.1]}
    層: 事実
    値の型: 真偽
    変数: [健保_被扶養者から除かれる資格を有するか]
    注: >-
      2026-11-11：健保則第37条の3（共済の規則も同じ2号）の者を足した：civil_status の japanese_national が真でなく、designated_activity が
      医療を受ける活動等（medical_care_or_attendance）・観光保養等（sightseeing_or_recreation）

  - id: 健保.収入の見込みによる年間収入
    名称: 従来の方法（今後1年間の収入の見込み）による年間収入（足した）
    定義: {条文: 平成30年8月29日 事務連絡 Q13、令和7年7月4日 事務連絡 Q5, 根拠の種類: 通知・事務連絡, 出典: [docs/public-sources/20261109_impl-prep_kenpo-dependent-practice.md#1.1, docs/public-sources/20261109_impl-prep_kenpo-dependent-practice.md#1.2]}
    層: 事実
    値の型: 円
    変数: [健保_収入の見込みによる年間収入]
    パラメータ: [健保.事業主の証明]
    注入データ: [健保.年間収入の見込みの型, 健保.通勤手当の扱い, 健保.事業収入から差し引ける経費, 健保.給付型の奨学金の扱い]
    注: >-
      見込み.年間収入（予測）の種類ごとの額：給与（通勤手当を含まない運用では労働契約の通勤手当の月額×12 を引く）、事業・不動産（総収入の見込み。
      直近の確定申告の運用では business_receipt の実績）から保険者が認める経費（business_expense・判断.健保の経費の費目）を引いた額、
      公的年金・雇用保険の給付・傷病手当金など（非課税を含む）。temporary_increase_excluded は事業主の証明（連続2回まで）がなければ足し戻す。
      直近の確定申告の運用の business_receipt の実績は、判断.収入の恒常性 が一時的（temporary）とした受取を除く（年間収入は恒常的な収入の状況で算定する：
      docs/public-sources/20261109_round2_gaps-sources.md#6.3、docs/public-sources/20261109_round2_kyosai-law-and-criteria.md#6.2。判断がなければ含める。2026-11-12）

  - id: 健保.労働契約による判定を使うか
    名称: 労働契約の内容による年間収入の判定を使うか（判定日が2026-04-01以後・給与収入のみ・契約の記載が明確）（足した）
    定義: {条文: 令和7年10月1日 保保発1001第3号・年管管発1001第3号, 根拠の種類: 通知・事務連絡, 出典: [docs/public-sources/20261109_R3-tsutatsu_shakaihoken-juminzei.md#1.3, docs/public-sources/20261109_impl-prep_kenpo-dependent-practice.md#5.1]}
    層: 事実
    値の型: 真偽
    変数: [健保_労働契約による判定を使うか]
    パラメータ: [健保.労働契約による判定]

  - id: 健保.労働契約による年間収入
    名称: 労働契約で定められた賃金（諸手当・賞与を含み、時間外労働の賃金を含まない）から見込まれる年間収入（足した）
    定義: {条文: 令和7年10月1日 保保発1001第3号・年管管発1001第3号、令和8年3月9日 事務連絡 Q&A（第2版）, 根拠の種類: 通知・事務連絡, 出典: [docs/public-sources/20261109_R3-tsutatsu_shakaihoken-juminzei.md#1.3, docs/public-sources/20261109_impl-prep_kenpo-dependent-practice.md#1.2]}
    層: 事実
    値の型: 円
    変数: [健保_労働契約による年間収入]
    注: 時給・日給は週の額の52週分（換算式は出典にない：法令の読み）。1円未満は根拠のない端数として候補で評価

  - id: 健保.実績による年額
    名称: 実績の窓（連続する月・任意の連続12か月）による年額換算（足した）
    定義: {条文: 組合の基準（公立学校共済組合広島支部・大分支部、福岡県市町村職員共済組合、文部科学省共済組合広島大学支部の申立書）, 根拠の種類: 保険者の案内, 出典: [docs/public-sources/20261109_round2_kyosai-law-and-criteria.md#6.4, docs/public-sources/20261112_impl-research4_hifuyosha-insurers.md#1, docs/public-sources/20261112_impl-research4_hifuyosha-insurers.md#2]}
    層: 事実
    値の型: 円
    変数: [健保_実績による年額]
    注入データ: [健保.年間収入の見込みの型]

  - id: 健保.被保険者本人の年間収入の見込み
    名称: 被保険者本人の今後1年間の年間収入の見込み（足した）
    定義: {条文: 昭和52年4月6日 保発第9号・庁保発第9号、令和3年4月30日 保保発0430第2号 別紙1(1), 根拠の種類: 通知・事務連絡, 出典: [docs/public-sources/20261109_R3-tsutatsu_shakaihoken-juminzei.md#1.1, docs/public-sources/20261109_impl-prep_kenpo-dependent-practice.md#3]}
    層: 事実
    値の型: 円
    変数: [健保_被保険者本人の年間収入の見込み]

  - id: 健保.援助の見込み額
    名称: 被保険者からの今後1年間の援助（仕送り）の見込み額（足した）
    定義: {条文: 昭和52年4月6日 保発第9号・庁保発第9号 記2、平成30年8月29日 事務連絡, 根拠の種類: 通知・事務連絡, 出典: [docs/public-sources/20261109_round2_kyosai-separate-address.md#2, docs/public-sources/20261109_impl-prep_kenpo-dependent-practice.md#5.1]}
    層: 事実
    値の型: 円
    変数: [健保_援助の見込み額]
    注入データ: [健保.別居の仕送りの基準]

  - id: 健保.他の者からの援助の見込み額
    名称: 被保険者以外の者からの援助の見込み額（全収入の計算に使う）（足した）
    定義: {条文: 組合の基準（全収入＝本人の収入と送金の合計）, 根拠の種類: 保険者の案内, 出典: [docs/public-sources/20261109_round2_kyosai-separate-address.md#2]}
    層: 事実
    値の型: 円
    変数: [健保_他の者からの援助の見込み額]

  - id: 健保.別居の仕送りの基準の型
    名称: 同一の世帯に属しないときの仕送りの基準の型（保険者の運用）（足した）
    定義: {条文: 昭和52年4月6日 保発第9号・庁保発第9号 記2、組合の基準, 根拠の種類: 通知・事務連絡, 出典: [docs/public-sources/20261109_round2_kyosai-separate-address.md#2]}
    層: 事実
    値の型: 区分
    変数: [健保_別居の仕送りの基準の型]
    注入データ: [健保.別居の仕送りの基準]

  - id: 健保.主たる扶養者でないか
    名称: 主として生計を維持する者でないか（夫婦共同扶養・共済の他の者の扶養手当・共同扶養）（足した）
    定義: {条文: 令和3年4月30日 保保発0430第2号・保国発0430第1号、国家公務員共済組合法等の運用方針 第2条関係 第1項第2号 2(1)(2), 根拠の種類: 通知・事務連絡, 出典: [docs/public-sources/20261109_impl-prep_kenpo-dependent-practice.md#3, docs/public-sources/20261109_round2_kyosai-law-and-criteria.md#3.1]}
    層: 事実
    値の型: 真偽
    変数: [健保_主たる扶養者でないか]
    パラメータ: [健保.夫婦共同扶養]
    注: >-
      夫婦共同扶養の主たる扶養者は、届け出た被保険者が育児休業等の期間中なら異動しない（別紙3。その休業の子〔childcare_leave の child_ids〕は改めて判定）、
      共済の扶養手当の認定（別紙1(3)）、保険者間の協議が整わない（insurer_decision の joint_support_agreement が偽）なら初めの届出の月の標準報酬月額の高い方
      （別紙1(5)。同額は届出）、それ以外は年間収入の多い方（差が1割以内は届出）。私学共済は、認定対象者から見て加入者より近い親族等が被用者保険の被保険者か、
      国保で収入が加入者より多いなら主たる扶養者でない（PMAC-01：組合の案内）

  - id: 健保.被保険者が生計維持の中心的役割を果たすか
    名称: 被保険者が世帯の生計維持の中心的役割を果たしていると認められるか（S52 記1 のただし書）（足した）
    定義: {条文: 昭和52年4月6日 保発第9号・庁保発第9号 記1, 根拠の種類: 通知・事務連絡, 出典: [docs/public-sources/20261109_R3-tsutatsu_shakaihoken-juminzei.md#1.1]}
    層: 事実
    値の型: 真偽
    変数: [健保_被保険者が生計維持の中心的役割を果たすか]
    注: 中間表現に語彙がないので 判断.主たる扶養者（person＝認定対象者、supporter＝被保険者）を材料にする（法令の読み）

  # =====================================================================
  # 年間収入（判定日以後の今後1年間の見込み）と収入の基準
  # =====================================================================
  - id: 健保.年間収入
    名称: 被扶養者の認定の年間収入（今後1年間の収入の見込み）
    定義:
      条文: 健康保険法第3条第7項の「主としてその被保険者により生計を維持するもの」の認定の基準（法令に収入の金額の基準はなく、通知・事務連絡で定まる）
      根拠の種類: 通知・事務連絡
      出典:
        - docs/public-sources/20261109_impl-prep_kenpo-dependent-practice.md#1.1
        - docs/public-sources/20261109_impl-prep_kenpo-dependent-practice.md#1.2
        - docs/public-sources/20261109_R4-modeling_concepts.md#1
    判定の時点:
      問い: 判定日
      説明: 被扶養者に該当する時点（認定された日）以降の今後1年間の収入の見込み。見込みは人の判断（予測）として受け取り、結果に「予測」の状態が付く（D19）
      出典:
        - docs/public-sources/20261109_impl-prep_kenpo-dependent-practice.md#1.1
    層: 中心の概念
    値の型: 円
    変数: [健保_年間収入]
    依存する概念: [健保.収入の見込みによる年間収入, 健保.労働契約による判定を使うか, 健保.労働契約による年間収入]
    出力: {申告の欄: false, 申告の範囲: false}
    注: 労働契約の内容による判定（判定日が2026-04-01以後で使えるとき）はその額、それ以外は従来の方法の額

  - id: 健保.収入の基準額
    名称: 被扶養者の年間収入の基準額（130万円・19歳以上23歳未満は150万円・60歳以上又は障害者は180万円）
    定義: {条文: 昭和52年4月6日 保発第9号・庁保発第9号、令和7年10月1日からの改正の通知、各共済の大臣の定め, 根拠の種類: 通知・事務連絡, 出典: [docs/public-sources/20261109_R3-tsutatsu_shakaihoken-juminzei.md#1.1, docs/public-sources/20261109_R3-tsutatsu_shakaihoken-juminzei.md#1.2, docs/public-sources/20261109_round3_kyosai-b-ministerial-criteria.md#4]}
    層: 人の区分
    値の型: 円
    変数: [健保_収入の基準額]
    依存する概念: [健保.判定日, 健保.判定日の年齢, 健保.判定日の属する年の12月31日の年齢, 健保.障害を支給事由とする給付の受給要件に該当する程度の障害を有するか, 健保.被保険者の配偶者か, 健保.被保険者の制度]
    パラメータ: [健保.被扶養者の収入の基準額, 健保.被扶養者の年齢の区分]
    出力: {申告の欄: false, 申告の範囲: false}
    年齢の境目:
      - {id: 健保.収入の基準額の60歳以上, 比べる年齢: 健保.判定日の年齢, 基準: 健保.被扶養者の年齢の区分.60歳以上, 判定の日: 判定日}
      - {id: 健保.収入の基準額の19歳以上, 比べる年齢: 健保.判定日の属する年の12月31日の年齢, 基準: 健保.被扶養者の年齢の区分.19歳以上, 判定の日: 判定日の属する年の12月31日, 判定日の下限: 健保.被扶養者の収入の基準額.健康保険.19歳以上23歳未満.適用開始日}
      - {id: 健保.収入の基準額の23歳未満, 比べる年齢: 健保.判定日の属する年の12月31日の年齢, 基準: 健保.被扶養者の年齢の区分.23歳未満, 判定の日: 判定日の属する年の12月31日, 判定日の下限: 健保.被扶養者の収入の基準額.健康保険.19歳以上23歳未満.適用開始日}
    注: >-
      年齢の境目（共有の担当。2026-11-12）は年齢の比較だけを説明する（障害者・被保険者の配偶者の区分は 健保.収入の基準額 の値で見る）。
      19歳以上23歳未満の区分は判定日（認定の対象の日）がパラメータの適用開始日（2025-10-01）以後のときだけ使う（パラメータの日付のキーは1月1日なので、
      適用開始日を値で持つ）。共済の障害者は大臣の定め（組合の案内も180万円：HANDOFF D22）。19歳以上23歳未満で障害者は180万円（読み）

  - id: 健保.配偶者の収入の基準額
    名称: 被保険者の配偶者として認定するときの年間収入の基準額（健康保険の区分：130万円、60歳以上又は障害者は180万円）（足した：国年の窓口）
    定義: {条文: 昭和52年4月6日 保発第9号・庁保発第9号、令和7年7月4日 保発0704第1号（19歳以上23歳未満の区分から配偶者を除く）, 根拠の種類: 通知・事務連絡, 出典: [docs/public-sources/20261109_R3-tsutatsu_shakaihoken-juminzei.md#1.1, docs/public-sources/20261109_R3-tsutatsu_shakaihoken-juminzei.md#1.2, docs/public-sources/20261109_round3_dai3go-notice-search.md#3.1]}
    層: 人の区分
