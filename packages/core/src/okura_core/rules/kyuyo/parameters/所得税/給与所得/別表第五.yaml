  note: >-
    最後の支払が12月1日前の給与等に旧の表を使う経過措置（令和7年法律第13号附則第9条第2項、令和8年法律第12号附則第13条第2項）は
    「源泉徴収に関する経過措置」で年末調整にだけ効くと読み、確定申告の給与所得には使わない。
    読みの支え：国税庁 Q&A（docs/public-sources/20261109_impl-prep_kyuyo-sources.md#4.2・#4.3。根拠の種類は国税庁の説明）。
