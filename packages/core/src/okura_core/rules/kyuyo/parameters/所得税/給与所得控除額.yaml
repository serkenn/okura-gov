description: >-
  所得税法第28条第3項の給与所得控除額のうち、収入金額が660万円以上で第28条第2項・第3項により給与所得の金額を
  求めるときに使う区分（660万円未満は第4項により別表第五、令和8・9年分の69万1千円以上220万円未満は措置法第29条の4第2項）。
  号の番号は令和7年分の版（第3号〜第5号）と令和8年分の版（第2号〜第4号）で違うが、文言と金額は同じ。
収入360万円超660万円以下:
  超:
    description: 区分の下端（三百六十万円を超え）
    metadata: &art28
      law: 所得税法第28条第3項（令和7年分の版の第3号・令和8年分の版の第2号「三百六十万円を超え六百六十万円以下」「百十六万円と…三百六十万円を控除した金額の百分の二十」）
      source_kind: 法律
      unit: 円
      reference:
        - docs/measurements/20261109_impl-prep_kyuyo-beppyo5.md#3.1
        - scripts/results/IMPL_kyuyo_fetch/articles_shotoku_2025-12-31.txt
        - scripts/results/IMPL_kyuyo_fetch/articles_shotoku_2026-12-01.txt
    values:
      2025-01-01: {value: 3600000, metadata: {比較: 超}}
  以下:
    description: 区分の上端（六百六十万円以下）
    metadata: *art28
    values:
      2025-01-01: {value: 6600000, metadata: {比較: 以下}}
  基礎:
    description: 控除額の基礎（百十六万円）
    metadata: *art28
    values:
      2025-01-01: {value: 1160000}
  率:
    分子:
      description: 超える部分に乗じる率の分子（百分の二十）
      metadata: *art28
      values:
        2025-01-01: {value: 20}
    分母:
      description: 超える部分に乗じる率の分母（百分の二十）
      metadata: *art28
      values:
        2025-01-01: {value: 100}
