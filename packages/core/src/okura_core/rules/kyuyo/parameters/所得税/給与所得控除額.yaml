収入360万円以下の第1区分:
  description: >-
    所得税法第28条第3項の収入360万円以下の第1の区分。令和7年分の版は第1号（190万円以下 65万円）、令和8年分の版は第1号
    （360万円以下 8万円＋収入金額の30%、最低69万円）。式の形を「基礎＋収入金額×率（最低額つき）」でそろえる
  以下:
    description: 区分の上端（以下）
    metadata: &art28low
      law: 所得税法第28条第3項第1号（令和7年分「百九十万円以下…六十五万円」、令和8年分「三百六十万円以下…八万円と…百分の三十…（…六十九万円に満たない場合には、六十九万円）」）
      source_kind: 法律
      unit: 円
      reference:
