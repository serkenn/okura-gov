# 概念辞書：規則モジュール kokuho（国民健康保険料〔税〕の法令の構造。SCOPE §5.4）が担当する概念。
# 項目の書き方は concepts/__init__.py の docstring。出典は docs のファイル#節（公開資料の情報・実測）だけ。
#
# 時点（timepoints.py）：年度 F の値は、所得の年分 F−1 の situation で計算する。市町村ごとの率・額・方式は注入データ（injection_points.py）。
# 2026-11-11：concepts/kokuho.yaml（担当のない制度の概念）の 国保.基礎控除後の総所得金額等・国保.軽減判定所得 をここへ移した。
# 2026-11-11（実装）：世帯の値（被保険者等の数・軽減判定所得・軽減の区分・保険料の額）のエンティティを 国保世帯 から 人物 に変えた
#   （evaluate の出力は人ごとの値だけ。世帯の値は世帯の全員に同じ値、保険料の額は世帯主に置く）。概念を足した（注に「足した」）。README §2。
制度: 国保
担当: kokuho
既定: {エンティティ: 人物, 期間: 年, 判定の時点: 年度, 実装済み: true}
概念:
  # =====================================================================
  # 世帯（グループ）と事実
  # =====================================================================
  - id: 国保.世帯
    名称: 国民健康保険料（税）の世帯（国保世帯のグループ。世帯主〔擬制世帯主を含む〕と世帯員）
    定義: {条文: 国民健康保険法第76条第1項（世帯主から徴収）、地方税法第703条の4第1項（世帯主に課する）, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_kokuho-premium-structure.md#1.1, docs/public-sources/20261109_round2_kokuho-premium-structure.md#1.2]}
    層: 人の区分
    エンティティ: 国保世帯
    値の型: 区分
    変数: []
    実装済み: false
    注: グループは RuleModule.groups が組み立てる（変数を持たない）。賦課期日（F年4月1日）の住民票の世帯（resident_record の household_id・householder）から組み立てる（inputs.build_groups）。住民票の記録がない人は自分だけの世帯。第116条・第116条の2 の人の世帯は 国保.被保険者か の注（2026-11-12）

  - id: 国保.被保険者か
    名称: その年度に国民健康保険の被保険者である期間があるか
    定義: {条文: 国民健康保険法第76条第1項、地方税法第703条の4第1項、国民健康保険法第116条・第116条の2, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_kokuho-premium-structure.md#1.1, docs/public-sources/20261109_round2_kokuho-premium-structure.md#1.2, docs/public-sources/20261112_impl-research4_kokuho-laws.md#1]}
    層: 事実
    値の型: 真偽
    変数: [国保_被保険者か]
    注入データ: [国保.児童福祉施設に措置入所した子の世帯]
    注: >-
      medical_insurance（scheme＝national_health_insurance）の資格の区間が年度と重なるか。2026-11-11：国保法第116条（修学中）の人は親の世帯にみなす（決まらなければ分かれ目：事実）。
      2026-11-12：第116条の2 の人は住所（市町村）を入院等の前日の住民票の市町村にみなし、世帯は事実の世帯（法令の読み）。児童福祉施設に措置入所した扶養義務者のいる子は
      注入データ 国保.児童福祉施設に措置入所した子の世帯（未注入なら事実の世帯と親元の世帯の2つの型）。市町村がみなした世帯（deemed_household_id）があればそれを使う

  - id: 国保.被保険者である月数
    名称: その年度の月のうち、月の全部の日で国民健康保険の被保険者である月の数
    定義: {条文: 国民健康保険法第76条第1項、地方税法第703条の4第1項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_kokuho-premium-structure.md#1.1, docs/public-sources/20261109_round2_kokuho-premium-structure.md#13]}
    層: 事実
    値の型: 整数
    変数: [国保_被保険者である月数]
    注: 月割りの方法は法令に見つからない（§13）。12 でない被保険者がいる世帯は注入データ 国保.年度の途中の資格の月割り を使う（未注入なら未確定。2026-11-11）

  - id: 国保.介護納付金賦課被保険者である月数
    名称: その年度の月のうち、月の全部の日で被保険者かつ介護保険法第9条第2号の被保険者（40歳以上65歳未満）である月の数
    定義: {条文: 国民健康保険法第76条第3項、国民健康保険法施行令第29条の7第1項第3号、介護保険法第9条第2号, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_kokuho-premium-structure.md#1.1, docs/public-sources/20261109_round2_kokuho-premium-structure.md#2.1]}
    層: 事実
    値の型: 整数
    変数: [国保_介護納付金賦課被保険者である月数]
    注: （足した）年齢は誕生日の前日に加える。0・12 以外（年度の途中の40歳・65歳の到達）の世帯は月割りの注入データを使う（2026-11-11）

  - id: 国保.十八歳以上被保険者か
    名称: 18歳に達する日以後の最初の3月31日の翌日以後である被保険者か（年度を通じて）
    定義: {条文: 国民健康保険法施行令第29条の7第5項第3号、地方税法第703条の4第34項・第35項, 根拠の種類: 政令, 出典: [docs/public-sources/20261109_round2_kokuho-premium-structure.md#3.1, docs/public-sources/20261109_round2_kokuho-premium-structure.md#9]}
    層: 事実
    値の型: 真偽
    変数: [国保_十八歳以上被保険者か]
    注: （足した）子ども・子育て支援納付金賦課額の18歳以上被保険者均等割と、18歳未満の被保険者均等割の全額減額に使う

  - id: 国保.特定同一世帯所属者か
    名称: 特定同一世帯所属者（国保から後期高齢者医療に移った人で、同じ世帯に属する人）か
    定義: {条文: 国民健康保険法施行令第29条の7第6項第1号、地方税法第703条の5第1項, 根拠の種類: 政令, 出典: [docs/public-sources/20261109_round2_kokuho-premium-structure.md#6.1, docs/public-sources/20261109_round2_kokuho-premium-structure.md#6.2]}
    層: 事実
    値の型: 真偽
    変数: [国保_特定同一世帯所属者か]
    注: kokuho_event（specified_same_household_member）が賦課期日を含むか。被保険者が1人の世帯（特定世帯・特定継続世帯）の平等割は注入データ 国保.特定世帯の世帯別平等割額 の額（2026-11-11）

  - id: 国保.未就学児か
    名称: 被保険者均等割の減額の対象の未就学児（6歳に達する日以後の最初の3月31日以前の被保険者）か
    定義: {条文: 国民健康保険法施行令第29条の7第6項第6号・第7号（料）、地方税法第703条の5第2項・同施行令第56条の89第3項（税）, 根拠の種類: 政令, 出典: [docs/public-sources/20261109_round2_kokuho-premium-structure.md#7]}
    層: 事実
    値の型: 真偽
    変数: [国保_未就学児か]
    注: 令和9年度から法律上18歳未満に広がる（政令の割合は未登録：§7・§13-1）。令和9年度の値は政令の基準の公表待ちで未確定

  - id: 国保.資産割の基礎の額
    名称: 資産割の算定の基礎（その年度の固定資産税額のうち土地・家屋に係る部分）
    定義: {条文: 国民健康保険法施行令第29条の7第2項第6号など（料）、地方税法第703条の4第8項など（税）, 根拠の種類: 政令, 出典: [docs/public-sources/20261109_round2_kokuho-premium-structure.md#3.1, docs/public-sources/20261109_round2_kokuho-premium-structure.md#3.2]}
    層: 事実
    値の型: 円
    変数: [国保_資産割の基礎の額]
    注: property_tax の land＋building（世帯の市町村のもの）。資産割の基礎が固定資産税額の全部のとき、償却資産の記録がある世帯は未確定（語彙がない）

  - id: 国保.非自発的失業者の特例の対象か
    名称: 非自発的失業者の特例（給与所得を100分の30とする）の対象の被保険者等か
    定義: {条文: 国民健康保険法施行令第29条の7の2、地方税法第703条の5の2, 根拠の種類: 政令, 出典: [docs/public-sources/20261109_round2_kokuho-premium-structure.md#4.3]}
    層: 事実
    値の型: 真偽
    変数: [国保_非自発的失業者の特例の対象か]
    注: （足した）kokuho_event（involuntary_unemployment）の離職の日の翌日の属する年度とその翌年度。減る額は段 国保の所得の段階 が書く（2026-11-11）

  - id: 国保.減免の承認があるか
    名称: 世帯に、その年度の保険料（税）の減免の承認（市町村・保険者の個別の処分）があるか
    定義: {条文: 国民健康保険法第77条、地方税法第717条, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_kokuho-premium-structure.md#1.1]}
    層: 事実
    値の型: 真偽
    変数: [国保_減免の承認があるか]
    出力: {申告の欄: false, 申告の範囲: false}
    注: >-
      （足した 2026-11-12。語彙の突き合わせ）authority_decision の reduction_approved（when.fiscal_year がその年度）が世帯の誰かにあれば真（世帯の全員に同じ値）。
      減免は条例・規約による個別の処分（国保法第77条：条例又は規約の定めるところにより特別の理由がある者に対し減免。国保税は地方税法第717条）で、
      要件と額は市町村の定め（仮説 round2 kokuho-core-vs-injected H1 の表「減免・徴収猶予：枠組みだけ」）。額は記録にないので、国保.保険料の額 は減免の前の
      賦課額のまま出し、この値で減免の承認があることを示す（減免の後の額を推し量らない：SCOPE §2-4）。

  - id: 国保.賦課の定め
    名称: 世帯の市町村の賦課の定め（料か税か、区分ごとの方式・率と額・賦課限度額、軽減の割合、未就学児の減額の割合）
    定義: {条文: 国民健康保険法第76条第1項・第81条、地方税法第703条の4第1項, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_kokuho-premium-structure.md#1.1, docs/public-sources/20261109_round2_kokuho-premium-structure.md#1.2, docs/public-sources/20261109_round2_kokuho-premium-structure.md#3.1]}
    層: 事実
    値の型: 区分
    変数: [国保_賦課の定め]
    パラメータ: [国保.賦課限度額, 国保.未就学児の均等割の減額の割合]
    注入データ: [国保.料か税か, 国保.賦課の方式, 国保.率と額, 国保.賦課限度額, 国保.軽減の割合, 国保.未就学児の均等割の減額, 国保.端数処理, 国保.年度の途中の資格の月割り, 国保.産前産後の減額の算定, 国保.特定世帯の世帯別平等割額]
    注: （足した）注入データを決定的な JSON の文字列にした入力（calc.rules_to_json）。率・額・方式・限度額が未注入、月割り・産前産後・特定世帯の注入データが要るのにない世帯は分かれ目（未確定）。端数処理は未注入なら3つの候補。限度額が政令の額を超える注入データは対象外（c-入力）

  - id: 国保.年度の政令の基準が登録されているか
    名称: その年度の政令の基準（軽減の基準額・賦課限度額）が、docs で確かめた法令の版に登録されているか
    定義: {条文: 国民健康保険法施行令第29条の7、地方税法施行令第56条の88の2・第56条の89, 根拠の種類: 政令, 出典: [docs/public-sources/20261109_round2_kokuho-premium-structure.md#5, docs/public-sources/20261109_round2_kokuho-premium-structure.md#13]}
    層: 事実
    値の型: 真偽
    変数: [国保_年度の政令の基準が登録されているか]
    パラメータ: [国保.政令の基準の年度]
    注: （足した）登録されていない年度（令和9年度）は分かれ目（公表待ち）を付け、依存する値は未確定

  - id: 国保.保険料の額が端数の定めなしで決まるか
    名称: 世帯の保険料（税）と所得割額の計算に、1円未満の端数（按分・減額）と国保税の課税標準の千円未満が生じないか
    定義: {条文: 国民健康保険法第81条、地方税法第20条の4の2, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_round2_kokuho-premium-structure.md#10]}
    層: 事実
    値の型: 真偽
    変数: [国保_保険料の額が端数の定めなしで決まるか]
    段階: 国保の端数の判定
    注: （足した）段階評価の段が、計算した基礎控除後の総所得金額等と軽減の区分から決める。国保税の課税標準の千円未満（一次情報で未確認）は両方で計算して分かれれば分かれ目、月割りの世帯で年額が限度額を超えれば月割りと限度額の順序の分かれ目（注入点に欄がない）。1円未満は注入データ 国保.端数処理（2026-11-11）

  - id: 国保.保険料の額が月割りと限度額の順序で変わらないか
    名称: 月割りの世帯で、賦課限度額を月割りの後の額に当てるか年額に当てるかで保険料の額が変わらないか
    定義: {条文: 国民健康保険法第81条、国民健康保険法施行令第29条の7第2項第9号ほか, 根拠の種類: 法律, 出典: [docs/public-sources/20261111_impl-research3_kokuho-laws.md#2, docs/public-sources/20261109_round2_kokuho-premium-structure.md#5]}
    層: 事実
    値の型: 真偽
    変数: [国保_保険料の額が月割りと限度額の順序で変わらないか]
    段階: 国保の端数の判定
    注: （足した 2026-11-11）月割りの世帯で年額が限度額を超える区分があれば分かれ目（注入：注入点 国保.年度の途中の資格の月割り に順序の欄がない。共有の担当への申し送り）

  - id: 国保.月割りの月数
    名称: 所得割・資産割・均等割を月割りする月数（月割りしない世帯の被保険者は12）
    定義: {条文: 国民健康保険法第81条（賦課額その他の賦課に関する事項は条例で定める）, 根拠の種類: 法律, 出典: [docs/public-sources/20261111_impl-research3_kokuho-laws.md#2, docs/public-sources/20261109_round2_kokuho-premium-structure.md#13]}
    層: 事実
    値の型: 整数
    変数: [国保_月割りの月数]
    注入データ: [国保.年度の途中の資格の月割り]
    注: >-
      （足した 2026-11-11）月割りは法令に定めがなく条例の事項（[PS3-KH] §2）。注入データが「月割りする・取得した月から喪失した月の前月まで」のとき、
      資格の区間からその数え方で数えた年度の月数。月割りしない世帯の被保険者は 12、被保険者でない人は 0

  - id: 国保.介護の月割りの月数
    名称: 介護納付金賦課額を月割りする月数（40歳に達した月から65歳に達した月の前月まで）
    定義: {条文: 国民健康保険法第81条、介護保険法第9条第2号, 根拠の種類: 法律, 出典: [docs/public-sources/20261111_impl-research3_kokuho-laws.md#2, docs/public-sources/20261109_round2_kokuho-premium-structure.md#13]}
    層: 事実
    値の型: 整数
    変数: [国保_介護の月割りの月数]
    注入データ: [国保.年度の途中の資格の月割り]
    注: （足した 2026-11-11）月割りしない世帯は、月の全部の日で介護納付金賦課被保険者である月があれば 12（従来の扱い）

  - id: 国保.産前産後の減額の月数
    名称: 産前産後の減額の期間のうち、年度の被保険者である月の数
    定義: {条文: 国民健康保険法施行令第29条の7第6項第8号・第9号、地方税法第703条の5第3項, 根拠の種類: 政令, 出典: [docs/public-sources/20261111_impl-research3_kokuho-laws.md#3, docs/public-sources/20261109_round2_kokuho-premium-structure.md#8]}
    層: 事実
    値の型: 整数
    変数: [国保_産前産後の減額の月数]
    注入データ: [国保.産前産後の減額の算定]
    注: >-
      （足した 2026-11-11）出産予定月の前月（多胎は3月前）から出産予定月の翌々月まで（kokuho_event の childbirth）。
      「期間に係る額を基準として算定した額」の1月分の割合は条例（注入データ）。注入されていなければ 0 で、保険料の額は分かれ目（注入）

  - id: 国保.介護の産前産後の減額の月数
    名称: 産前産後の減額の期間のうち、介護納付金賦課被保険者である月の数
    定義: {条文: 国民健康保険法施行令第29条の7第6項第8号・第9号, 根拠の種類: 政令, 出典: [docs/public-sources/20261111_impl-research3_kokuho-laws.md#3, docs/public-sources/20261109_round2_kokuho-premium-structure.md#8]}
    層: 事実
    値の型: 整数
    変数: [国保_介護の産前産後の減額の月数]
    注入データ: [国保.産前産後の減額の算定]
    注: （足した 2026-11-11）介護納付金賦課額の所得割額・均等割額も減額の対象（[KHP] §8）

  - id: 国保.非自発的失業者の特例で総所得金額から減る額
    名称: 非自発的失業者の特例で、給与所得を100分の30にして総所得金額から減る額（所得割の基礎）
    定義: {条文: 国民健康保険法施行令第29条の7の2、地方税法第703条の5の2, 根拠の種類: 政令, 出典: [docs/public-sources/20261109_round2_kokuho-premium-structure.md#4.3]}
    層: 事実
    値の型: 円
    変数: [国保_非自発的失業者の特例で総所得金額から減る額]
    段階: 国保の所得の段階
    注: >-
