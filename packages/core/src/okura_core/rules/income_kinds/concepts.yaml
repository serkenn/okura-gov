    層: 中心の概念
    依存する概念: [所得税.公的年金等の収入金額, 所得税.特定支出控除を当てた場合の公的年金等に係る雑所得以外の合計所得金額, 所得税.年齢]
    パラメータ: [所得税.公的年金等控除額]
    変数: [所得税_特定支出控除を当てた場合の公的年金等に係る雑所得の金額]
    実装済み: true
