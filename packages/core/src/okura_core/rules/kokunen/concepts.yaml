      - 概念: 所得税.控除対象扶養親族に当たるか
        説明: 特定年齢扶養親族は控除対象扶養親族に限る（国年令第6条の7）
        出典: [docs/public-sources/20261109_round2_kokuho-premium-structure.md#12.2]
    人をまたぐ依存:
      - 概念: 所得税.扶養親族に当たるか
        説明: 扶養所属のグループの扶養親族等の値を数える
        出典: [docs/public-sources/20261109_round2_kokuho-premium-structure.md#12.1]
      - 概念: 所得税.年齢
        説明: 扶養親族の年齢
        出典: [docs/public-sources/20261109_round2_kokuho-premium-structure.md#12.1]
      - 概念: 所得税.控除対象扶養親族に当たるか
        説明: 扶養親族が控除対象扶養親族か
        出典: [docs/public-sources/20261109_round2_kokuho-premium-structure.md#12.2]
    依存する概念: [国年.連鎖の扶養親族等の数]
    出力: {申告の欄: false, 申告の範囲: false}
    注: 扶養の連鎖の人（他の人の扶養親族等で、自分も申告者）は段 国年の扶養の連鎖の扶養親族等 が数えた数を足す（2026-11-12。以前は対象外）

