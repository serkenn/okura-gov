# テストの道具の規則モジュール（packages/core/tests/fixture_modules.py）。法令の概念ではない。
# 段階評価の読みが人のつながりをまたいだときに、つながりを足して評価し直すことを確かめるためだけに使う。
制度: 所得税
担当: test_parts_cross
既定: {エンティティ: 人物, 期間: 年, 判定の時点: 年分, 実装済み: true}
概念:
  - id: 所得税.試験_先頭の人の給与
    名称: 試験：先頭の人の給与等の収入金額（段階で書く入力。人のつながりをまたいで読む）
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R4-modeling_concepts.md#4.1]}
    層: 事実
    値の型: 円
    変数: [所得税_試験_先頭の人の給与]
    段階: 試験_先頭の人の給与を読む
    出力: {申告の欄: false, 申告の範囲: false}

  - id: 所得税.試験_人の判断
    名称: 試験：その人だけの判断の1か所（人のつながりを作らない）
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_R4-modeling_concepts.md#4.1]}
    層: 事実
    値の型: 真偽
    変数: [所得税_試験_人の判断]
    出力: {申告の欄: false, 申告の範囲: false}
