      - {概念: 所得税.特定支出控除を当てた場合の給与所得の金額, 説明: 所法57の2① を当てた給与所得の金額（64① の前）から令180② のいずれか低い金額を引く, 出典: [docs/public-sources/20261112_impl-research4_shotoku-laws-and-nta.md#1.1]}
      - {概念: 所得税.特定支出控除を当てた場合の回収不能額等に係る給与所得の金額の差額, 説明: 令180②二の額, 出典: [docs/public-sources/20261112_impl-research4_shotoku-laws-and-nta.md#1.1]}
    変数: [所得税_特定支出控除を当てた場合の回収不能額等の後の給与所得の金額]
