# テストの道具の規則モジュール（packages/core/tests/fixture_modules.py）。法令の概念ではない。
# 根拠のない端数の候補評価（D22 S3：金額は幅、判定が分かれたときだけ未確定）を確かめるためだけに使う。
制度: 所得税
担当: test_rounding
既定: {エンティティ: 人物, 期間: 年, 判定の時点: 年分, 実装済み: true}
概念:
  - id: 所得税.試験_端数の候補
    名称: 試験：端数の候補の名前（evaluate が候補ごとに入れる）
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#1.2]}
    層: 事実
    値の型: 区分
    変数: [所得税_試験_端数の候補]

  - id: 所得税.試験_三分の一
    名称: 試験：給与等の収入金額の3分の1（1円未満の端数の根拠がない）
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#1.2]}
    層: 所得の種類ごとの所得
    値の型: 円
    依存する概念: [所得税.給与等の収入金額, 所得税.試験_端数の候補]
    変数: [所得税_試験_三分の一]
    出力: {申告の欄: true, 申告の範囲: true}

  - id: 所得税.試験_三分の一が基準以下
    名称: 試験：3分の1が 333,333 円以下か
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#1.2]}
    層: 所得の種類ごとの所得
    値の型: 真偽
    依存する概念: [所得税.試験_三分の一]
    変数: [所得税_試験_三分の一が基準以下]
    出力: {申告の欄: false, 申告の範囲: false}
