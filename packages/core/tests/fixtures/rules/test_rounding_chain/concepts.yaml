# テストの道具の規則モジュール（packages/core/tests/fixture_modules.py）。法令の概念ではない。
# 根拠のない端数の分かれ目を、式が候補を引いたときだけ開く仕組み（evaluate）で、1つの候補を選んだときにだけ別の分かれ目が引かれる場合を確かめる。
制度: 所得税
担当: test_rounding_chain
既定: {エンティティ: 人物, 期間: 年, 判定の時点: 年分, 実装済み: true}
概念:
  - id: 所得税.試験_連鎖の端数の候補A
    名称: 試験：端数の候補の名前A
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#1.2]}
    層: 事実
    値の型: 区分
    変数: [所得税_試験_連鎖の端数の候補A]

  - id: 所得税.試験_連鎖の端数の候補B
    名称: 試験：端数の候補の名前B（Aの候補によって引かれる）
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#1.2]}
    層: 事実
    値の型: 区分
    変数: [所得税_試験_連鎖の端数の候補B]

  - id: 所得税.試験_連鎖の値
    名称: 試験：Aの丸めの結果が偶数のときだけBの候補を引く値
    定義: {条文: 試験の道具, 根拠の種類: 法律, 出典: [docs/public-sources/20261109_impl-prep_zeigaku-tax-calc.md#1.2]}
    層: 所得の種類ごとの所得
    値の型: 円
    依存する概念: [所得税.給与等の収入金額, 所得税.試験_連鎖の端数の候補A, 所得税.試験_連鎖の端数の候補B]
    変数: [所得税_試験_連鎖の値]
    出力: {申告の欄: false, 申告の範囲: false}
